// ---------- kratery, klony, efekt meteoru, ekran celowania ----------
function drawCraters() {
  for (const cr of craters) {
    const sx = cr.x - camera.x, sy = cr.y - camera.y;
    if (sx < -80 || sy < -80 || sx > W + 80 || sy > H + 80) continue;
    const age = CRATER_TIME - cr.t;
    const g = ctx.createRadialGradient(sx, sy, cr.r * 0.3, sx, sy, cr.r);
    g.addColorStop(0, 'rgba(8,5,3,0.96)');
    g.addColorStop(0.7, 'rgba(32,17,10,0.9)');
    g.addColorStop(1, 'rgba(64,36,20,0.45)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, cr.r, 0, Math.PI * 2); ctx.fill();
    if (age < 3) {   // świeży krater — żarzący się brzeg
      const k = 1 - age / 3;
      ctx.strokeStyle = 'rgba(255,' + Math.floor(110 + 90 * k) + ',40,' + (0.6 * k) + ')';
      ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(sx, sy, cr.r - 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(80,50,30,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, cr.r, 0, Math.PI * 2); ctx.stroke();
  }
}
function drawClones() {
  for (const c of clones) {
    const sx = c.x - camera.x, sy = c.y - camera.y;
    if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.fillStyle = 'rgba(120,210,255,0.15)';
    ctx.beginPath(); ctx.arc(0, 0, c.r + 7, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.rotate(c.aim);
    ctx.strokeStyle = 'rgba(240,250,255,0.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(c.r + 10 + (c.swingT > 0 ? 5 : 0), 0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = c.hurtT > 0 ? '#ffd6d6' : 'rgba(150,220,255,0.92)';
    ctx.strokeStyle = 'rgba(220,245,255,0.95)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    const w = 30, hh = 4, bx = sx - w / 2, by = sy - c.r - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx - 1, by - 1, w + 2, hh + 2);
    ctx.fillStyle = '#7ad6ff'; ctx.fillRect(bx, by, w * Math.max(0, c.hp / c.maxHp), hh);
  }
}
function drawMeteorFx() {
  for (const m of meteorFx) {
    const sx = m.x - camera.x, sy = m.y - camera.y;
    const f = m.t / 0.5;                 // 1 → 0
    ctx.strokeStyle = 'rgba(255,190,90,' + (f * 0.9) + ')'; ctx.lineWidth = 6 * f + 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx - 150 * f, sy - 300 * f); ctx.lineTo(sx, sy); ctx.stroke();
    const r = 100 * (1 - f) + 20;
    const g = ctx.createRadialGradient(sx, sy, 1, sx, sy, r);
    g.addColorStop(0, 'rgba(255,240,200,' + (f * 0.9) + ')');
    g.addColorStop(0.5, 'rgba(255,140,50,' + (f * 0.5) + ')');
    g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
  }
}
// ekran celowania (TELEPORT/METEOR) — przybliżona mapa, gra zamrożona
function drawAiming() {
  const z = AIM_ZOOM;
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-player.x, -player.y);
  const halfW = (W / 2) / z, halfH = (H / 2) / z;
  const wx0 = player.x - halfW, wy0 = player.y - halfH;
  const tx0 = Math.max(0, Math.floor(wx0 / TILE)), ty0 = Math.max(0, Math.floor(wy0 / TILE));
  const tx1 = Math.min(WT, Math.ceil((player.x + halfW) / TILE)), ty1 = Math.min(WT, Math.ceil((player.y + halfH) / TILE));
  ctx.fillStyle = 'hsl(' + theme.floorH + ',' + theme.floorS + '%,' + theme.floorL + '%)';
  ctx.fillRect(wx0, wy0, halfW * 2, halfH * 2);
  for (let ty = ty0; ty < ty1; ty++) for (let tx = tx0; tx < tx1; tx++) {
    if (solidArr[ty * WT + tx]) { ctx.fillStyle = 'hsl(' + theme.wallH + ',' + theme.wallS + '%,' + theme.wallL + '%)'; ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE); }
    else if (waterArr[ty * WT + tx]) { ctx.fillStyle = theme.poolDeep; ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE); }
  }
  for (const cr of craters) { ctx.fillStyle = 'rgba(20,12,8,0.92)'; ctx.beginPath(); ctx.arc(cr.x, cr.y, cr.r, 0, Math.PI * 2); ctx.fill(); }
  for (const e of enemies) {   // METEOR/TELEPORT — widać wszystkich wrogów
    ctx.fillStyle = e.isBoss ? '#ff5252' : '#ff8a5a';
    ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(11, e.r), 0, Math.PI * 2); ctx.fill();
  }
  for (const c of clones) { ctx.fillStyle = '#7ad6ff'; ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#4a86ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(player.x, player.y, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // reticle
  const wx = player.x + (mouse.x - W / 2) / z, wy = player.y + (mouse.y - H / 2) / z;
  const bad = targeting.mode === 'teleport' ? circleHitsWall(wx, wy, player.r) : isSolidAtWorld(wx, wy);
  ctx.strokeStyle = bad ? '#ff5555' : (targeting.mode === 'meteor' ? '#ffb04d' : '#8affc0');
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  if (targeting.mode === 'meteor') { ctx.beginPath(); ctx.arc(wx, wy, 96, 0, Math.PI * 2); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(wx, wy, 18, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(wx - 30, wy); ctx.lineTo(wx + 30, wy); ctx.moveTo(wx, wy - 30); ctx.lineTo(wx, wy + 30); ctx.stroke();
  ctx.restore();
  // dim + nagłówek + licznik
  ctx.fillStyle = 'rgba(6,8,12,0.18)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8;
  ctx.fillStyle = targeting.mode === 'meteor' ? '#ffb04d' : '#c39cff';
  ctx.font = '800 30px ' + FONT;
  ctx.fillText(targeting.mode === 'meteor' ? 'METEOR — click a target' : 'TELEPORT — click a spot', W / 2, 42);
  ctx.shadowBlur = 0;
  ctx.font = '600 15px ' + FONT; ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fillText('can\'t target walls  •  ESC to cancel  •  auto-resume in ' + Math.ceil(targeting.t) + ' s', W / 2, 72);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

// rysunek skrzyni (kolor wg rzadkości)
function drawChestIcon(cx, cy, sc, rarity, glow) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sc, sc);
  const col = RARITY_COL[rarity];
  if (glow > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 70);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = glow; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#3a2a18'; rr(-34, -4, 68, 34, 6); ctx.fill();   // korpus
  ctx.fillStyle = '#6b4a26'; rr(-34, -4, 68, 12, 6); ctx.fill();
  ctx.fillStyle = '#2a1d10'; rr(-36, -26, 72, 24, 7); ctx.fill();  // wieko
  ctx.fillStyle = '#5a3e20'; rr(-36, -26, 72, 12, 7); ctx.fill();
  ctx.fillStyle = col;                                              // okucia rzadkości
  rr(-36, -16, 72, 5, 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -2, 7, 0, Math.PI * 2); ctx.fill();   // zamek
  ctx.fillStyle = '#2a1d10';
  ctx.beginPath(); ctx.arc(0, -2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2; rr(-36, -26, 72, 56, 7); ctx.stroke();
  ctx.restore();
}

function drawShop() {
  chest.flash = Math.max(0, chest.flash - 0.03);
  ctx.fillStyle = 'rgba(6,8,14,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // nagłówek + monety
  ctx.font = '800 30px ' + FONT;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('WAVE ' + wave + ' CLEARED', W / 2, H * 0.10);
  ctx.font = '800 20px ' + FONT;
  ctx.fillStyle = '#ffd34d';
  ctx.fillText('● ' + coins + ' coins', W / 2, H * 0.10 + 34);

  const col = RARITY_COL[chest.rarity];
  if (!chest.opened) {
    // skrzynia do klikania (gamble rzadkości)
    drawChestIcon(W / 2, H * 0.34, 1.5, chest.rarity, chest.flash);
    ui.chestBox = { x: W / 2 - 70, y: H * 0.34 - 60, w: 140, h: 110 };
    ctx.font = '800 26px ' + FONT;
    ctx.fillStyle = col;
    ctx.fillText(RARITY[chest.rarity] + ' CHEST', W / 2, H * 0.34 + 78);
    ctx.font = '600 15px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('click the chest to upgrade its rarity — ' + chest.clicks + ' tries left', W / 2, H * 0.34 + 104);
    if (chest.rarity < 4) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '600 13px ' + FONT;
      ctx.fillText('next: ' + Math.round(CHEST_UP[chest.rarity] * 100) + '% to ' + RARITY[chest.rarity + 1], W / 2, H * 0.34 + 126);
    }
    ui.chestOpen = { x: W / 2 - 110, y: H * 0.60, w: 220, h: 50 };
    drawButton(ui.chestOpen, 'OPEN CHEST', true);
    ui.shopItems = [];
  } else {
    ui.chestBox = null; ui.chestOpen = null;
    ctx.font = '800 20px ' + FONT;
    ctx.fillStyle = col;
    ctx.fillText(RARITY[chest.rarity] + ' CHEST — pick what to buy', W / 2, H * 0.18 + 6);
    // 3 karty przedmiotów
    const n = chest.items.length;
    const cw = Math.min(230, (W - 80) / 3 - 16), ch = 150, gap = 18;
    const x0 = W / 2 - (cw * n + gap * (n - 1)) / 2;
    const y0 = H * 0.30;
    ui.shopItems = [];
    for (let i = 0; i < n; i++) {
      const c = chest.items[i];
      const x = x0 + i * (cw + gap);
      const afford = coins >= c.cost;
      ctx.fillStyle = 'rgba(30,33,44,0.95)';
      rr(x, y0, cw, ch, 12); ctx.fill();
      ctx.strokeStyle = c.bought ? '#4ad95c' : (afford ? col : 'rgba(255,255,255,0.18)');
      ctx.lineWidth = 2; rr(x, y0, cw, ch, 12); ctx.stroke();
      // % rzadkości w rogu
      ctx.font = '700 12px ' + FONT; ctx.textAlign = 'right';
      ctx.fillStyle = col;
      ctx.fillText(pct(c.track, c.lvl) + '%', x + cw - 10, y0 + 16);
      // nazwa + opis
      ctx.textAlign = 'center';
      ctx.font = '800 17px ' + FONT;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(itemName(c), x + cw / 2, y0 + 40);
      ctx.font = '600 13px ' + FONT;
      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.fillText(itemDesc(c), x + cw / 2, y0 + 66);
      // przycisk kup / kupione
      const br = { x: x + 20, y: y0 + ch - 46, w: cw - 40, h: 34 };
      if (c.bought) {
        ctx.fillStyle = 'rgba(74,217,92,0.25)'; rr(br.x, br.y, br.w, br.h, 9); ctx.fill();
        ctx.fillStyle = '#4ad95c'; ctx.font = '800 15px ' + FONT;
        ctx.fillText('BOUGHT', br.x + br.w / 2, br.y + br.h / 2 + 1);
      } else {
        const hov = inRect(br) && afford;
        ctx.fillStyle = afford ? (hov ? '#ffe177' : '#ffd34d') : 'rgba(255,255,255,0.08)';
        rr(br.x, br.y, br.w, br.h, 9); ctx.fill();
        ctx.fillStyle = afford ? '#1a1c24' : 'rgba(255,255,255,0.4)';
        ctx.font = '800 15px ' + FONT;
        ctx.fillText('BUY  ● ' + c.cost, br.x + br.w / 2, br.y + br.h / 2 + 1);
      }
      ui.shopItems.push({ rect: br, item: c });
    }
    if (n === 0) {
      ctx.font = '600 16px ' + FONT; ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('everything maxed out!', W / 2, H * 0.4);
    }
  }

  ui.nextWave = { x: W / 2 - 120, y: H * 0.78, w: 240, h: 52 };
  drawButton(ui.nextWave, 'NEXT WAVE ▶', false);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

let lastCursor = '';
function draw() {
  const cur = state === 'playing' ? 'none' : 'default';
  if (cur !== lastCursor) { canvas.style.cursor = cur; lastCursor = cur; }

  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, W, H);

  // tryb celowania (TELEPORT/METEOR) — przybliżona mapa zamiast normalnego widoku
  if (state === 'aiming') { drawAiming(); return; }

  // świat (w menu służy za tło)
  ctx.save();
  if (state === 'playing' && shake > 0) {
    ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  }
  drawFloor();
  drawTorches();
  if (theme.lava) drawLava();
  if (theme.decor === 'jungle') drawJungleDecor();
  drawCraters();
  if (state !== 'menu' && state !== 'setup' && state !== 'spellselect') {
    drawEnemies();
    drawAnglers();
  }
  drawClones();
  drawPlayer();
  if (state !== 'menu' && state !== 'setup' && state !== 'spellselect') {
    drawBullets();
    drawEnemyArrows();
    drawSpellFx();
    drawMeteorFx();
    if (theme.ember) drawHellAmbient();   // ogień/iskry + dym
  }
  ctx.restore();

  drawFog();

  if (state === 'playing') {
    drawOverlays();
    drawHUD();
    drawBossBar();
    drawWeaponBar();
    drawSpellBar();
    drawAnnounce();
    drawCrosshair();
  } else if (state === 'paused') {
    drawOverlays();
    drawHUD();
    drawBossBar();
    drawWeaponBar();
    drawSpellBar();
    drawPaused();
  } else if (state === 'shop') {
    drawShop();
  } else if (state === 'menu') {
    drawMenu();
  } else if (state === 'setup') {
    drawSetup();
  } else if (state === 'spellselect') {
    drawSpellSelect();
  } else if (state === 'dead') {
    drawDead();
  } else if (state === 'win') {
    drawWin();
  }
}

// ============================ START ============================
generateMaze();
computeFlow();
{
  const t = camTarget();
  camera.x = t.x;
  camera.y = t.y;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  sfx.musicForState(state);   // muzyka gra w trakcie gry i na pauzie
  sfx.musicTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
