<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUNGEONS LABIRYNTH</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14161c; }
  canvas { display: block; user-select: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

// ============================================================
//  DUNGEONS LABIRYNTH — strzelanka z falami wrogów (UI po angielsku)
//  Menu -> suwak liczby fal (5–50) -> gra.
//  WSAD — ruch | mysz — celowanie | LPM — atak
//  Strzałki lewo/prawo — zmiana broni:
//  SWORD / AXE / CROSSBOW / BOW (łuk naciąga się trzymając LPM)
//  Co 5. fala to BOSS WAVE — gracz dostaje połowę HP bossa.
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const fogCanvas = document.createElement('canvas');
const fogCtx = fogCanvas.getContext('2d');
const minimapCanvas = document.createElement('canvas');
const minimapCtx = minimapCanvas.getContext('2d');
const MM_SCALE = 2;                 // piksele minimapy na kafelek labiryntu

let W = 0, H = 0;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fogCanvas.width = W;
  fogCanvas.height = H;
}
window.addEventListener('resize', resize);
resize();

const FONT = '"Segoe UI", system-ui, Arial, sans-serif';

// ---------- stan gry ----------
// 'menu' | 'setup' (suwak fal) | 'playing' | 'paused' | 'dead' | 'win'
let state = 'menu';
let endLockT = 0;               // blokada klikania zaraz po śmierci/wygranej
let totalWaves = 10;            // wybierane suwakiem (max 50)

// ---------- świat / labirynt ----------
const TILE = 64;
const CELL = 4;                       // komórka labiryntu = 4 kafelki (korytarz 3 + ściana 1)
const MCOLS = 15, MROWS = 15;
const WT = MCOLS * CELL + 1;          // szerokość świata w kafelkach (61)
const WORLD_W = WT * TILE;
const WORLD_H = WT * TILE;
const WALL_LIFT = 12;                 // "wysokość" murów (pseudo 3D)

const solidArr = new Uint8Array(WT * WT);
const waterArr = new Uint8Array(WT * WT);   // 1 = kafelek "kałuży" (woda / dym)
const torches = [];                   // pochodnie na ścianach labiryntu
const lakes = [];                     // jeziorka: {cx,cy (świat), respawnT}
const jungleDecor = [];               // dekoracje dżungli: kwiaty, mech, pnącza, pęknięcia
const lavaPools = [];                 // kałuże lawy (HELL FORTRESS) — {x,y,r}

// ---------- motywy map ----------
const THEMES = {
  dungeons: {
    name: 'DUNGEONS LABIRYNTH', sub: 'the classic cold maze',
    floorH: 222, floorS: 14, floorL: 23, wallH: 222, wallS: 16, wallL: 33, wallFront: '#23272f',
    bg: '#101218', fog: '5,6,10', mini: '#7d87a5',
    pool: 'water', poolDeep: '#123a5e', poolShallow: '#1c4a78', poolWave: '120,190,255', poolMini: '#3a86ff',
    creature: 'angler',
  },
};
let mapKey = 'dungeons';
let theme = THEMES.dungeons;

function isWaterTile(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= WT || ty >= WT) return false;
  return waterArr[ty * WT + tx] === 1;
}
function isWaterAt(x, y) { return isWaterTile(Math.floor(x / TILE), Math.floor(y / TILE)); }

function isSolid(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= WT || ty >= WT) return true;
  return solidArr[ty * WT + tx] === 1;
}

function clearCol(tx, cy) {
  for (let i = 1; i < CELL; i++) solidArr[(cy * CELL + i) * WT + tx] = 0;
}
function clearRow(cx, ty) {
  for (let i = 1; i < CELL; i++) solidArr[ty * WT + cx * CELL + i] = 0;
}
function carveBetween(cx, cy, dx, dy) {
  if (dx === 1) clearCol((cx + 1) * CELL, cy);
  if (dx === -1) clearCol(cx * CELL, cy);
  if (dy === 1) clearRow(cx, (cy + 1) * CELL);
  if (dy === -1) clearRow(cx, cy * CELL);
}

function generateMaze() {
  for (let ty = 0; ty < WT; ty++)
    for (let tx = 0; tx < WT; tx++)
      solidArr[ty * WT + tx] = (tx % CELL === 0 || ty % CELL === 0) ? 1 : 0;

  // recursive backtracker — drąży korytarze
  const visited = new Uint8Array(MCOLS * MROWS);
  const startC = (MCOLS - 1) >> 1;
  const stack = [[startC, startC]];
  visited[startC * MCOLS + startC] = 1;
  while (stack.length) {
    const top = stack[stack.length - 1];
    const cx = top[0], cy = top[1];
    const neigh = [];
    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + d[0], ny = cy + d[1];
      if (nx >= 0 && ny >= 0 && nx < MCOLS && ny < MROWS && !visited[ny * MCOLS + nx]) neigh.push(d);
    }
    if (!neigh.length) { stack.pop(); continue; }
    const d = neigh[(Math.random() * neigh.length) | 0];
    carveBetween(cx, cy, d[0], d[1]);
    visited[(cy + d[1]) * MCOLS + (cx + d[0])] = 1;
    stack.push([cx + d[0], cy + d[1]]);
  }

  // dodatkowe przejścia (pętle)
  for (let i = 0; i < 50; i++) {
    if (Math.random() < 0.5) {
      const cx = (Math.random() * (MCOLS - 1)) | 0;
      const cy = (Math.random() * MROWS) | 0;
      carveBetween(cx, cy, 1, 0);
    } else {
      const cx = (Math.random() * MCOLS) | 0;
      const cy = (Math.random() * (MROWS - 1)) | 0;
      carveBetween(cx, cy, 0, 1);
    }
  }

  // kilka otwartych sal 2x2 komórki
  for (let i = 0; i < 4; i++) {
    const cx = 1 + ((Math.random() * (MCOLS - 3)) | 0);
    const cy = 1 + ((Math.random() * (MROWS - 3)) | 0);
    carveBetween(cx, cy, 1, 0);
    carveBetween(cx, cy, 0, 1);
    carveBetween(cx + 1, cy, 0, 1);
    carveBetween(cx, cy + 1, 1, 0);
    solidArr[((cy + 1) * CELL) * WT + (cx + 1) * CELL] = 0;
  }

  // jeziorka — bardzo mało (4), małe rozlewiska na otwartych polach, z dala od spawnu i od siebie
  waterArr.fill(0);
  lakes.length = 0;
  let placed = 0, tries = 0;
  while (placed < 4 && tries < 800) {
    tries++;
    const tx = 3 + ((Math.random() * (WT - 6)) | 0);
    const ty = 3 + ((Math.random() * (WT - 6)) | 0);
    if (isSolid(tx, ty)) continue;
    const x = tx * TILE + TILE / 2, y = ty * TILE + TILE / 2;
    if (Math.hypot(x - WORLD_W / 2, y - WORLD_H / 2) < 500) continue;   // nie przy spawnie
    let near = false;
    for (const l of lakes) if (Math.hypot(l.cx - x, l.cy - y) < 700) { near = true; break; }
    if (near) continue;
    // większe rozlewisko: otwarte pola w obszarze 5x5 (kształt zależy od korytarza)
    const blob = [];
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
      if (!isSolid(tx + dx, ty + dy)) blob.push([tx + dx, ty + dy]);
    if (blob.length < 10) continue;
    for (const b of blob) waterArr[b[1] * WT + b[0]] = 1;
    lakes.push({ cx: x, cy: y, respawnT: 12 });
    placed++;
  }

  // pochodnie — na widocznych (południowych) ściankach murów, z odstępami
  torches.length = 0;
  for (let ty = 1; ty < WT - 1; ty++) {
    for (let tx = 1; tx < WT - 1; tx++) {
      if (!solidArr[ty * WT + tx]) continue;          // tylko ściany
      if (solidArr[(ty + 1) * WT + tx]) continue;     // z podłogą od południa
      if (Math.random() > 0.25) continue;
      const x = tx * TILE + TILE / 2;
      const y = (ty + 1) * TILE;                      // dolna krawędź ścianki
      let tooClose = false;
      for (const t of torches) {
        if (Math.hypot(t.x - x, t.y - y) < 150) { tooClose = true; break; }
      }
      if (!tooClose) torches.push({ x: x, y: y });
    }
  }

  // dekoracje dżungli: świecące różowe kwiaty, mech, pnącza
  jungleDecor.length = 0;
  if (theme.decor === 'jungle') {
    for (let ty = 1; ty < WT - 1; ty++) {
      for (let tx = 1; tx < WT - 1; tx++) {
        const idx = ty * WT + tx;
        if (solidArr[idx]) {
          // pnącza zwisające ze ścian z podłogą poniżej
          if (!solidArr[(ty + 1) * WT + tx] && Math.random() < 0.16)
            jungleDecor.push({ t: 'vine', x: tx * TILE + 8 + Math.random() * (TILE - 16), y: (ty + 1) * TILE - WALL_LIFT, len: 22 + Math.random() * 46, ph: Math.random() * 6 });
        } else if (!waterArr[idx]) {
          const r = Math.random();
          if (r < 0.035) jungleDecor.push({ t: 'flower', x: tx * TILE + TILE * (0.25 + Math.random() * 0.5), y: ty * TILE + TILE * (0.25 + Math.random() * 0.5), ph: Math.random() * 6 });
          else if (r < 0.16) jungleDecor.push({ t: 'moss', x: tx * TILE + Math.random() * TILE, y: ty * TILE + Math.random() * TILE, s: 0.6 + Math.random() * 0.9, a: Math.random() * Math.PI });
          else if (r < 0.30) jungleDecor.push({ t: 'crack', x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2, seed: (tx * 71 + ty * 131) % 1000 });  // popękane płytki
        }
      }
    }
  }

  // kałuże lawy w HELL FORTRESS — z dala od spawnu, na otwartych polach
  lavaPools.length = 0;
  if (theme.lava) {
    let placed = 0, tries = 0;
    while (placed < 7 && tries < 600) {
      tries++;
      const tx = 2 + ((Math.random() * (WT - 4)) | 0), ty = 2 + ((Math.random() * (WT - 4)) | 0);
      if (isSolid(tx, ty) || waterArr[ty * WT + tx]) continue;
      const x = tx * TILE + TILE / 2, y = ty * TILE + TILE / 2;
      if (Math.hypot(x - WORLD_W / 2, y - WORLD_H / 2) < 480) continue;
      let near = false;
      for (const lv of lavaPools) if (Math.hypot(lv.x - x, lv.y - y) < 220) { near = true; break; }
      if (near) continue;
      lavaPools.push({ x: x, y: y, r: 30 + Math.random() * 24, ph: Math.random() * 6 });
      placed++;
    }
  }

  renderMinimap();
}

// statyczny obraz labiryntu do minimapy (rysowany raz na mapę)
function renderMinimap() {
  minimapCanvas.width = WT * MM_SCALE;
  minimapCanvas.height = WT * MM_SCALE;
  minimapCtx.fillStyle = 'rgba(14,16,24,0.9)';
  minimapCtx.fillRect(0, 0, WT * MM_SCALE, WT * MM_SCALE);
  for (let ty = 0; ty < WT; ty++) {
    for (let tx = 0; tx < WT; tx++) {
      if (solidArr[ty * WT + tx]) {
        minimapCtx.fillStyle = theme.mini;                 // ściany (kolor motywu)
        minimapCtx.fillRect(tx * MM_SCALE, ty * MM_SCALE, MM_SCALE, MM_SCALE);
      } else if (waterArr[ty * WT + tx]) {
        minimapCtx.fillStyle = theme.poolMini;             // kałuże (woda/dym)
        minimapCtx.fillRect(tx * MM_SCALE, ty * MM_SCALE, MM_SCALE, MM_SCALE);
      }
    }
  }
}

// ---------- gracz ----------
const BASE_HP = 100;
const player = {
  x: WORLD_W / 2,
  y: WORLD_H / 2,
  r: 13,
  speed: 270,
  hp: BASE_HP,
  maxHp: BASE_HP,
  aim: 0,
  moveDir: 0,
  walkPhase: 0,
  moving: false,
};

// ---------- bronie gracza ----------
// zmiana broni: strzałki lewo/prawo
const WEAPONS = [
  { name: 'SWORD',    dmg: 5, cd: 0.5, melee: true, reach: 55 },
  { name: 'BATTLE AXE', dmg: 7, cd: 2.0, melee: true, reach: 62, kb: 620, arc: 1.7 }, // duży odrzut, szerokie cięcie
  { name: 'CROSSBOW', dmg: 7, cd: 2.0, speed: 820, range: 620 },
  { name: 'BOW',      dmg: 6, cd: 1.0, speed: 700, range: 340, charge: true }, // naciągany, 1 s przeładowania
  { name: 'SPEAR',    dmg: 6, cd: 1.0, charge: true, spear: true },            // naciąg + szarża, 1 s przeładowania
  { name: 'DAGGERS',  dmg: 2, cd: 1.0, melee: true, reach: 46, stun: 0.75 },   // 2 dmg, ogłusza wroga na 0,75 s
];
let weaponIdx = 2;                 // start z kuszą
let cooldowns = [0, 0, 0, 0, 0, 0]; // osobne przeładowanie każdej broni
let playerSwingT = 0;              // animacja zamachu mieczem/toporem
let bowCharge = 0;                 // czas naciągania łuku/włóczni (0.5 s = 1 dmg, max 6)
const BOW_MAX_CHARGE = 3;

// szarża włócznią — po puszczeniu LPM postać rusza do przodu i zwalnia,
// a zadawane obrażenia spadają o 1 na sekundę (minimum 0.5)
const spearDash = { speed: 0, vx: 0, vy: 0, dmg: 0, hit: null };

// ---------- tarcza (PPM) ----------
let shieldHeld = false;      // trzymany prawy przycisk myszy
let shieldBrokenT = 0;       // > 0: tarcza rozbita przez battle axe, przeładowuje się
function shieldActive() { return shieldHeld && shieldBrokenT <= 0 && state === 'playing'; }

// ---------- dźwięki ----------
// Wszystkie dźwięki generowane proceduralnie (Web Audio API) — bez plików.
const sfx = (function () {
  let ac = null, master = null, muted = false, volume = 0.8;
  const last = {};

  function ensure() {
    if (ac) return ac;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();
      master = ac.createGain();                 // głośność (suwak)
      master.gain.value = volume;
      const comp = ac.createDynamicsCompressor(); // limiter — pozwala grać głośno bez przesterowania
      comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 4;
      comp.attack.value = 0.003; comp.release.value = 0.12;
      const makeup = ac.createGain();            // podbicie po kompresji
      makeup.gain.value = 1.5;
      master.connect(comp); comp.connect(makeup); makeup.connect(ac.destination);
    } catch (e) { ac = null; }
    return ac;
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume(); }
  function applyGain() { if (master) master.gain.value = muted ? 0 : volume; }
  function toggle() { muted = !muted; applyGain(); return muted; }
  function isMuted() { return muted; }
  function setVolume(v) { volume = v < 0 ? 0 : v > 1 ? 1 : v; muted = false; applyGain(); }
  function getVolume() { return volume; }
  // ogranicza nakładanie identycznych dźwięków (gap w sekundach)
  function can(name, gap) {
    if (!ac) return false;
    const t = ac.currentTime;
    if (last[name] && t - last[name] < gap) return false;
    last[name] = t;
    return true;
  }
  function tone(o) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1 != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    const vol = o.vol == null ? 0.25 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.at || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + o.dur + 0.03);
  }
  function noise(o) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const n = Math.max(1, Math.ceil(ac.sampleRate * o.dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.f0, t);
    if (o.f1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    f.Q.value = o.q || 1;
    const g = ac.createGain();
    const vol = o.vol == null ? 0.25 : o.vol;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + o.dur + 0.03);
  }
  // sekwencja tonów (fanfary, melodyjki) — przez lowpass, by nie piszczało
  function seq(notes, type, vol) {
    if (!ac || muted) return;
    let dt = 0;
    for (const nn of notes) {
      const t0 = ac.currentTime + dt;
      const osc = ac.createOscillator(), g = ac.createGain();
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(nn.f, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol == null ? 0.32 : vol, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + nn.d);
      osc.connect(f); f.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + nn.d + 0.03);
      dt += nn.d;
    }
  }
  // ---- muzyka w tle (proceduralna pętla, sterowana z pętli gry) ----
  let musicGain = null, musicOn = false, mStep = 0, mNext = 0, intensity = 0, schedTimer = 0;
  const MUSIC_VOL = 0.7;
  // mroczne, niskie akordy (d-moll/frygijski) — zmieniają się w LOSOWYCH odstępach,
  // więc nie słychać pętli. {c:akord, b:root drona}
  const DARK = [
    { c: [38, 41, 45], b: 26 },   // Dm  (D2 F2 A2)
    { c: [34, 38, 41], b: 22 },   // Bb  (Bb1 D2 F2)
    { c: [36, 39, 43], b: 24 },   // Cm  (C2 Eb2 G2)
    { c: [33, 38, 41], b: 21 },   // dla napięcia (A1 + Dm-ish)
    { c: [31, 34, 38], b: 19 },   // Gm  (G1 Bb1 D2)
  ];
  let darkIdx = 0, chordBars = 0;
  function mfreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function stepLen() { return 60 / (intensity ? 66 : 52) / 4; }   // wolno, atmosferycznie
  // ciepły pad — rozstrojone piły przez lowpass; długie wybrzmienie zachodzi
  // na następny takt (przenikanie) => brak ciszy/pauzy na styku
  function mpad(midis, t, dur) {
    const filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 0.6;
    filt.frequency.setValueAtTime(360, t);                        // ciemno, przytłumione
    filt.frequency.linearRampToValueAtTime(intensity ? 620 : 480, t + dur * 0.5);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.09, t + 1.0);                // bardzo wolny atak (mgła)
    g.gain.setValueAtTime(0.09, t + Math.max(1.1, dur - 1.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);         // długi crossfade
    filt.connect(g); g.connect(musicGain);
    for (const m of midis) {
      for (const det of [-8, 8]) {
        const o = ac.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = mfreq(m);
        o.detune.value = det;                                      // rozstrojenie = ciepło
        o.connect(filt); o.start(t); o.stop(t + dur + 0.05);
      }
    }
  }
  // okrągły bas (triangle + sub-sine) przez lowpass
  function mbass(freq, t, dur, vol) {
    const filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 380;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const o1 = ac.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq / 2;
    o1.connect(filt); o2.connect(filt); filt.connect(g); g.connect(musicGain);
    o1.start(t); o1.stop(t + dur + 0.03); o2.start(t); o2.stop(t + dur + 0.03);
  }
  // niepokojący, odległy dźwięk (sinus z lekkim rozstrojeniem, wolny atak/długi zanik)
  function mshimmer(freq, t, vol) {
    const filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 1600; filt.Q.value = 0.6;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.25);   // wolne narastanie (nie „pik")
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6); // długi, mglisty zanik
    const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq; o2.detune.value = 11;
    o1.connect(filt); o2.connect(filt); filt.connect(g); g.connect(musicGain);
    o1.start(t); o1.stop(t + 2.7); o2.start(t); o2.stop(t + 2.7);
  }
  // ciche „bicie serca" — bardzo niski, głuchy puls
  function mthud(t, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(80, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.18);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.3);
  }
  // odległy szum/podmuch — niskie pasmo, narasta i cichnie (atmosfera lochu)
  function mswell(t, vol) {
    const dur = 1.6 + Math.random() * 1.4, n = Math.max(1, Math.ceil(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 180 + Math.random() * 220; f.Q.value = 1.2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(musicGain);
    src.start(t); src.stop(t + dur + 0.05);
  }
  // mroczny ambient — dron + pad ze zmianą akordu w losowych odstępach,
  // ciche bicie serca i rzadkie, niepokojące tła (bez melodii/pętli)
  function mStepAt(g, t) {
    const s = g % 16;
    const sd = stepLen();
    const barLen = sd * 16;
    if (s === 0) {
      if (chordBars <= 0) {                  // zmiana akordu co 2–4 takty, losowo
        let n; do { n = (Math.random() * DARK.length) | 0; } while (n === darkIdx && DARK.length > 1);
        darkIdx = n;
        chordBars = 2 + ((Math.random() * 3) | 0);
      }
      chordBars--;
      const D = DARK[darkIdx];
      mpad(D.c, t, barLen + 1.3);            // ciemny pad zachodzący na następny takt
      mbass(mfreq(D.b), t, barLen + 1.0, intensity ? 0.34 : 0.26);  // niski dron
    }
    // ciche bicie serca: co takt (na boss szybciej i mocniej)
    const bar = Math.floor(g / 16);
    if (s === 0) mthud(t, intensity ? 0.34 : 0.22);
    if (intensity && s === 8) mthud(t, 0.3);
    else if (!intensity && s === 8 && bar % 2 === 0) mthud(t, 0.14);
    // rzadkie, niepokojące tła — losowo, więc nigdy tak samo
    if (s % 4 === 0 && Math.random() < (intensity ? 0.30 : 0.16)) {
      const D = DARK[darkIdx];
      if (Math.random() < 0.5) {
        // odległy, wysoki, mglisty dźwięk (czasem dysonujący — niepokój)
        const note = D.c[(Math.random() * D.c.length) | 0] + 24 + (Math.random() < 0.3 ? 1 : 0);
        mshimmer(mfreq(note), t, intensity ? 0.10 : 0.07);
      } else {

      }
    }
  }
  function startMusic() {
    if (!ac) return;
    if (!musicGain) { musicGain = ac.createGain(); musicGain.gain.value = MUSIC_VOL; musicGain.connect(master); }
    musicOn = true; mStep = 0; mNext = ac.currentTime + 0.15;
    if (schedTimer) clearInterval(schedTimer);
    // scheduler niezależny od klatek — gra płynnie nawet przy zacięciach FPS

  function musicForState(st) {
    const want = (st === 'playing' || st === 'paused' || st === 'shop');

  }
  function musicTick() {
    if (!ac || !musicOn) return;
    // tylko po DUŻYM opóźnieniu (powrót z tła) skok do teraz; drobne zaległości
    // są planowane normalnie => brak gubienia nut i brak pauzy

    while (mNext < ahead) {

    }

    dagger() { if (can('dagger', 0.04)) { noise({ filter: 'highpass', f0: 3200, f1: 1600, q: 0.5, dur: 0.07, vol: 0.24 }); tone({ type: 'triangle', f0: 2600, f1: 1700, dur: 0.05, vol: 0.12 }); } },
    crossbow() { if (can('crossbow', 0.05)) { tone({ type: 'square', f0: 180, f1: 80, dur: 0.1, vol: 0.3 }); noise({ filter: 'highpass', f0: 2000, dur: 0.05, vol: 0.2 }); } },
    bow() { if (can('bow', 0.05)) { tone({ type: 'triangle', f0: 420, f1: 150, dur: 0.16, vol: 0.3 }); noise({ filter: 'highpass', f0: 1800, dur: 0.06, vol: 0.12 }); } },

    spear() { if (can('spear', 0.05)) { noise({ filter: 'lowpass', f0: 900, f1: 200, q: 0.8, dur: 0.32, vol: 0.32 }); tone({ type: 'sawtooth', f0: 300, f1: 120, dur: 0.3, vol: 0.2 }); } },

const COST = { speed: [100, 150, 200], atk: [150, 215, 290], spell: [185, 250, 330], vision: [245, 290, 310], reload: [250, 300, 335], heal: [300, 325, 350] };
const BASE_PCT = { speed: [85, 70, 50], atk: [45, 30, 15], spell: [30, 20, 10], vision: [65, 40, 30], reload: [30, 15, 5], heal: [20, 10, 5] };
// koszty ulepszeń specjalnych czarów (per id) — inne niż zwykłe czary

// koszt ulepszenia danego czaru na poziom lvl (1/2/3)
function spellItemCost(si, lvl) { return (SPELL_COST[SPELLS[si].id] || COST.spell)[lvl - 1]; }

// skumulowany bonus obrażeń broni: poziom 1->+1, 2->+3, 3->+6
function atkBonus(i) { return [0, 1, 3, 6][atkLvl[i]] || 0; }

function spellDmgBonus(si) { return [0, 3, 5, 7][spellLvl[si]] || 0; }
function visionShift() { return Math.max(10, VISION_SHIFT - visionLvl * 40); } // mniejszy shift = więcej widać z tyłu

function openShopAfterWave() {
  chest.rarity = 0; chest.clicks = 6; chest.opened = false; chest.items = []; chest.flash = 0;
  sfx.setIntensity(0);   // spokojna muzyka w sklepie
  state = 'shop';

function clickChest() {
  if (chest.opened || chest.clicks <= 0) return;
  chest.clicks--;
  if (chest.rarity < 4 && Math.random() < CHEST_UP[chest.rarity]) { chest.rarity++; chest.flash = 0.4; sfx.spawn(); }
  else { chest.flash = 0.15; sfx.click(); }
  if (chest.clicks <= 0) revealChest();
}
function pct(track, lvl) {  // szansa danej rzeczy, podbita rzadkością skrzyni (cap 97)
  return Math.min(97, BASE_PCT[track][lvl - 1] + chest.rarity * 6 + (lvl > 1 ? chest.rarity * 3 : 0));
}
function revealChest() {
  chest.opened = true;
  // kandydaci: następny poziom każdej dostępnej ścieżki (warunek: trzeba mieć poprzedni)
  const cand = [];
  if (speedLvl < 3) cand.push({ track: 'speed', lvl: speedLvl + 1 });
  if (visionLvl < 3) cand.push({ track: 'vision', lvl: visionLvl + 1 });
  if (reloadLvl < 3) cand.push({ track: 'reload', lvl: reloadLvl + 1 });
  if (healLvl < 3) cand.push({ track: 'heal', lvl: healLvl + 1 });
  for (let i = 0; i < WEAPONS.length; i++) if (atkLvl[i] < 3) cand.push({ track: 'atk', idx: i, lvl: atkLvl[i] + 1 });
  for (const si of chosenSpells) if (si !== null && spellLvl[si] < 3) cand.push({ track: 'spell', idx: si, lvl: spellLvl[si] + 1 });  // tylko wybrane 3 czary
  for (const c of cand) c.w = pct(c.track, c.lvl);
  // losuj 3 różne, ważone szansą
  const items = [];
  const pool = cand.slice();
  for (let k = 0; k < 3 && pool.length; k++) {
    let tot = 0; for (const c of pool) tot += c.w;
    let r = Math.random() * tot, pick = 0;
    for (let j = 0; j < pool.length; j++) { r -= pool[j].w; if (r <= 0) { pick = j; break; } }
    const c = pool.splice(pick, 1)[0];
    c.cost = c.track === 'spell' ? spellItemCost(c.idx, c.lvl) : COST[c.track][c.lvl - 1];
    c.bought = false;
    items.push(c);
  }
  chest.items = items;
}

  if (c.track === 'heal') return 'HEALTH ' + c.lvl;

  if (id === 'meteor') return '+' + [5, 10, 15][c.lvl - 1] + ' damage';

  return '+' + [2, 3, 3.5][c.lvl - 1] + 's / +' + [3, 5, 7][c.lvl - 1] + ' dmg';

function buyItem(c) {
  if (c.bought || coins < c.cost) return;
  coins -= c.cost;
  c.bought = true;

  else if (c.track === 'vision') visionLvl = c.lvl;
  else if (c.track === 'reload') reloadLvl = c.lvl;

// regeneracja po każdej fali:
// poniżej połowy HP -> uzupełnia do połowy, powyżej -> dolewa ćwiartkę maksa
function applyWaveRegen() {
  const before = player.hp;
  const half = Math.round(player.maxHp / 2);
  if (player.hp < half) {
    player.hp = half;
  } else {
    player.hp = Math.min(player.maxHp, Math.round(player.hp + player.maxHp * 0.25));
  }
  lastRegen = Math.round(player.hp - before);
}

// ============================ KAMERA ============================
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

const camera = { x: 0, y: 0 };
function camTarget() {
  return {
    x: clamp(player.x - W / 2, 0, Math.max(0, WORLD_W - W)),
    y: clamp(player.y - H / 2, 0, Math.max(0, WORLD_H - H)),
  };
}
function updateCamera(dt) {
  const t = camTarget();
  const k = Math.min(1, dt * 8);
  camera.x += (t.x - camera.x) * k;
  camera.y += (t.y - camera.y) * k;
}

// ============================ KOLIZJE ZE ŚCIANAMI ============================
function circleHitsWall(x, y, r) {
  const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
  const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (!isSolid(tx, ty)) continue;
      const cx = clamp(x, tx * TILE, (tx + 1) * TILE);
      const cy = clamp(y, ty * TILE, (ty + 1) * TILE);
      const dx = x - cx, dy = y - cy;
      if (dx * dx + dy * dy < r * r) return true;
    }
  }
  // kratery po meteorze — nieprzejezdne
  for (const cr of craters) {
    const dx = x - cr.x, dy = y - cr.y, rr2 = cr.r + r;
    if (dx * dx + dy * dy < rr2 * rr2) return true;
  }
  return false;
}
function isSolidAtWorld(x, y) { return isSolid(Math.floor(x / TILE), Math.floor(y / TILE)); }

// kwadrat odległości punktu od odcinka — kolizje pocisków po całym torze lotu
function segDist2(x0, y0, x1, y1, px, py) {
  const dx = x1 - x0, dy = y1 - y0;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - x0) * dx + (py - y0) * dy) / len2;
  t = clamp(t, 0, 1);
  const cx = x0 + dx * t, cy = y0 + dy * t;
  const ex = px - cx, ey = py - cy;
  return ex * ex + ey * ey;
}

function moveCircle(px, py, dx, dy, r) {
  let x = px + dx;
  if (circleHitsWall(x, py, r)) {
    if (dx > 0) x = Math.floor((x + r) / TILE) * TILE - r - 0.01;
    else if (dx < 0) x = (Math.floor((x - r) / TILE) + 1) * TILE + r + 0.01;
    if (circleHitsWall(x, py, r)) x = px;
  }
  let y = py + dy;
  if (circleHitsWall(x, y, r)) {
    if (dy > 0) y = Math.floor((y + r) / TILE) * TILE - r - 0.01;
    else if (dy < 0) y = (Math.floor((y - r) / TILE) + 1) * TILE + r + 0.01;
    if (circleHitsWall(x, y, r)) y = py;
  }
  return { x: x, y: y };
}

// ============================ RAYCASTING ============================
function castRay(x, y, ang, maxDist) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  const stepX = dx > 0 ? 1 : -1;
  const stepY = dy > 0 ? 1 : -1;
  const tDeltaX = dx !== 0 ? Math.abs(TILE / dx) : Infinity;
  const tDeltaY = dy !== 0 ? Math.abs(TILE / dy) : Infinity;
  let tMaxX = dx !== 0 ? ((dx > 0 ? (tx + 1) * TILE - x : x - tx * TILE) / Math.abs(dx)) : Infinity;
  let tMaxY = dy !== 0 ? ((dy > 0 ? (ty + 1) * TILE - y : y - ty * TILE) / Math.abs(dy)) : Infinity;
  let t = 0;
  while (true) {
    if (tMaxX < tMaxY) { t = tMaxX; tMaxX += tDeltaX; tx += stepX; }
    else { t = tMaxY; tMaxY += tDeltaY; ty += stepY; }
    if (t > maxDist) return maxDist;
    if (isSolid(tx, ty)) return t;
  }
}

function hasLOS(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0);
  if (d < 1) return true;
  return castRay(x0, y0, Math.atan2(y1 - y0, x1 - x0), d) >= d - 0.5;
}

// ============================ NAWIGACJA WROGÓW (flow field) ============================
const flow = new Int16Array(WT * WT);
let flowTimer = 0;

function computeFlow() {
  flow.fill(-1);
  const ptx = clamp(Math.floor(player.x / TILE), 0, WT - 1);
  const pty = clamp(Math.floor(player.y / TILE), 0, WT - 1);
  if (isSolid(ptx, pty)) return;
  flow[pty * WT + ptx] = 0;
  const q = [ptx, pty];
  for (let i = 0; i < q.length; i += 2) {
    const tx = q[i], ty = q[i + 1];
    const d = flow[ty * WT + tx];
    for (const dir of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = tx + dir[0], ny = ty + dir[1];
      if (nx < 0 || ny < 0 || nx >= WT || ny >= WT) continue;
      const idx = ny * WT + nx;
      if (solidArr[idx] === 0 && flow[idx] === -1) {
        flow[idx] = d + 1;
        q.push(nx, ny);
      }
    }
  }
}

function flowDir(x, y) {
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  if (tx < 0 || ty < 0 || tx >= WT || ty >= WT) return null;
  const here = flow[ty * WT + tx];
  if (here < 0) return null;
  if (here === 0) {
    const d = Math.hypot(player.x - x, player.y - y) || 1;
    return { x: (player.x - x) / d, y: (player.y - y) / d };
  }
  let bestD = here, bx = tx, by = ty;
  for (const dir of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = tx + dir[0], ny = ty + dir[1];
    if (nx < 0 || ny < 0 || nx >= WT || ny >= WT) continue;
    const f = flow[ny * WT + nx];
    if (f >= 0 && f < bestD) { bestD = f; bx = nx; by = ny; }
  }
  if (bx === tx && by === ty) return null;
  const cx = bx * TILE + TILE / 2, cy = by * TILE + TILE / 2;
  const d = Math.hypot(cx - x, cy - y) || 1;
  return { x: (cx - x) / d, y: (cy - y) / d };
}

const SPAWN_SAFE_R = 380;   // strefa wokół spawnu gracza (środka mapy) bez wrogów

function randomFreeTileFar(minDist) {
  for (let tries = 0; tries < 300; tries++) {
    const tx = 1 + ((Math.random() * (WT - 2)) | 0);
    const ty = 1 + ((Math.random() * (WT - 2)) | 0);
    if (isSolid(tx, ty)) continue;
    const x = tx * TILE + TILE / 2, y = ty * TILE + TILE / 2;
    if (Math.hypot(x - player.x, y - player.y) < minDist) continue;
    if (Math.hypot(x - WORLD_W / 2, y - WORLD_H / 2) < SPAWN_SAFE_R) continue;  // nie przy spawnie
    return { x: x, y: y };
  }
  return null;
}

// limit liczby wrogów zależny od fali
// maks. wrogów jednocześnie na mapie (zależnie od fali)
function maxEnemiesForWave(w) {
  if (w <= 5) return 10;
  if (w <= 10) return 12;
  if (w <= 15) return 15;
  if (w <= 25) return 17;
  if (w <= 35) return 20;
  if (w <= 45) return 22;
  return 25;
}

function rollEnemyType() {
  const r = Math.random();
  if (r < 0.06) return 'wlocznia';   // mega rzadko ktoś ma włócznię
  if (r < 0.26) return 'luk';        // tylko nieliczni mają łuki
  return 'miecz';
}

function makeEnemy(x, y) {
  const hpMul = 1 + Math.floor((wave - 1) / 5) * 0.25;  // hp wrogów rośnie skokowo co 5 fal
  const type = rollEnemyType();
  const big = type === 'miecz' && Math.random() < 0.25; // łucznicy/włócznicy to ci słabsi
  const hp = Math.round((big ? 50 : 25) * hpMul);
  return {
    x: x, y: y,
    type: type,
    isBoss: false,
    r: big ? 16 : 13,
    hp: hp, maxHp: hp,
    dmg: 20,
    reach: type === 'wlocznia' ? 26 : 14,   // włócznia ma dłuższy zasięg
    attackCD: 1.1,
    speed: (type === 'luk' ? 95 : 125) * (big ? 0.8 : 1) * (0.9 + Math.random() * 0.2),
    aim: Math.random() * Math.PI * 2,
    walkPhase: Math.random() * 6,
    moving: false,
    attackT: 0,
    swingT: 0,
    shootT: 1 + Math.random(),
    hurtT: 0,
    frozenT: 0, noAtkT: 0, pushT: 0, pushVx: 0, pushVy: 0, burnCd: 0,
    alertT: 0,                  // > 0: ściga gracza; 0: patroluje
    wanderT: 0,
    wanderA: null,
    fishTarget: null, fishT: 0,  // anglerfish, który go ugryzł (oddaje mu)
  };
}

function spawnWave() {
  const isBossWave = wave % 5 === 0;
  const cap = maxEnemiesForWave(wave);            // ilu naraz na mapie
  waveKills = 0;
  let count;
  if (isBossWave) {
    // boss-wave: boss + garstka minionów; kończy się śmiercią bossa
    count = Math.max(3, Math.floor(cap * 0.5));
    waveReserve = count;                          // tyle minionów może się odrodzić
    waveKillTarget = Infinity;                    // o końcu decyduje śmierć bossa
  } else {
    // normalna fala: arena ciągle dopełniana do limitu, koniec po pokonaniu POŁOWY limitu
    count = cap;
    waveReserve = 9999;                           // praktycznie nieograniczone dopełnianie
    waveKillTarget = Math.ceil(cap / 2);          // np. 5 na fali 1
  }
  respawnTimer = 1.0;

  for (let i = 0; i < count; i++) {
    const pos = randomFreeTileFar(650);
    if (!pos) continue;
    enemies.push(makeEnemy(pos.x, pos.y));
  }

  if (isBossWave) {
    const bossNum = wave / 5;                    // 1. boss, 2. boss...
    const bossHp = 500 + 250 * (bossNum - 1);    // 500, 750, 1000...
    const pos = randomFreeTileFar(700) || { x: player.x + 600, y: player.y };
    enemies.push({
      x: pos.x, y: pos.y,
      type: 'topor',           // battle axe — mają go tylko bossy
      isBoss: true,
      r: 26,
      hp: bossHp, maxHp: bossHp,
      dmg: 43,                 // 40 + 3 bonusu bossa
      reach: 14,
      attackCD: 1.3,
      speed: 95,
      aim: 0,
      walkPhase: 0,
      moving: false,
      attackT: 0,
      swingT: 0,
      shootT: 99,
      hurtT: 0,
      frozenT: 0, noAtkT: 0, pushT: 0, pushVx: 0, pushVy: 0, burnCd: 0,
      alertT: 0,
      wanderT: 0,
      wanderA: null,
      fishTarget: null, fishT: 0,
    });
    // na boss wave gracz dostaje połowę HP bossa (1. boss 500 -> gracz 250), ale nie mniej niż jego normalne maks.
    player.maxHp = Math.max(normalMaxHp, Math.round(bossHp / 2));
    player.hp = player.maxHp;
  }

  announceText = isBossWave ? 'BOSS WAVE' : 'WAVE ' + wave;
  announceColor = isBossWave ? '#ff6552' : '#ffd34d';
  if (isBossWave) sfx.boss(); else sfx.wave();
  sfx.setIntensity(isBossWave ? 1 : 0);   // muzyka mroczniejsza/szybsza na boss wave
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) { enemies.splice(i, 1); waveKills++; coins += e.isBoss ? 70 : 8; onEnemyKilled(); continue; }
    e.attackT = Math.max(0, e.attackT - dt);
    e.swingT = Math.max(0, e.swingT - dt);
    e.hurtT = Math.max(0, e.hurtT - dt);
    e.shootT = Math.max(0, e.shootT - dt);
    e.frozenT = Math.max(0, e.frozenT - dt);
    e.noAtkT = Math.max(0, e.noAtkT - dt);
    e.pushT = Math.max(0, e.pushT - dt);
    e.burnCd = Math.max(0, e.burnCd - dt);

    // zamrożony (FREEZE) — stoi w miejscu i nic nie robi
    if (e.frozenT > 0) { e.moving = false; continue; }

    // odrzucony (PUSH / battle axe) — leci do tyłu, nie atakuje
    if (e.pushT > 0) {
      const k = e.pushT / (e.pushDur || 2);
      const mv = moveCircle(e.x, e.y, e.pushVx * k * dt, e.pushVy * k * dt, e.r);
      e.x = mv.x;
      e.y = mv.y;
      e.moving = false;
      continue;
    }

    const pdx = player.x - e.x, pdy = player.y - e.y;
    const dToP = Math.hypot(pdx, pdy) || 1;
    // wróg NIE widzi przez ściany — gracza zauważa tylko w linii wzroku,
    // a z bardzo bliska słyszy go nawet zza ściany
    const sees = dToP < 500 && hasLOS(e.x, e.y, player.x, player.y);
    if (e.isBoss) e.alertT = 8;                  // boss zawsze ściga (omijając ściany)
    else if (sees || dToP < 150) e.alertT = 8;
    else e.alertT = Math.max(0, e.alertT - dt);
    const los = sees;

    let mx = 0, my = 0;
    let spdMul = 1;
    if (e.alertT <= 0) {
      // niezaalarmowany — powolny patrol w losowych kierunkach
      e.wanderT -= dt;
      if (e.wanderT <= 0) {
        e.wanderT = 1.2 + Math.random() * 2;
        e.wanderA = Math.random() < 0.3 ? null : Math.random() * Math.PI * 2;
      }
      if (e.wanderA !== null) {
        mx = Math.cos(e.wanderA);
        my = Math.sin(e.wanderA);
        spdMul = 0.45;
      }
    } else if (e.type !== 'luk') {   // miecz / battle axe bossa
      e.fishT = Math.max(0, e.fishT - dt);
      if (e.fishTarget && (e.fishTarget.hp <= 0 || e.fishT <= 0)) e.fishTarget = null;
      if (e.fishTarget) {
        // oddaje anglerfishowi, który go ugryzł — podchodzi i atakuje rybę
        const f = e.fishTarget;
        const fx = f.x - e.x, fy = f.y - e.y, fdd = Math.hypot(fx, fy) || 1;
        mx = fx / fdd; my = fy / fdd;
        if (fdd < e.r + 18) {
          mx = 0; my = 0;
          if (e.attackT <= 0 && e.noAtkT <= 0) { e.attackT = e.attackCD; e.swingT = 0.28; f.hp -= e.dmg; f.hurtT = 0.15; }
        }
      } else {
        // nawigacja po polu przepływu (omija ściany); prosto tylko z bliska
        const fd = flowDir(e.x, e.y);
        const near = dToP < e.r + player.r + 50;
        if (near && los) { mx = pdx / dToP; my = pdy / dToP; }   // ostatnie zbliżenie
        else if (fd) { mx = fd.x; my = fd.y; }                   // omijanie przeszkód
        else if (los) { mx = pdx / dToP; my = pdy / dToP; }      // awaryjnie
        if (dToP < e.r + player.r + 4) { mx = 0; my = 0; }
        // wróg w wodzie nie zadaje obrażeń (ale wychodzi z niej)
        if (los && dToP < e.r + player.r + (e.reach || 14) && e.attackT <= 0 && e.noAtkT <= 0 && !isWaterAt(e.x, e.y)) {
          e.attackT = e.attackCD;
          e.swingT = 0.28;
          damagePlayer(e.dmg, e.type);   // typ broni wroga (tarcza reaguje inaczej)
          // wróg atakujący gracza w pobliżu jeziorka wkurza anglerfishe (nie boss)
          if (!e.isBoss) for (const a of anglers) if (Math.hypot(a.x - e.x, a.y - e.y) < 200) { a.aggro = e; a.aggroT = 8; }
        }
      }
    } else { // łucznik
      if (los && dToP < 400) {
        if (dToP < 150) { mx = -pdx / dToP; my = -pdy / dToP; }
        if (e.shootT <= 0 && e.noAtkT <= 0) {
          e.shootT = 1.9;
          const a = Math.atan2(pdy, pdx) + (Math.random() - 0.5) * 0.12;
          enemyArrows.push({
            x: e.x + Math.cos(a) * 18,
            y: e.y + Math.sin(a) * 18,
            vx: Math.cos(a) * 520,
            vy: Math.sin(a) * 520,
            ang: a,
            life: 2.2,
          });
          sfx.enemyBow();
          for (const af of anglers) if (Math.hypot(af.x - e.x, af.y - e.y) < 200) { af.aggro = e; af.aggroT = 8; }  // łucznik strzelający w pobliżu też wkurza
        }
      } else {
        const fd = flowDir(e.x, e.y);
        if (fd) { mx = fd.x; my = fd.y; }
      }
    }

    const movingNow = (mx !== 0 || my !== 0);
    e.moving = movingNow;
    if (movingNow) {
      const spd = e.speed * spdMul * (slowAllT > 0 ? 0.55 : 1) * (isWaterAt(e.x, e.y) ? 0.5 : 1);  // SLOW + woda
      const ox = e.x, oy = e.y;
      const mv = moveCircle(e.x, e.y, mx * spd * dt, my * spd * dt, e.r);
      e.x = mv.x;
      e.y = mv.y;
      e.walkPhase += dt * 9;
      // patrolujący wróg po uderzeniu w ścianę wybiera nowy kierunek
      if (e.alertT <= 0 && Math.hypot(e.x - ox, e.y - oy) < spd * dt * 0.3) e.wanderT = 0;
    }
    e.aim = los ? Math.atan2(pdy, pdx) : (movingNow ? Math.atan2(my, mx) : e.aim);
  }

  // rozpychanie
  for (let i = 0; i < enemies.length; i++) {
    for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i], b = enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy), min = a.r + b.r;
      if (d > 0 && d < min) {
        const push = (min - d) / 2;
        const ax = a.x, ay = a.y, bx = b.x, by = b.y;
        a.x -= dx / d * push; a.y -= dy / d * push;
        b.x += dx / d * push; b.y += dy / d * push;
        if (circleHitsWall(a.x, a.y, a.r)) { a.x = ax; a.y = ay; }
        if (circleHitsWall(b.x, b.y, b.r)) { b.x = bx; b.y = by; }
      }
    }
  }
}

function updateEnemyArrows(dt) {
  for (let i = enemyArrows.length - 1; i >= 0; i--) {
    const a = enemyArrows[i];
    const prevX = a.x, prevY = a.y;
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.life -= dt;
    let dead = a.life <= 0;
    if (!dead) {
      const tipX = a.x + Math.cos(a.ang) * 10, tipY = a.y + Math.sin(a.ang) * 10;
      if (isSolid(Math.floor(tipX / TILE), Math.floor(tipY / TILE))) dead = true;
    }
    if (!dead) {
      // kolizja z całym odcinkiem ruchu strzały
      if (segDist2(prevX, prevY, a.x, a.y, player.x, player.y) < 17 * 17) {
        damagePlayer(ENEMY_ARROW_DMG, 'arrow');   // strzała: tarcza blokuje połowę
        dead = true;
      }
    }
    if (dead) enemyArrows.splice(i, 1);
  }
}

// source: 'miecz'/'wlocznia' (melee -2), 'topor' (rozbija tarczę), 'arrow'/'luk' (-50%), inne (bez wpływu)
function damagePlayer(dmg, source) {
  if (state !== 'playing') return;
  if (shieldActive()) {
    if (source === 'topor') {
      shieldBrokenT = 3;                 // battle axe rozbija tarczę na 3 s (auto-wróci, jeśli trzymasz PPM)
      sfx.hit();
    } else if (source === 'arrow' || source === 'luk') {
      dmg = dmg * 0.5;                    // łuk/kusza: połowa obrażeń
    } else if (source === 'miecz' || source === 'wlocznia' || source === 'daggers') {
      dmg = Math.max(0, dmg - 2);        // miecz/włócznia/sztylety: blok 2
    }
  }
  if (dmg <= 0) return;
  player.hp = Math.max(0, player.hp - dmg);
  hurtT = 0.3;
  shake = Math.min(shake + 5, 10);
  sfx.hurt();
  if (player.hp <= 0) {
    state = 'dead';      // YOU DIED
    endLockT = 0.9;
    sfx.death();
  }
}

// ============================ ATAKI GRACZA ============================
function startSpearDash(dmg) {
  spearDash.speed = 760;
  spearDash.vx = Math.cos(player.aim);
  spearDash.vy = Math.sin(player.aim);
  spearDash.dmg = dmg;
  spearDash.hit = new Set();
  shake = Math.min(shake + 1.5, 4);
  sfx.spear();
}

function shootProjectile(wpn, dmg) {
  const a = player.aim + (Math.random() - 0.5) * 0.03;
  const lx = 24, ly = 7;
  const c = Math.cos(player.aim), s = Math.sin(player.aim);
  // pod wodą łuk i kusza ledwo działają: 2 dmg i krótszy zasięg
  const inW = isWaterAt(player.x, player.y);
  const fdmg = inW ? 2 : dmg;
  const flife = (wpn.range / wpn.speed) * (inW ? 0.4 : 1);
  bullets.push({
    x: player.x + lx * c - ly * s,
    y: player.y + lx * s + ly * c,
    vx: Math.cos(a) * wpn.speed,
    vy: Math.sin(a) * wpn.speed,
    ang: a,
    life: flife,
    dmg: fdmg,
  });
  recoil = wpn.charge ? 1.2 + dmg * 0.25 : 2.5;
  shake = Math.min(shake + 0.6, 3);
  if (wpn.charge) sfx.bow();   // łuk
  else sfx.crossbow();         // kusza
}

function meleeAttack(wpn) {
  playerSwingT = 0.25;
  shake = Math.min(shake + (wpn.stun ? 0.5 : 1.2), 4);
  if (wpn.stun) sfx.dagger();
  else if (wpn.kb) sfx.axe();
  else sfx.sword();
  let connected = false;
  for (const e of enemies) {
    const dx = e.x - player.x, dy = e.y - player.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < e.r + wpn.reach) {
      let da = Math.atan2(dy, dx) - player.aim;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < (wpn.arc || 1.15)) {   // topór tnie szerokim łukiem — wszyscy w zasięgu
        e.hp -= wpn.dmg + atkBonus(weaponIdx);  // + ulepszenie ataku
        e.hurtT = 0.15;
        e.alertT = 8;
        connected = true;
        if (wpn.stun) e.noAtkT = Math.max(e.noAtkT, wpn.stun);  // sztylety blokują atak wroga
        if (wpn.kb) {
          // battle axe: duży odrzut — wróg odlatuje i chwilę się zbiera
          // (bossowie są ciężsi, więc lecą krócej)
          e.pushT = 0.45;
          e.pushDur = 0.45;
          e.pushVx = dx / d * wpn.kb * (13 / e.r);
          e.pushVy = dy / d * wpn.kb * (13 / e.r);
          shake = Math.min(shake + 2, 6);
        } else {
          const kb = moveCircle(e.x, e.y, dx / d * 6, dy / d * 6, e.r);
          e.x = kb.x;
          e.y = kb.y;
        }
      }
    }
  }
  for (const a of anglers) {   // miecz/topór/sztylety tną też anglerfishe
    const dx = a.x - player.x, dy = a.y - player.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 13 + wpn.reach) {
      let da = Math.atan2(dy, dx) - player.aim;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < (wpn.arc || 1.15)) { a.hp -= wpn.dmg + atkBonus(weaponIdx); a.hurtT = 0.15; connected = true; }
    }
  }
  if (connected) sfx.hit();
}

// ============================ CZARY ============================
function nearestVisibleEnemy(maxDist) {
  let best = null, bestD = maxDist;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < bestD && hasLOS(player.x, player.y, e.x, e.y)) { best = e; bestD = d; }
  }
  return best;
}

// najbliższe wolne pole — używane, gdy GHOST WALK skończy się w ścianie
function nearestFreeSpot(x, y) {
  const tx0 = clamp(Math.floor(x / TILE), 0, WT - 1);
  const ty0 = clamp(Math.floor(y / TILE), 0, WT - 1);
  for (let ring = 0; ring < 8; ring++) {
    let best = null, bestD = Infinity;
    for (let ty = ty0 - ring; ty <= ty0 + ring; ty++) {
      for (let tx = tx0 - ring; tx <= tx0 + ring; tx++) {
        if (Math.max(Math.abs(tx - tx0), Math.abs(ty - ty0)) !== ring) continue;
        if (isSolid(tx, ty)) continue;
        const cx = tx * TILE + TILE / 2, cy = ty * TILE + TILE / 2;
        const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
        if (d < bestD) { bestD = d; best = { x: cx, y: cy }; }
      }
    }
    if (best) return best;
  }
  return { x: WORLD_W / 2, y: WORLD_H / 2 };
}

// efektywny cooldown czaru po UŻYCIU (TELEPORT: 60 s, ulepszenie −5 s/poziom)
function spellCd(si) {
  const id = SPELLS[si].id;
  if (id === 'teleport') return Math.max(30, 60 - 5 * spellLvl[si]);   // 60/55/50/45
  return SPELLS[si].cd;   // meteor 30 (ładowany zabójstwami), reszta 60
}
const AIM_ABORT_CD = 30;   // rezygnacja z celowania → krótszy cooldown (anty-spam pauzy)
function setCd(slot, dur) { spellCds[slot] = dur; spellCdMax[slot] = dur; }
// użycie czaru blokuje pozostałe na 15 s (nie skraca dłuższych odliczań)
function bumpOthers(slot) {
  for (let i = 0; i < 3; i++) if (i !== slot && spellCds[i] < 15) { spellCds[i] = 15; spellCdMax[i] = Math.max(spellCdMax[i], 15); }
}
// rezygnacja / brak wyboru w trybie celowania
function abortTargeting() {
  if (targeting.slot >= 0) {
    if (targeting.mode === 'meteor') meteorCharge = 0;      // meteor: rezygnacja zużywa ładunek (trzeba znów 2 zabójstwa)
    else setCd(targeting.slot, AIM_ABORT_CD);               // teleport: krótszy cooldown 30 s (anty-spam pauzy)
  }
  targeting.mode = null; state = 'playing';
}
// czar gotowy? (meteor: naładowany 2 zabójstwami; reszta: bez cooldownu)
function spellReady(slot, si) {
  if (spellCds[slot] > 0) return false;                       // zablokowany np. innym czarem (15 s)
  if (SPELLS[si].id === 'meteor') return meteorCharge >= METEOR_KILLS;
  return true;
}
function castSpell(slot) {
  if (state !== 'playing') return;
  const si = chosenSpells[slot];
  if (si === null || !spellReady(slot, si)) return;
  const id = SPELLS[si].id;
  // TELEPORT / METEOR — wejście w tryb celowania (gra się pauzuje);
  // cooldown ustalany dopiero po wyniku: użycie (pełny) vs rezygnacja (30 s)
  if (id === 'teleport' || id === 'meteor') {
    targeting.mode = id; targeting.t = AIM_TIME; targeting.slot = slot; targeting.si = si;
    bowCharge = 0; mouse.down = false;
    sfx.spell(id);
    state = 'aiming';
    return;
  }
  if (doCast(id, si)) {
    sfx.spell(id);
    setCd(slot, spellCd(si));
    bumpOthers(slot);
  }
}

// obrażenia od czaru NIE zabijają — wrogowi z >5 HP zostawiają dokładnie min. 5 HP
function spellHurt(e, dmg) {
  if (e.hp > 5) e.hp = Math.max(5, e.hp - dmg);
}

// zwraca true, jeśli czar został użyty (false = brak celu, bez cooldownu)
// si = indeks czaru w SPELLS (do bonusów z ulepszeń); może być undefined
function doCast(id, si) {
  const durB = si == null ? 0 : spellDurBonus(si);   // bonus czasu trwania
  const dmgB = si == null ? 0 : spellDmgBonus(si);   // bonus obrażeń
  // pod wodą czary ognia nie działają (wyjątek: FIRE TRAIL)
  if (isWaterAt(player.x, player.y) && (id === 'ring' || id === 'fireball')) return false;
  if (id === 'ring') {
    rings.push({ x: player.x, y: player.y, r: 0, maxR: 460, life: 3, hit: new Set(), dmg: 25 + dmgB });
    return true;
  }
  if (id === 'freeze') {
    if (!enemies.length) return false;
    for (const e of enemies) { e.frozenT = 5 + durB; spellHurt(e, 5 + dmgB); e.hurtT = 0.2; e.alertT = 8; }
    freezeFxT = 0.5;
    return true;
  }
  if (id === 'slow') {
    slowAllT = 5 + durB;
    return true;
  }
  if (id === 'ghost') {
    ghostT = 5 + durB;
    return true;
  }
  if (id === 'push') {
    let pushed = 0;
    for (const e of enemies) {
      const dx = e.x - player.x, dy = e.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d > 0 && d < 420 + durB * 40) {
        e.pushT = 2;
        e.pushDur = 2;
        e.pushVx = dx / d * 150;
        e.pushVy = dy / d * 150;
        if (dmgB) { spellHurt(e, dmgB); e.hurtT = 0.2; e.alertT = 8; }
        pushed++;
      }
    }
    if (!pushed) return false;
    pushFxT = 0.4;
    return true;
  }
  if (id === 'fireball') {
    const t = nearestVisibleEnemy(620);
    if (!t) return false;            // brak wroga w zasięgu wzroku — czar się nie zużywa
    const a = Math.atan2(t.y - player.y, t.x - player.x);
    fireballs.push({
      x: player.x + Math.cos(a) * 20,
      y: player.y + Math.sin(a) * 20,
      vx: Math.cos(a) * 520,
      vy: Math.sin(a) * 520,
      target: t,
      life: 4,
      dmg: 25 + dmgB,
    });
    return true;
  }
  if (id === 'bolt') {
    if (!enemies.length) return false;
    const pool = enemies.slice();
    for (let k = 0; k < 3 && pool.length; k++) {
      const j = (Math.random() * pool.length) | 0;
      const e = pool.splice(j, 1)[0];
      if (e.hp > 5) e.hp = Math.max(5, e.hp - (10 + dmgB));   // piorun nie dobija — zostawia min. 5 HP
      e.hurtT = 0.2;
      e.alertT = 8;
      bolts.push({ x: e.x, y: e.y, t: 0.4 });
    }
    return true;
  }
  if (id === 'trail') {
    trailT = 5 + durB;
    trailDmg = 5 + dmgB;
    lastTrailX = player.x;
    lastTrailY = player.y;
    return true;
  }
  if (id === 'jump') {
    const t = nearestVisibleEnemy(620);
    if (!t) return false;            // wymaga wroga w zasięgu wzroku
    const a = Math.atan2(player.y - t.y, player.x - t.x);
    let lx = t.x + Math.cos(a) * (t.r + player.r + 2);
    let ly = t.y + Math.sin(a) * (t.r + player.r + 2);
    if (circleHitsWall(lx, ly, player.r)) {
      const s = nearestFreeSpot(lx, ly);
      lx = s.x;
      ly = s.y;
    }
    player.x = lx;
    player.y = ly;
    spellHurt(t, 15 + dmgB);
    t.hurtT = 0.25;
    t.alertT = 8;
    t.noAtkT = 5 + durB;             // ogłuszony — nie atakuje (dłużej z ulepszeniem)
    shake = Math.min(shake + 4, 8);
    return true;
  }
  if (id === 'clone') {
    spawnClone(si);
    return true;
  }
  return false;
}

// CLONE — sojusznicza kopia gracza obok niego (bierze aktualną broń)
// tylko JEDEN klon naraz — ponowne rzucenie zastępuje poprzedniego
function spawnClone(si) {
  clones.length = 0;
  const hp = 50 + 10 * (si == null ? 0 : spellLvl[si]);   // +10 HP / poziom ulepszenia
  // znajdź wolne miejsce tuż obok gracza
  let cx = player.x, cy = player.y;
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    const tx = player.x + Math.cos(a) * (player.r * 2 + 6);
    const ty = player.y + Math.sin(a) * (player.r * 2 + 6);
    if (!circleHitsWall(tx, ty, player.r)) { cx = tx; cy = ty; break; }
  }
  clones.push({
    x: cx, y: cy, r: 13, hp: hp, maxHp: hp,
    weaponIdx: weaponIdx, aim: player.aim, life: 60,   // znika po minucie
    attackT: 0, swingT: 0, hurtT: 0, hitCd: 0, moving: false, walkPhase: 0,
  });
  bolts.push({ x: cx, y: cy, t: 0.3, purple: true });
}

// TELEPORT — natychmiastowe przeniesienie gracza (nie w ścianę/krater)
function doTeleport(wx, wy) {
  if (circleHitsWall(wx, wy, player.r)) return false;
  bolts.push({ x: player.x, y: player.y, t: 0.3, purple: true });   // znika stąd
  player.x = wx; player.y = wy;
  spearDash.speed = 0;
  bolts.push({ x: wx, y: wy, t: 0.35, purple: true });              // pojawia się tu
  const t = camTarget(); camera.x = t.x; camera.y = t.y;
  sfx.spell('jump');
  return true;
}

// METEOR — uderzenie w wskazany punkt (nie w ścianę): 30 dmg + krater na 15 s
function doMeteor(wx, wy, si) {
  if (isSolidAtWorld(wx, wy)) return false;
  const dmg = 30 + 5 * (si == null ? 0 : spellLvl[si]);   // +5 dmg / poziom
  const R = 96;                                            // promień rażenia
  for (const e of enemies) {
    if (Math.hypot(e.x - wx, e.y - wy) < R + e.r) { spellHurt(e, dmg); e.hurtT = 0.25; e.alertT = 8; }
  }
  for (const a of anglers) {
    if (Math.hypot(a.x - wx, a.y - wy) < R) { spellHurt(a, dmg); a.hurtT = 0.2; }
  }
  craters.push({ x: wx, y: wy, r: 46, t: CRATER_TIME });
  meteorFx.push({ x: wx, y: wy, t: 0.5 });
  shake = Math.min(shake + 10, 14);
  sfx.thunder(); sfx.fireball();
  return true;
}

// każde zabójstwo ładuje METEOR (gotowy po 2 zabójstwach)
function onEnemyKilled() {
  if (meteorCharge < METEOR_KILLS) meteorCharge++;
}

// kratery po meteorze znikają po 15 s; efekt uderzenia zanika
function updateCraters(dt) {
  for (let i = craters.length - 1; i >= 0; i--) {
    craters[i].t -= dt;
    if (craters[i].t <= 0) craters.splice(i, 1);
  }
  for (let i = meteorFx.length - 1; i >= 0; i--) {
    meteorFx[i].t -= dt;
    if (meteorFx[i].t <= 0) meteorFx.splice(i, 1);
  }
}

// CLONE — sojusznicy walczą z wrogami tą samą bronią; nie rzucają czarów
function updateClones(dt) {
  for (let i = clones.length - 1; i >= 0; i--) {
    const c = clones[i];
    c.life -= dt;
    if (c.hp <= 0 || c.life <= 0) { bolts.push({ x: c.x, y: c.y, t: 0.25, purple: true }); clones.splice(i, 1); continue; }
    c.attackT = Math.max(0, c.attackT - dt);
    c.swingT = Math.max(0, c.swingT - dt);
    c.hurtT = Math.max(0, c.hurtT - dt);
    c.hitCd = Math.max(0, c.hitCd - dt);
    const wpn = WEAPONS[c.weaponIdx];
    // cel: najbliższy wróg W LINII WZROKU (nie goni wrogów zza ściany — inaczej podąża za graczem)
    let tgt = null, td = 1e9;
    for (const e of enemies) {
      const d = Math.hypot(e.x - c.x, e.y - c.y);
      if (d < td && d < 560 && hasLOS(c.x, c.y, e.x, e.y)) { td = d; tgt = e; }
    }
    // podąża za graczem, chyba że widzi wroga
    let mx, my, follow = false;
    if (tgt) { mx = tgt.x; my = tgt.y; c.aim = Math.atan2(tgt.y - c.y, tgt.x - c.x); }
    else { mx = player.x; my = player.y; follow = true; c.aim = Math.atan2(player.y - c.y, player.x - c.x); }
    const ddx = mx - c.x, ddy = my - c.y, dd = Math.hypot(ddx, ddy) || 1;
    const stopDist = follow ? 64 : (wpn.melee ? (c.r + (tgt ? tgt.r : 13) + wpn.reach - 6) : 230);
    if (dd > stopDist) {
      const spd = 250 * (slowAllT > 0 ? 0.7 : 1);
      const mv = moveCircle(c.x, c.y, ddx / dd * spd * dt, ddy / dd * spd * dt, c.r);
      c.x = mv.x; c.y = mv.y; c.moving = true; c.walkPhase += dt * 10;
    } else c.moving = false;
    // atak
    if (tgt && c.attackT <= 0) {
      if (wpn.melee && td < c.r + tgt.r + wpn.reach) {
        tgt.hp -= wpn.dmg + atkBonus(c.weaponIdx); tgt.hurtT = 0.15; tgt.alertT = 8;
        if (wpn.stun) tgt.noAtkT = Math.max(tgt.noAtkT, wpn.stun);
        if (wpn.kb) { tgt.pushT = 0.4; tgt.pushDur = 0.4; tgt.pushVx = (tgt.x - c.x) / td * wpn.kb * (13 / tgt.r); tgt.pushVy = (tgt.y - c.y) / td * wpn.kb * (13 / tgt.r); }
        c.attackT = reloadCd(c.weaponIdx); c.swingT = 0.25; sfx.hit();
      } else if (!wpn.melee && td < (wpn.range || 600) && hasLOS(c.x, c.y, tgt.x, tgt.y)) {
        const a = Math.atan2(tgt.y - c.y, tgt.x - c.x);
        const sp = wpn.speed || 700;
        bullets.push({ x: c.x + Math.cos(a) * 20, y: c.y + Math.sin(a) * 20, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, ang: a, life: (wpn.range || 600) / sp, dmg: wpn.dmg + atkBonus(c.weaponIdx) });
        c.attackT = reloadCd(c.weaponIdx);
        if (wpn.charge) sfx.bow(); else sfx.crossbow();
      }
    }
    // wróg rani klona, gdy jest tuż obok (klon przyjmuje ciosy zamiast gracza)
    if (tgt && td < c.r + tgt.r + (tgt.reach || 14) + 4 && c.hitCd <= 0) {
      c.hp -= tgt.dmg; c.hurtT = 0.2; c.hitCd = tgt.attackCD || 1.1;
    }
  }
}

function updateSpells(dt) {
  for (let i = 0; i < 3; i++) spellCds[i] = Math.max(0, spellCds[i] - dt);
  slowAllT = Math.max(0, slowAllT - dt);
  trailT = Math.max(0, trailT - dt);
  freezeFxT = Math.max(0, freezeFxT - dt);
  pushFxT = Math.max(0, pushFxT - dt);

  // GHOST WALK — koniec w ścianie przenosi obok ściany
  if (ghostT > 0) {
    ghostT -= dt;
    if (ghostT <= 0) {
      ghostT = 0;
      if (circleHitsWall(player.x, player.y, player.r)) {
        const s = nearestFreeSpot(player.x, player.y);
        player.x = s.x;
        player.y = s.y;
      }
    }
  }

  // FIRE RING — rozszerzający się krąg, każdy wróg trafiony raz
  for (let i = rings.length - 1; i >= 0; i--) {
    const ring = rings[i];
    ring.life -= dt;
    ring.r = (1 - Math.max(0, ring.life) / 3) * ring.maxR;
    for (const e of enemies) {
      if (ring.hit.has(e)) continue;
      const d = Math.hypot(e.x - ring.x, e.y - ring.y);
      if (Math.abs(d - ring.r) < e.r + 14) {
        spellHurt(e, ring.dmg);
        e.hurtT = 0.2;
        e.alertT = 8;
        ring.hit.add(e);
      }
    }
    if (ring.life <= 0) rings.splice(i, 1);
  }

  // FIRE TRAIL — zostawianie płomieni (w wodzie NIC nie zostawia)
  if (trailT > 0 && player.moving && !isWaterAt(player.x, player.y)) {
    const dx = player.x - lastTrailX, dy = player.y - lastTrailY;
    if (dx * dx + dy * dy > 26 * 26) {
      firePatches.push({ x: player.x, y: player.y, life: 3 });
      lastTrailX = player.x;
      lastTrailY = player.y;
    }
  }

  // płomienie na ziemi — palą wrogów (gracza nie)
  for (let i = firePatches.length - 1; i >= 0; i--) {
    const p = firePatches[i];
    p.life -= dt;
    if (p.life <= 0) { firePatches.splice(i, 1); continue; }
    for (const e of enemies) {
      if (e.burnCd > 0) continue;
      const dx = e.x - p.x, dy = e.y - p.y;
      if (dx * dx + dy * dy < (e.r + 16) * (e.r + 16)) {
        spellHurt(e, trailDmg);
        e.hurtT = 0.15;
        e.alertT = 8;
        e.burnCd = 0.6;
      }
    }
  }

  // FIREBALL — leci za najbliższym wrogiem
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i];
    f.life -= dt;
    const t = f.target;
    if (t && t.hp > 0) {
      const a = Math.atan2(t.y - f.y, t.x - f.x);
      f.vx = Math.cos(a) * 520;
      f.vy = Math.sin(a) * 520;
    }
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if (t && t.hp > 0) {
      const dx = t.x - f.x, dy = t.y - f.y;
      if (dx * dx + dy * dy < (t.r + 10) * (t.r + 10)) {
        spellHurt(t, f.dmg);
        t.hurtT = 0.2;
        t.alertT = 8;
        explosions.push({ x: f.x, y: f.y, t: 0.3 });
        fireballs.splice(i, 1);
        continue;
      }
    }
    if (f.life <= 0) fireballs.splice(i, 1);
  }

  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].t -= dt;
    if (bolts[i].t <= 0) bolts.splice(i, 1);
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].t -= dt;
    if (explosions[i].t <= 0) explosions.splice(i, 1);
  }
}

// ============================ JEZIORKA / TLEN / ANGLERFISHE ============================
let oxyDmgAcc = 0;
function updateWater(dt) {
  const pInW = isWaterAt(player.x, player.y);
  // tlen: pod wodą spada (20 s), bez tlenu 5 hp/s; nad wodą po 3 s się odnawia
  if (pInW) {
    outOfWaterT = 0;
    oxygen = Math.max(0, oxygen - dt);
    if (oxygen <= 0) { oxyDmgAcc += dt; while (oxyDmgAcc >= 1) { oxyDmgAcc -= 1; damagePlayer(5); } }
  } else {
    oxyDmgAcc = 0;
    outOfWaterT += dt;
    if (outOfWaterT >= 3) oxygen = Math.min(MAX_OXY, oxygen + dt * 8);
  }

  // anglerfishe
  for (let i = anglers.length - 1; i >= 0; i--) {
    const a = anglers[i];
    if (a.hp <= 0) { anglers.splice(i, 1); coins += 10; sfx.hit(); continue; }
    a.biteT = Math.max(0, a.biteT - dt);
    a.hurtT = Math.max(0, a.hurtT - dt);
    a.whirlCd = Math.max(0, a.whirlCd - dt);
    a.whirlT = Math.max(0, a.whirlT - dt);
    const lake = lakes[a.lake];
    const pHere = pInW && Math.hypot(player.x - lake.cx, player.y - lake.cy) < 240;
    // wściekłość wygasa, gdy wróg zginie, minie czas (8 s) lub odejdzie daleko od jeziorka
    a.aggroT = Math.max(0, a.aggroT - dt);
    if (a.aggro && (a.aggro.hp <= 0 || a.aggroT <= 0 || Math.hypot(a.aggro.x - lake.cx, a.aggro.y - lake.cy) > 420)) a.aggro = null;
    // cel: gracz w tym jeziorku; w przeciwnym razie wróg, który Cię zaatakował w pobliżu
    let tx = null, ty = null, tgEnemy = null;
    if (pHere) { tx = player.x; ty = player.y; }
    else if (a.aggro) { tgEnemy = a.aggro; tx = a.aggro.x; ty = a.aggro.y; }
    // ruch: do celu (szybko) albo swobodne pływanie; anglerfish nie wychodzi z wody
    let mvx, mvy;
    if (tx != null) { const d = Math.hypot(tx - a.x, ty - a.y) || 1; mvx = (tx - a.x) / d; mvy = (ty - a.y) / d; }
    else { a.wanderT -= dt; if (a.wanderT <= 0) { a.wanderT = 1 + Math.random() * 2; a.wanderA = Math.random() * Math.PI * 2; } mvx = Math.cos(a.wanderA); mvy = Math.sin(a.wanderA); }
    const aspd = (tx != null ? 78 : 30);   // wolniejsze — łatwiej uciec w wodzie
    const nx = a.x + mvx * aspd * dt, ny = a.y + mvy * aspd * dt;
    if (isWaterAt(nx, a.y)) a.x = nx; else a.wanderA = Math.random() * Math.PI * 2;
    if (isWaterAt(a.x, ny)) a.y = ny;
    if (mvx || mvy) a.dir = Math.atan2(mvy, mvx);       // kierunek pływania
    a.swim += dt * (tx != null ? 9 : 4);                // animacja ogona/wabika
    // gryzienie (5 hp) + wir
    if (tx != null) {
      const d = Math.hypot(tx - a.x, ty - a.y);
      if (d < 24 && a.biteT <= 0) {
        a.biteT = 1.0;   // przeładowanie gryzienia: 1 s
        if (pHere) damagePlayer(5);
        else if (tgEnemy) { tgEnemy.hp -= 5; tgEnemy.hurtT = 0.15; tgEnemy.fishTarget = a; tgEnemy.fishT = 6; }  // wróg oddaje
      }
      if (a.whirlCd <= 0 && a.whirlT <= 0) { a.whirlT = 3; a.whirlCd = 60; }   // wir co ~minutę
    }
    // wir przyciąga gracza ku anglerfishowi przez 3 s
    if (a.whirlT > 0 && pHere) {
      const d = Math.hypot(a.x - player.x, a.y - player.y) || 1;
      if (d < 200) {
        const pull = 90 * dt;
        const mv = moveCircle(player.x, player.y, (a.x - player.x) / d * pull, (a.y - player.y) / d * pull, player.r);
        player.x = mv.x; player.y = mv.y;
      }
    }
  }

  // odradzanie: dosyp TYLKO do najbardziej przetrzebionego jeziorka (tam, gdzie ubito), max 3
  anglerRespawnT -= dt;
  if (anglerRespawnT <= 0) {
    let best = -1, bestN = 3;
    for (let li = 0; li < lakes.length; li++) {
      const n = anglersInLake(li);
      if (n < bestN) { bestN = n; best = li; }
    }
    if (best >= 0) spawnAngler(best);
    anglerRespawnT = 13 + Math.random() * 7;
  }
}

// ============================ LOGIKA ============================
function update(dt) {
  endLockT = Math.max(0, endLockT - dt);

  // tryb celowania (TELEPORT/METEOR) — gra zamrożona, tyka tylko licznik 20 s
  if (state === 'aiming') {
    targeting.t -= dt;
    if (targeting.t <= 0) abortTargeting();   // brak wyboru w 20 s → odpauzowanie + krótszy cooldown (30 s)
    return;
  }

  if (state !== 'playing') return;  // pauza zamraża całą grę

  recoil = Math.max(0, recoil - dt * 26);
  shake = Math.max(0, shake - dt * 7);
  hurtT = Math.max(0, hurtT - dt);
  shieldBrokenT = Math.max(0, shieldBrokenT - dt);   // przeładowanie tarczy po battle axe
  announceT = Math.max(0, announceT - dt);
  hintT += dt;

  // ruch (WSAD)
  const right = keys['KeyD'] ? 1 : 0;
  const left  = keys['KeyA'] ? 1 : 0;
  const down  = keys['KeyS'] ? 1 : 0;
  const up    = keys['KeyW'] ? 1 : 0;
  let dx = right - left, dy = down - up;
  const len = Math.hypot(dx, dy);
  player.moving = len > 0 || spearDash.speed > 0;
  if (spearDash.speed > 0) {
    // SZARŻA WŁÓCZNIĄ — pęd opada, obrażenia spadają o 1/s (min 0.5)
    spearDash.speed = Math.max(0, spearDash.speed - 420 * dt);
    spearDash.dmg = Math.max(0.5, spearDash.dmg - dt);
    if (spearDash.speed < 130) {
      spearDash.speed = 0;
    } else {
      const ox = player.x, oy = player.y;
      if (ghostT > 0) {
        // szarża w trybie ducha przenika przez ściany
        player.x = clamp(player.x + spearDash.vx * spearDash.speed * dt, 20, WORLD_W - 20);
        player.y = clamp(player.y + spearDash.vy * spearDash.speed * dt, 20, WORLD_H - 20);
      } else {
        const mv = moveCircle(player.x, player.y,
          spearDash.vx * spearDash.speed * dt, spearDash.vy * spearDash.speed * dt, player.r);
        player.x = mv.x;
        player.y = mv.y;
        if (Math.abs(player.x - ox) < 0.05 && Math.abs(player.y - oy) < 0.05) spearDash.speed = 0; // ściana
      }
      player.moveDir = Math.atan2(spearDash.vy, spearDash.vx);
      player.walkPhase += dt * 15;
      // nadziewanie wrogów (każdy raz na szarżę)
      for (const e of enemies) {
        if (spearDash.hit.has(e)) continue;
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < e.r + player.r + 12) {
          e.hp -= spearDash.dmg;
          e.hurtT = 0.2;
          e.alertT = 8;
          spearDash.hit.add(e);
          const kb = moveCircle(e.x, e.y, spearDash.vx * 10, spearDash.vy * 10, e.r);
          e.x = kb.x;
          e.y = kb.y;
        }
      }
    }
  } else if (player.moving) {
    dx /= len; dy /= len;
    const inW = isWaterAt(player.x, player.y);
    // w wodzie wolniej (×0.55); FIRE TRAIL przyspiesza (w wodzie też)
    let spd = player.speed;
    if (inW) spd *= (trailT > 0 ? 1.1 : 0.55);
    else if (trailT > 0) spd *= 1.5;
    if (shieldActive()) spd *= 0.65;   // wolniej z podniesioną tarczą
    if (ghostT > 0) {
      // GHOST WALK — przenikanie przez ściany
      player.x = clamp(player.x + dx * spd * dt, 20, WORLD_W - 20);
      player.y = clamp(player.y + dy * spd * dt, 20, WORLD_H - 20);
    } else {
      const mv = moveCircle(player.x, player.y, dx * spd * dt, dy * spd * dt, player.r);
      player.x = mv.x;
      player.y = mv.y;
    }
    player.moveDir = Math.atan2(dy, dx);
    player.walkPhase += dt * 11;
  }

  updateCamera(dt);

  // celowanie
  player.aim = Math.atan2(
    mouse.y + camera.y - player.y,
    mouse.x + camera.x - player.x
  );

  // atak wybraną bronią
  for (let i = 0; i < WEAPONS.length; i++) cooldowns[i] = Math.max(0, cooldowns[i] - dt);
  playerSwingT = Math.max(0, playerSwingT - dt);
  const wpn = WEAPONS[weaponIdx];
  if (shieldActive()) {
    bowCharge = 0;   // z tarczą nie używasz żadnej broni
  } else if (spearDash.speed > 0) {
    // trwa szarża — bez nowych ataków, dopóki nie wyhamuje
  } else if (wpn.charge) {
    // łuk/włócznia: trzymaj LPM, by naciągać (0.5 s = 1 dmg, max 6);
    // puść, by użyć — potem co najmniej 1 s przeładowania
    if (mouse.down && cooldowns[weaponIdx] <= 0) {
      bowCharge = Math.min(BOW_MAX_CHARGE, bowCharge + dt);
    } else if (bowCharge > 0) {
      // +1e-6 — żeby równe 3 s nie przepadło przez błąd zmiennoprzecinkowy
      const steps = Math.floor(bowCharge / 0.5 + 1e-6);
      const dmg = (steps >= 1 ? Math.min(wpn.dmg, steps) : 0.5) + atkBonus(weaponIdx);  // + ulepszenie
      if (wpn.spear) startSpearDash(dmg);
      else shootProjectile(wpn, dmg);
      bowCharge = 0;
      cooldowns[weaponIdx] = reloadCd(weaponIdx);
    }
  } else if (mouse.down && cooldowns[weaponIdx] <= 0) {
    if (wpn.melee) meleeAttack(wpn);
    else shootProjectile(wpn, wpn.dmg + atkBonus(weaponIdx));
    cooldowns[weaponIdx] = reloadCd(weaponIdx);
  }

  // pociski gracza
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const prevX = b.x, prevY = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    let dead = b.life <= 0;

    if (!dead) {
      const tipX = b.x + Math.cos(b.ang) * 10, tipY = b.y + Math.sin(b.ang) * 10;
      if (isSolid(Math.floor(tipX / TILE), Math.floor(tipY / TILE))) dead = true;
    }
    if (!dead) {
      for (const e of enemies) {
        // kolizja z całym odcinkiem ruchu — strzała nie przeleci przez wroga
        if (segDist2(prevX, prevY, b.x, b.y, e.x, e.y) < (e.r + 4) * (e.r + 4)) {
          e.hp -= b.dmg;
          e.hurtT = 0.15;
          e.alertT = 8;
          const kb = moveCircle(e.x, e.y, Math.cos(b.ang) * 3, Math.sin(b.ang) * 3, e.r);
          e.x = kb.x; e.y = kb.y;
          sfx.hit();
          dead = true;
          break;
        }
      }
    }
    if (!dead) {
      for (const a of anglers) {     // strzały trafiają też anglerfishe
        if (segDist2(prevX, prevY, b.x, b.y, a.x, a.y) < 15 * 15) {
          a.hp -= b.dmg; a.hurtT = 0.15; sfx.hit(); dead = true; break;
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }

  // nawigacja wrogów
  flowTimer -= dt;
  if (flowTimer <= 0) {
    computeFlow();
    flowTimer = 0.35;
  }

  updateEnemies(dt);
  updateEnemyArrows(dt);
  updateSpells(dt);
  updateClones(dt);
  updateCraters(dt);
  updateWater(dt);

  // ogień/iskry i dym w HELL FORTRESS (cząsteczki tła)
  if (theme.ember) {
    emberSpawnAcc += dt;
    while (emberSpawnAcc > 1 / 18 && embers.length < 95) {
      emberSpawnAcc -= 1 / 18;
      const ex = camera.x + Math.random() * W, ey = camera.y + Math.random() * H;
      const smoke = Math.random() < 0.32;
      const life = smoke ? 2.5 + Math.random() * 2 : 1.1 + Math.random() * 1.6;
      embers.push({
        x: ex, y: ey, vx: (Math.random() - 0.5) * 12, vy: -(14 + Math.random() * 30),
        life: life, max: life, size: smoke ? 7 + Math.random() * 9 : 1.4 + Math.random() * 2.2, smoke: smoke,
      });
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.x += e.vx * dt; e.y += e.vy * dt; e.vy *= (1 - dt * 0.3); e.life -= dt;
      if (e.life <= 0) embers.splice(i, 1);
    }
  } else if (embers.length) embers.length = 0;

  // posiłki — utrzymują arenę pełną do limitu: dosypują po kilku, szybko
  if (!betweenWaves && waveReserve > 0) {
    respawnTimer -= dt;
    if (respawnTimer <= 0) {
      const cap = maxEnemiesForWave(wave);
      let added = 0;
      while (waveReserve > 0 && added < 4 && enemies.length + pendingSpawns.length < cap) {
        const pos = randomFreeTileFar(420) || randomFreeTileFar(240);  // z dala od gracza
        if (!pos) break;
        pendingSpawns.push({ x: pos.x, y: pos.y, t: 0.55 });
        waveReserve--;
        added++;
      }
      respawnTimer = added > 0 ? 0.5 : 0.25;
    }
  }
  // teleporty: po fioletowym świetle bije piorunek i pojawia się wróg
  for (let i = pendingSpawns.length - 1; i >= 0; i--) {
    const p = pendingSpawns[i];
    p.t -= dt;
    if (p.t <= 0) {
      enemies.push(makeEnemy(p.x, p.y));
      bolts.push({ x: p.x, y: p.y, t: 0.35, purple: true });
      sfx.spawn();
      pendingSpawns.splice(i, 1);
    }
  }

  // fale
  const bossWave = wave % 5 === 0;
  // boss-wave kończy się śmiercią bossa; normalna — po pokonaniu połowy limitu
  const cleared = bossWave
    ? (!enemies.some(e => e.isBoss) && pendingSpawns.length === 0)
    : (waveKills >= waveKillTarget);
  if (betweenWaves) {
    waveBreak -= dt;
    if (waveBreak <= 0) {
      betweenWaves = false;
      spawnWave();
      announceT = ANNOUNCE_DUR;
    }
  } else if (cleared) {
    // pozostali wrogowie "wycofują się" — czyścimy arenę
    enemies.length = 0;
    pendingSpawns.length = 0;
    waveReserve = 0;
    coins += 25 + wave * 3;             // nagroda za ukończenie fali
    if (wave >= totalWaves) {
      state = 'win';      // VICTORY
      endLockT = 0.9;
      sfx.victory();
    } else {
      if (bossWave) {
        // koniec boss wave — bonus z połowy HP bossa znika, wraca normalne maks.
        player.maxHp = normalMaxHp;
        player.hp = Math.min(player.hp, normalMaxHp);
      }
      openShopAfterWave();              // skrzynia/sklep przed następną falą
    }
  }
}

// ============================ RYSOWANIE ============================
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function tileShade(tx, ty) {
  let h = (tx * 374761393 + ty * 668265263) | 0;
  h = ((h ^ (h >>> 13)) * 1274126177) | 0;
  return ((h ^ (h >>> 16)) & 255) / 255;
}

function drawFloor() {
  const x0 = Math.max(0, Math.floor((camera.x - 16) / TILE));
  const y0 = Math.max(0, Math.floor((camera.y - 16) / TILE));
  const x1 = Math.min(WT, Math.ceil((camera.x + W + 16) / TILE));
  const y1 = Math.min(WT, Math.ceil((camera.y + H + 16) / TILE));
  for (let ty = y0; ty < y1; ty++) {
    for (let tx = x0; tx < x1; tx++) {
      const sx = tx * TILE - camera.x;
      const sy = ty * TILE - camera.y;
      if (isSolid(tx, ty)) {
        ctx.fillStyle = theme.wallFront;
        ctx.fillRect(sx, sy + TILE - WALL_LIFT, TILE, WALL_LIFT);
        const l = theme.wallL + tileShade(tx, ty) * 4;
        ctx.fillStyle = 'hsl(' + theme.wallH + ', ' + theme.wallS + '%, ' + l + '%)';
        ctx.fillRect(sx, sy - WALL_LIFT, TILE, TILE);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(sx, sy - WALL_LIFT, TILE, 2);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(sx, sy - WALL_LIFT + TILE - 2, TILE, 2);
      } else if (waterArr[ty * WT + tx]) {
        const pInW = isWaterAt(player.x, player.y);
        if (theme.pool === 'smoke') {
          // dym — ciemna tafla z animowanymi kłębami (z zewnątrz nie widać wnętrza)
          ctx.fillStyle = pInW ? theme.poolShallow : theme.poolDeep;
          ctx.fillRect(sx, sy, TILE, TILE);
          const tt = performance.now() / 1000;
          ctx.fillStyle = 'rgba(' + theme.poolWave + ',' + (pInW ? 0.16 : 0.10) + ')';
          const o1 = ((tx * 23 + ty * 11) + tt * 14) % (TILE + 24) - 12;
          ctx.beginPath(); ctx.arc(sx + o1, sy + 22, 11, 0, Math.PI * 2); ctx.fill();
          const o2 = ((tx * 17 + ty * 29) - tt * 10) % (TILE + 24);
          ctx.beginPath(); ctx.arc(sx + ((o2 % TILE)), sy + 44, 8, 0, Math.PI * 2); ctx.fill();
        } else {
          // woda — tafla z delikatnymi falami
          ctx.fillStyle = pInW ? theme.poolShallow : theme.poolDeep;
          ctx.fillRect(sx, sy, TILE, TILE);
          const ph = (tx * 7 + ty * 13);
          ctx.fillStyle = 'rgba(' + theme.poolWave + ',' + (pInW ? 0.12 : 0.07) + ')';
          ctx.fillRect(sx, sy + ((ph % 3) * 18 + 8), TILE, 3);
          ctx.fillStyle = 'rgba(255,255,255,0.05)';
          ctx.fillRect(sx, sy, TILE, 2);
        }
      } else {
        const even = (tx + ty) % 2 === 0;
        const l = theme.floorL + (even ? 3 : 0) + tileShade(tx, ty) * 2.5;
        ctx.fillStyle = 'hsl(' + theme.floorH + ', ' + theme.floorS + '%, ' + l + '%)';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = 'rgba(255,255,255,0.045)';
        ctx.fillRect(sx, sy, TILE, 2);
        ctx.fillRect(sx, sy, 2, TILE);
        ctx.fillStyle = 'rgba(0,0,0,0.14)';
        ctx.fillRect(sx, sy + TILE - 2, TILE, 2);
        ctx.fillRect(sx + TILE - 2, sy, 2, TILE);
      }
    }
  }
}

// podwójny topór (battle axe) — rysowany w układzie dłoni, ostrze wzdłuż +x
function paintBattleAxe() {
  // trzonek
  ctx.strokeStyle = '#6b4a26';
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(17, 0); ctx.stroke();
  // grot na szczycie
  ctx.fillStyle = '#cfd6e4';
  ctx.beginPath();
  ctx.moveTo(16, -2);
  ctx.lineTo(23, 0);
  ctx.lineTo(16, 2);
  ctx.closePath();
  ctx.fill();
  // dwa łukowate ostrza (podwójny topór)
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#dbe1ec';
    ctx.beginPath();
    ctx.moveTo(13, 1.5 * side);
    ctx.lineTo(8, 9 * side);
    ctx.quadraticCurveTo(16, 14.5 * side, 21, 8 * side);
    ctx.lineTo(17, 1.5 * side);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,45,60,0.65)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  // okucie łączące głowicę z trzonkiem
  ctx.fillStyle = '#8a6a2a';
  ctx.fillRect(13, -2.2, 4, 4.4);
}

// pochodnie na ścianach: wspornik, migoczący płomień i łuna na podłodze
// dekoracje dżungli: mech, pnącza, świecące różowe kwiaty
function drawJungleDecor() {
  const t = performance.now() / 1000;
  for (const d of jungleDecor) {
    const sx = d.x - camera.x, sy = d.y - camera.y;
    if (sx < -50 || sy < -70 || sx > W + 50 || sy > H + 70) continue;
    if (d.t === 'moss') {
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(d.a); ctx.scale(d.s, d.s);
      ctx.fillStyle = 'rgba(54,108,46,0.5)';
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(96,168,76,0.5)';
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 2.6, 2); ctx.lineTo(k * 2.6 - 1.2, -4.5); ctx.lineTo(k * 2.6 + 1.2, -4.5); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    } else if (d.t === 'vine') {
      const sway = Math.sin(t * 1.2 + d.ph) * 4;
      ctx.strokeStyle = 'rgba(74,134,58,0.75)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + sway, sy + d.len * 0.5, sx + sway * 1.6, sy + d.len); ctx.stroke();
      ctx.fillStyle = 'rgba(98,178,76,0.8)';
      for (let k = 1; k <= 2; k++) {
        const ly = sy + d.len * (k / 3), lx = sx + sway * (k / 3);
        ctx.beginPath(); ctx.ellipse(lx - 4, ly, 4, 2, 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(lx + 4, ly + 4, 4, 2, -0.6, 0, Math.PI * 2); ctx.fill();
      }
