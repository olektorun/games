    } else if (d.t === 'crack') { // popękana płytka
      const s = d.seed;
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx - 13 + s % 7, sy - 11);
      ctx.lineTo(sx - 2, sy - 2);
      ctx.lineTo(sx + 11, sy + 3 + s % 5);
      ctx.moveTo(sx - 2, sy - 2); ctx.lineTo(sx + 4, sy - 12);
      ctx.moveTo(sx - 2, sy - 2); ctx.lineTo(sx - 11, sy + 9);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx - 1, sy - 1); ctx.lineTo(sx + 10, sy + 4); ctx.stroke();
    } else { // świecący różowy kwiat
      const pulse = 0.6 + 0.4 * Math.sin(t * 2 + d.ph);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 15 * pulse);
      g.addColorStop(0, 'rgba(255,150,220,' + (0.5 * pulse) + ')');
      g.addColorStop(1, 'rgba(255,80,180,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, 15 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,120,205,0.92)';
      for (let k = 0; k < 5; k++) { const pa = d.ph + k / 5 * Math.PI * 2; ctx.beginPath(); ctx.ellipse(sx + Math.cos(pa) * 4, sy + Math.sin(pa) * 4, 3.4, 2, pa, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,240,180,' + pulse + ')'; ctx.beginPath(); ctx.arc(sx, sy, 2.4, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// kałuże lawy (HELL FORTRESS) — świecące, bulgoczące
function drawLava() {
  const t = performance.now() / 1000;
  for (const lv of lavaPools) {
    const sx = lv.x - camera.x, sy = lv.y - camera.y;
    if (sx < -90 || sy < -90 || sx > W + 90 || sy > H + 90) continue;
    const pulse = 0.7 + 0.3 * Math.sin(t * 1.5 + lv.ph);
    ctx.fillStyle = '#1a0d0a';                                  // skalny obrzeżek
    ctx.beginPath(); ctx.ellipse(sx, sy, lv.r + 4, (lv.r + 4) * 0.74, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(sx, sy, 2, sx, sy, lv.r);  // roztopiona lawa
    g.addColorStop(0, 'rgba(255,232,130,' + pulse + ')');
    g.addColorStop(0.45, 'rgba(255,140,40,1)');
    g.addColorStop(1, 'rgba(150,32,12,1)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(sx, sy, lv.r, lv.r * 0.74, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(40,15,8,0.6)';                        // ciemna skorupa
    for (let k = 0; k < 4; k++) { const a = lv.ph + k * 1.7, rr2 = lv.r * 0.5; ctx.beginPath(); ctx.ellipse(sx + Math.cos(a) * rr2, sy + Math.sin(a) * rr2 * 0.7, 4.5, 2.8, a, 0, Math.PI * 2); ctx.fill(); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';        // bąble
    for (let k = 0; k < 3; k++) {
      const ba = t * 1.3 + k * 2.1 + lv.ph, br = (Math.sin(t * 2 + k) * 0.5 + 0.5) * lv.r * 0.6;
      ctx.fillStyle = 'rgba(255,240,160,' + (0.55 * pulse) + ')';
      ctx.beginPath(); ctx.arc(sx + Math.cos(ba) * br, sy + Math.sin(ba) * br * 0.7, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawTorches() {
  for (const t of torches) {
    const sx = t.x - camera.x, sy = t.y - camera.y;
    if (sx < -90 || sy < -90 || sx > W + 90 || sy > H + 90) continue;
    const fl = 0.75 + Math.random() * 0.25;   // migotanie
    // wspornik na ściance
    ctx.fillStyle = '#2a1d10';
    ctx.fillRect(sx - 2.5, sy - 10, 5, 8);
    ctx.fillStyle = '#6b4a26';
    ctx.fillRect(sx - 1.3, sy - 12, 2.6, 9);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // kula płomienia
    const g = ctx.createRadialGradient(sx, sy - 14, 1, sx, sy - 14, 9 * fl);
    g.addColorStop(0, 'rgba(255,240,170,' + (0.95 * fl) + ')');
    g.addColorStop(0.5, 'rgba(255,160,50,' + (0.7 * fl) + ')');
    g.addColorStop(1, 'rgba(220,70,15,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy - 14, 9 * fl, 0, Math.PI * 2); ctx.fill();
    // jęzor ognia
    ctx.fillStyle = 'rgba(255,200,90,' + (0.75 * fl) + ')';
    ctx.beginPath();
    ctx.moveTo(sx - 3, sy - 12);
    ctx.quadraticCurveTo(sx + (Math.random() - 0.5) * 5, sy - 23 - Math.random() * 4, sx + 3, sy - 12);
    ctx.closePath();
    ctx.fill();
    // łuna światła na podłodze i ścianie
    const lg = ctx.createRadialGradient(sx, sy - 6, 4, sx, sy - 6, 62);
    lg.addColorStop(0, 'rgba(255,170,60,' + (0.22 * fl) + ')');
    lg.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(sx, sy - 6, 62, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// anglerfishe — widoczne tylko, gdy gracz jest w wodzie (z zewnątrz nie widać)
// anglerfish (woda) — rysowany w lokalnych, obróconych współrzędnych
function drawAnglerArt(a) {
  const wig = Math.sin(a.swim) * 0.35;
  const lurePulse = 0.6 + 0.4 * Math.sin(a.swim * 1.3);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 4, 15, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(-12, 0); ctx.rotate(wig);
  ctx.fillStyle = '#10202b';
  ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(-12, -9); ctx.quadraticCurveTo(-7, 0, -12, 9); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,140,170,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-11, -7); ctx.moveTo(-2, 0); ctx.lineTo(-11, 7); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#16303d';
  ctx.beginPath(); ctx.moveTo(-4, -7); ctx.lineTo(0, -16); ctx.lineTo(4, -7); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3, 7); ctx.lineTo(0, 14); ctx.lineTo(3, 7); ctx.closePath(); ctx.fill();
  const g = ctx.createRadialGradient(-2, -4, 2, 2, 2, 17);
  g.addColorStop(0, '#4a7388'); g.addColorStop(0.55, '#21404f'); g.addColorStop(1, '#0c1820');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(8,14,20,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(40,80,100,0.8)';
  ctx.beginPath(); ctx.ellipse(2, 9, 5, 3, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#070d12';
  ctx.beginPath(); ctx.moveTo(6, -7); ctx.quadraticCurveTo(20, -3, 20, 0); ctx.quadraticCurveTo(20, 3, 6, 7); ctx.quadraticCurveTo(13, 0, 6, -7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#eaf2f8';
  for (let k = 0; k < 5; k++) {
    const fx = 8 + k * 2.4;
    ctx.beginPath(); ctx.moveTo(fx, -6 + k * 0.4); ctx.lineTo(fx + 1.3, -1.5); ctx.lineTo(fx + 2.6, -6 + k * 0.4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx, 6 - k * 0.4); ctx.lineTo(fx + 1.3, 1.5); ctx.lineTo(fx + 2.6, 6 - k * 0.4); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#f4d24a';
  ctx.beginPath(); ctx.arc(-1, -3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0d12';
  ctx.beginPath(); ctx.arc(-0.3, -3, 1.5, 0, Math.PI * 2); ctx.fill();
  const lx = 8 + Math.sin(a.swim) * 1.5, ly = -17 + Math.cos(a.swim * 0.7) * 1.5;
  ctx.strokeStyle = '#13242e'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(2, -8); ctx.quadraticCurveTo(10, -16, lx, ly); ctx.stroke();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 16 * lurePulse);
  lg.addColorStop(0, 'rgba(190,245,255,' + (0.9 * lurePulse) + ')');
  lg.addColorStop(0.5, 'rgba(120,210,255,' + (0.35 * lurePulse) + ')');
  lg.addColorStop(1, 'rgba(80,180,255,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.arc(lx, ly, 16 * lurePulse, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#ddfbff';
  ctx.beginPath(); ctx.arc(lx, ly, 2.6, 0, Math.PI * 2); ctx.fill();
}

// szkielet (dym, Fortress) — pływający czaszko-kościany potwór z żarzącymi oczodołami
// PIONOWY pływający szkielet: czaszka, klatka żebrowa, kręgosłup, miednica, ramiona z pazurami
function drawSkeleArt(a) {
  const bob = Math.sin(a.swim) * 2;
  const glow = 0.55 + 0.45 * Math.sin(a.swim * 1.6);
  const face = Math.cos(a.dir) < 0 ? -1 : 1;           // obrót w lewo/prawo
  ctx.translate(0, bob - 2);
  ctx.rotate(Math.sin(a.swim * 0.8) * 0.08);            // lekkie kołysanie
  ctx.scale(face, 1);

  // ognista aura
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ag = ctx.createRadialGradient(0, -2, 2, 0, -2, 26);
  ag.addColorStop(0, 'rgba(255,130,40,' + (0.16 * glow) + ')');
  ag.addColorStop(1, 'rgba(255,70,20,0)');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, -2, 26, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const bone = '#e9e3d1';
  ctx.strokeStyle = bone; ctx.fillStyle = bone; ctx.lineCap = 'round';

  // kręgosłup
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 13); ctx.stroke();
  // miednica
  ctx.beginPath(); ctx.moveTo(-5, 13); ctx.lineTo(0, 9); ctx.lineTo(5, 13); ctx.stroke();
  // klatka żebrowa (pary żeber)
  ctx.lineWidth = 1.8;
  for (let k = 0; k < 4; k++) {
    const ry = -2 + k * 3.1, rw = 8 - k * 1.1;
    ctx.beginPath(); ctx.moveTo(0, ry); ctx.quadraticCurveTo(-rw, ry + 1.6, -rw + 1.5, ry + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, ry); ctx.quadraticCurveTo(rw, ry + 1.6, rw - 1.5, ry + 4); ctx.stroke();
  }
  // ramiona z pazurami (uniesione, lekko machają)
  ctx.lineWidth = 2.3;
  for (const s of [-1, 1]) {
    const sw = Math.sin(a.swim * 1.3 + (s > 0 ? 0 : 1.4)) * 0.22;
    ctx.save();
    ctx.translate(s * 6, -3);
    ctx.rotate(s * 0.55 + sw);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 8); ctx.stroke();       // kość ramienna
    ctx.translate(0, 8); ctx.rotate(s * 0.45);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 7); ctx.stroke();       // przedramię
    ctx.translate(0, 7);
    for (let f = -1; f <= 1; f++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(f * 2.4, 4); ctx.stroke(); }  // pazury
    ctx.restore();
  }
  // czaszka
  ctx.fillStyle = bone;
  ctx.beginPath(); ctx.arc(0, -12, 8, 0, Math.PI * 2); ctx.fill();           // mózgoczaszka
  ctx.beginPath(); ctx.moveTo(-5, -8); ctx.quadraticCurveTo(0, -3, 5, -8); ctx.lineTo(4.5, -10); ctx.lineTo(-4.5, -10); ctx.closePath(); ctx.fill();  // szczęka
  ctx.strokeStyle = 'rgba(60,48,38,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, -12, 8, 0, Math.PI * 2); ctx.stroke();
  // zęby
  ctx.strokeStyle = 'rgba(70,56,42,0.7)'; ctx.lineWidth = 0.8;
  for (let t = -3; t <= 3; t += 1.5) { ctx.beginPath(); ctx.moveTo(t, -8.6); ctx.lineTo(t, -6); ctx.stroke(); }
  // jama nosowa
  ctx.fillStyle = '#241a12'; ctx.beginPath(); ctx.moveTo(0, -12.5); ctx.lineTo(-1.6, -10); ctx.lineTo(1.6, -10); ctx.closePath(); ctx.fill();
  // żarzące oczodoły
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const ex of [-3.3, 3.3]) {
    const eg = ctx.createRadialGradient(ex, -12.5, 0, ex, -12.5, 4.6);
    eg.addColorStop(0, 'rgba(255,215,110,' + glow + ')');
    eg.addColorStop(0.5, 'rgba(255,110,30,' + (0.8 * glow) + ')');
    eg.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex, -12.5, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,235,150,' + glow + ')';
    ctx.beginPath(); ctx.arc(ex, -12.5, 1.9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ogień/iskry + dym (HELL FORTRESS)
function drawHellAmbient() {
  for (const e of embers) {
    const sx = e.x - camera.x, sy = e.y - camera.y;
    if (sx < -30 || sy < -30 || sx > W + 30 || sy > H + 30) continue;
    const f = e.life / e.max;
    if (e.smoke) {
      ctx.fillStyle = 'rgba(35,26,26,' + (0.16 * f) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, e.size * (1.5 - f * 0.5), 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, e.size * 3);
      g.addColorStop(0, 'rgba(255,205,95,' + (0.9 * f) + ')');
      g.addColorStop(0.4, 'rgba(255,120,40,' + (0.5 * f) + ')');
      g.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, e.size * 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawAnglers() {
  if (!isWaterAt(player.x, player.y)) return;
  for (const a of anglers) {
    const sx = a.x - camera.x, sy = a.y - camera.y;
    if (sx < -50 || sy < -50 || sx > W + 50 || sy > H + 50) continue;

    // wir
    if (a.whirlT > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = theme.creature === 'skeleton' ? 'rgba(255,150,70,0.45)' : 'rgba(130,200,255,0.45)';
      ctx.lineWidth = 2;
      const t = (3 - a.whirlT);
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.arc(sx, sy, 16 + k * 11 + (t * 25) % 22, t * 2 + k, t * 2 + k + Math.PI * 1.4);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.translate(sx, sy);
    if (theme.creature === 'skeleton') {
      drawSkeleArt(a);   // szkielet jest pionowy (nie obracamy jak rybę)
    } else {
      ctx.rotate(a.dir);
      drawAnglerArt(a);
    }
    if (a.hurtT > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.6 * a.hurtT / 0.15) + ')';
      ctx.beginPath(); ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // pasek HP (poziomo nad rybą, w ekranie)
    if (a.hp < a.maxHp) {
      const bw = 26; ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(sx - bw / 2 - 1, sy - 22, bw + 2, 4, 2); ctx.fill();
      ctx.fillStyle = '#e04545'; rr(sx - bw / 2, sy - 21, bw * (a.hp / a.maxHp), 2.5, 1); ctx.fill();
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const sx = e.x - camera.x, sy = e.y - camera.y;
    if (sx < -100 || sy < -100 || sx > W + 100 || sy > H + 100) continue;
    const s = e.r / 13;
    const bob = e.moving ? Math.abs(Math.sin(e.walkPhase)) * 1.5 : 0;

    // cień
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + 9 * s, 15 * s, 8 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // stopy
    if (e.moving) {
      const mc = Math.cos(e.aim), ms = Math.sin(e.aim);
      for (const side of [-1, 1]) {
        const step = Math.sin(e.walkPhase) * 6 * side;
        const fx = sx + (-ms * 5 * side + mc * step) * s;
        const fy = sy + (mc * 5 * side + ms * step) * s + 5 * s;
        ctx.fillStyle = '#571713';
        ctx.beginPath();
        ctx.ellipse(fx, fy, 4.6 * s, 3.4 * s, e.aim, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.save();
    ctx.translate(sx, sy - 2 - bob);
    ctx.rotate(e.aim);
    ctx.scale(s, s);

    // tułów
    const tg = ctx.createRadialGradient(-3, -4, 2, 0, 0, 17);
    tg.addColorStop(0, '#f07a6e');
    tg.addColorStop(0.65, '#c93a30');
    tg.addColorStop(1, '#7e1d18');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(50,10,8,0.65)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // barki
    ctx.fillStyle = '#a32a23';
    ctx.beginPath(); ctx.arc(-1, -13, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-1, 13, 5.5, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#a32a23';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';

    if (e.type === 'miecz') {
      ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(9, 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(5, -9); ctx.stroke();
      const sw = e.swingT > 0 ? 1 - e.swingT / 0.28 : -1;
      const off = sw < 0 ? 0.45 : (-1.5 + sw * 2.4);
      ctx.save();
      ctx.translate(9, 8);
      ctx.rotate(off);
      ctx.strokeStyle = '#4a3526';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(3, 0); ctx.stroke();
      ctx.strokeStyle = '#8a6a2a';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(3, -4.5); ctx.lineTo(3, 4.5); ctx.stroke();
      ctx.strokeStyle = '#dbe1ec';
      ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(26, 0); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#f0928a';
      ctx.beginPath(); ctx.arc(9, 8, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -9, 3.2, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'topor') {
      // battle axe — broń bossów
      ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(9, 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(5, -9); ctx.stroke();
      const sw = e.swingT > 0 ? 1 - e.swingT / 0.28 : -1;
      const off = sw < 0 ? 0.5 : (-1.6 + sw * 2.6);
      ctx.save();
      ctx.translate(9, 8);
      ctx.rotate(off);
      paintBattleAxe();
      ctx.restore();
      ctx.fillStyle = '#f0928a';
      ctx.beginPath(); ctx.arc(9, 8, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -9, 3.2, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'wlocznia') {
      // włócznik — rzadki wróg z długim zasięgiem
      ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(8, 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(14, 5); ctx.stroke();
      const th = e.swingT > 0 ? Math.sin((1 - e.swingT / 0.28) * Math.PI) * 9 : 0;  // pchnięcie
      ctx.strokeStyle = '#8a6a3a';
      ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(th - 8, 7); ctx.lineTo(th + 24, 7); ctx.stroke();
      ctx.fillStyle = '#dbe1ec';              // grot (liść)
      ctx.beginPath();
      ctx.moveTo(th + 33, 7);
      ctx.quadraticCurveTo(th + 27, 3, th + 23, 7);
      ctx.quadraticCurveTo(th + 27, 11, th + 33, 7);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f0928a';
      ctx.beginPath(); ctx.arc(th + 2, 8, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(th + 14, 6, 3.2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(6, 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(11, -1); ctx.stroke();
      ctx.strokeStyle = '#6b4a26';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(10, -14);
      ctx.quadraticCurveTo(19, 0, 10, 14);
      ctx.stroke();
      const pull = e.shootT < 0.4 ? ((0.4 - e.shootT) / 0.4) * 7 : 0;
      ctx.strokeStyle = '#e3e3e3';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(10, -14);
      ctx.lineTo(10 - pull, 0);
      ctx.lineTo(10, 14);
      ctx.stroke();
      if (pull > 0.5) {
        ctx.strokeStyle = '#f0c14d';
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(10 - pull, 0); ctx.lineTo(19, 0); ctx.stroke();
      }
      ctx.fillStyle = '#f0928a';
      ctx.beginPath(); ctx.arc(11, -1, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(10 - pull, 1, 3.2, 0, Math.PI * 2); ctx.fill();
    }

    // głowa
    const hg = ctx.createRadialGradient(-1, -3, 1, 1, 0, 9);
    hg.addColorStop(0, '#ff9d92');
    hg.addColorStop(1, '#8f2a24');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(1, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(50,10,8,0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#3d0f0c';
    ctx.beginPath(); ctx.ellipse(6.8, 0, 2.6, 4.4, 0, 0, Math.PI * 2); ctx.fill();

    // błysk po trafieniu
    if (e.hurtT > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.65 * e.hurtT / 0.15) + ')';
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
    }

    // zamrożenie (FREEZE)
    if (e.frozenT > 0) {
      ctx.fillStyle = 'rgba(140,200,255,0.45)';
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(210,240,255,0.8)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // ogłuszenie po JUMP — nie może atakować
    if (e.noAtkT > 0) {
      ctx.strokeStyle = 'rgba(255,220,100,0.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();

    // pasek HP nad wrogiem
    const bw = 40 * s, bh = 5;
    const bx = sx - bw / 2, by = sy - 34 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rr(bx - 1.5, by - 1.5, bw + 3, bh + 3, 3);
    ctx.fill();
    const f = clamp(e.hp / e.maxHp, 0, 1);
    if (f > 0) {
      ctx.fillStyle = '#e04545';
      rr(bx, by, bw * f, bh, 2.5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      rr(bx, by, bw * f, bh / 2, 2.5);
      ctx.fill();
    }

    // podpis bossa
    if (e.isBoss) {
      ctx.font = '900 14px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#ff6552';
      ctx.fillText('BOSS', sx, by - 12);
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }
  }
}

function drawPlayer() {
  const px = player.x - camera.x;
  const py = player.y - camera.y;
  const bob = player.moving ? Math.abs(Math.sin(player.walkPhase)) * 1.6 : 0;
  const ghost = ghostT > 0;
  if (ghost) ctx.globalAlpha = 0.55;   // GHOST WALK — postać półprzezroczysta

  // cień
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(px, py + 9, 16, 8.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // stopy
  if (player.moving) {
    const mc = Math.cos(player.moveDir), ms = Math.sin(player.moveDir);
    for (const side of [-1, 1]) {
      const step = Math.sin(player.walkPhase) * 7 * side;
      const fx = px + (-ms * 5.5 * side) + mc * step;
      const fy = py + ( mc * 5.5 * side) + ms * step + 5;
      ctx.fillStyle = '#1c2a5a';
      ctx.beginPath();
      ctx.ellipse(fx, fy, 5, 3.6, player.moveDir, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.save();
  ctx.translate(px, py - 2 - bob);
  ctx.rotate(player.aim);
  const gx = -recoil;

  // tułów
  const tg = ctx.createRadialGradient(-3, -4, 2, 0, 0, 17);
  tg.addColorStop(0, '#5d8ef2');
  tg.addColorStop(0.65, '#3563d4');
  tg.addColorStop(1, '#223e8c');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(12,22,54,0.65)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // barki
  ctx.fillStyle = '#2b51b8';
  ctx.beginPath(); ctx.arc(-1, -13, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-1, 13, 5.5, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#2b51b8';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';

  if (weaponIdx === 0) {
    // ===== MIECZ =====
    ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(9, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(5, -9); ctx.stroke();
    const sw = playerSwingT > 0 ? 1 - playerSwingT / 0.25 : -1;
    const off = sw < 0 ? 0.45 : (-1.5 + sw * 2.4);
    ctx.save();
    ctx.translate(9, 8);
    ctx.rotate(off);
    ctx.strokeStyle = '#4a3526';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(3, 0); ctx.stroke();
    ctx.strokeStyle = '#8a6a2a';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(3, -4.5); ctx.lineTo(3, 4.5); ctx.stroke();
    ctx.strokeStyle = '#e8edf7';
    ctx.lineWidth = 3.6;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(30, 0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#7fa3f5';
    ctx.beginPath(); ctx.arc(9, 8, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -9, 3.4, 0, Math.PI * 2); ctx.fill();
  } else if (weaponIdx === 1) {
    // ===== BATTLE AXE (podwójny topór) =====
    ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(9, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(5, -9); ctx.stroke();
    const sw = playerSwingT > 0 ? 1 - playerSwingT / 0.25 : -1;
    const off = sw < 0 ? 0.5 : (-1.6 + sw * 2.6);
    ctx.save();
    ctx.translate(9, 8);
    ctx.rotate(off);
    paintBattleAxe();
    ctx.restore();
    ctx.fillStyle = '#7fa3f5';
    ctx.beginPath(); ctx.arc(9, 8, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -9, 3.4, 0, Math.PI * 2); ctx.fill();
  } else if (weaponIdx === 2) {
    // ===== KUSZA =====
    ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(gx + 2, 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(gx + 13, 7.5); ctx.stroke();

    const wy = 7;
    const reload = clamp(1 - cooldowns[2] / WEAPONS[2].cd, 0, 1);
    const bowX = gx + 20;
    const nockX = gx + 17 - 14 * reload;

    ctx.fillStyle = '#5a4128';
    ctx.fillRect(gx - 4, wy - 2.5, 27, 5);
    ctx.fillStyle = '#3b2a18';
    ctx.fillRect(gx - 4, wy - 0.9, 27, 1.8);
    ctx.fillStyle = '#4a3526';
    ctx.fillRect(gx + 1, wy + 2.5, 4, 4.5);

    ctx.strokeStyle = '#3a3f4a';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(bowX - 7, wy - 13);
    ctx.quadraticCurveTo(bowX + 6, wy, bowX - 7, wy + 13);
    ctx.stroke();

    ctx.strokeStyle = '#e3e3e3';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(bowX - 7, wy - 13);
    ctx.lineTo(nockX, wy);
    ctx.lineTo(bowX - 7, wy + 13);
    ctx.stroke();

    if (reload > 0.65) {
      ctx.globalAlpha = (reload - 0.65) / 0.35;
      ctx.strokeStyle = '#f0c14d';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(nockX + 1, wy); ctx.lineTo(bowX + 8, wy); ctx.stroke();
      ctx.fillStyle = '#cfd6e4';
      ctx.beginPath();
      ctx.moveTo(bowX + 13, wy);
      ctx.lineTo(bowX + 7, wy - 2.6);
      ctx.lineTo(bowX + 7, wy + 2.6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath();
      ctx.moveTo(nockX + 1, wy);
      ctx.lineTo(nockX + 6, wy - 3.2);
      ctx.lineTo(nockX + 8, wy);
      ctx.lineTo(nockX + 6, wy + 3.2);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#7fa3f5';
    ctx.beginPath(); ctx.arc(gx + 13, wy + 0.5, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(gx + 2, wy + 2, 3.4, 0, Math.PI * 2); ctx.fill();
  } else if (weaponIdx === 3) {
    // ===== ŁUK (naciągany — pull rośnie z naciągiem) =====
    const chargeF = bowCharge / BOW_MAX_CHARGE;
    const pull = chargeF * 8;
    ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(gx + 6, 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(gx + 12, -1); ctx.stroke();
    ctx.strokeStyle = '#6b4a26';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(gx + 12, -14);
    ctx.quadraticCurveTo(gx + 21, 0, gx + 12, 14);
    ctx.stroke();
    ctx.strokeStyle = '#e3e3e3';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(gx + 12, -14);
    ctx.lineTo(gx + 12 - pull, 0);
    ctx.lineTo(gx + 12, 14);
    ctx.stroke();
    // nałożona strzała (znika na czas przeładowania)
    if (cooldowns[3] <= 0) {
      ctx.strokeStyle = '#f0c14d';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(gx + 12 - pull, 0); ctx.lineTo(gx + 22, 0); ctx.stroke();
      ctx.fillStyle = '#cfd6e4';
      ctx.beginPath();
      ctx.moveTo(gx + 26, 0);
      ctx.lineTo(gx + 21, -2.4);
      ctx.lineTo(gx + 21, 2.4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#7fa3f5';
    ctx.beginPath(); ctx.arc(gx + 12, -1, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(gx + 12 - pull, 1.5, 3.4, 0, Math.PI * 2); ctx.fill();
  } else if (weaponIdx === 4) {
    // ===== WŁÓCZNIA (naciąg cofa, szarża wysuwa) =====
    const chargeF = bowCharge / BOW_MAX_CHARGE;
    const sx0 = gx - chargeF * 7 + (spearDash.speed > 0 ? 7 : 0);
    ctx.beginPath(); ctx.moveTo(-1, 13); ctx.lineTo(sx0 + 2, 8.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(sx0 + 14, 6.5); ctx.stroke();
    // drzewce
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx0 - 12, 7); ctx.lineTo(sx0 + 26, 7); ctx.stroke();
    // tylne okucie
    ctx.fillStyle = '#4a3526';
    ctx.fillRect(sx0 - 15, 5.6, 4, 2.8);
    // grot (liść)
    ctx.fillStyle = '#dbe1ec';
    ctx.beginPath();
    ctx.moveTo(sx0 + 37, 7);
    ctx.quadraticCurveTo(sx0 + 30, 2.5, sx0 + 25, 7);
    ctx.quadraticCurveTo(sx0 + 30, 11.5, sx0 + 37, 7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,45,60,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // dłonie
    ctx.fillStyle = '#7fa3f5';
    ctx.beginPath(); ctx.arc(sx0 + 2, 8.5, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx0 + 14, 6.5, 3.4, 0, Math.PI * 2); ctx.fill();
  } else {
    // ===== SZTYLETY (dwa krótkie ostrza, szybkie pchnięcie) =====
    const thrust = playerSwingT > 0 ? Math.sin((1 - playerSwingT / 0.25) * Math.PI) * 9 : 0;
    for (const side of [1, -1]) {
      const hx = 5 + thrust, hy = 7 * side;
      // ramię do dłoni
      ctx.strokeStyle = '#2b51b8';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-1, 12 * side); ctx.lineTo(hx, hy); ctx.stroke();
      // rękojeść
      ctx.strokeStyle = '#3a2a18';
      ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(hx - 3, hy); ctx.lineTo(hx + 2, hy * 0.85); ctx.stroke();
      // ostrze
      ctx.strokeStyle = '#e8edf7';
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(hx + 2, hy * 0.85); ctx.lineTo(hx + 14, hy * 0.5); ctx.stroke();
      // dłoń
      ctx.fillStyle = '#7fa3f5';
      ctx.beginPath(); ctx.arc(hx, hy, 3.3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // głowa
  const hg = ctx.createRadialGradient(-1, -3, 1, 1, 0, 9);
  hg.addColorStop(0, '#74a0ff');
  hg.addColorStop(1, '#27479e');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(1, 0, 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(12,22,54,0.7)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#141f44';
  ctx.beginPath(); ctx.ellipse(6.8, 0, 2.6, 4.4, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // tarcza (PPM) — energetyczny bąbel z heksami
  if (shieldActive()) {
    const R = 28, t = performance.now() / 1000;
    const pulse = 0.7 + 0.3 * Math.sin(t * 7);
    ctx.save();
    ctx.translate(px, py);
    ctx.fillStyle = 'rgba(70,150,255,0.08)';          // wypełnienie
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    // panele heksowe (jaśniejsze od strony celownika)
    ctx.lineWidth = 1;
    for (let k = 0; k < 12; k++) {
      const ang = (k / 12) * Math.PI * 2;
      const d = Math.cos(ang - player.aim);
      ctx.strokeStyle = 'rgba(150,210,255,' + (0.05 + 0.22 * Math.max(0, d)) + ')';
      const hx = Math.cos(ang) * R, hy = Math.sin(ang) * R;
      ctx.beginPath();
      for (let s = 0; s <= 6; s++) {
        const sa = ang + s / 6 * Math.PI * 2;
        const x = hx + Math.cos(sa) * 5.5, y = hy + Math.sin(sa) * 5.5;
        s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(120,200,255,' + (0.4 * pulse) + ')';   // pierścień
    ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(195,232,255,' + (0.95 * pulse) + ')';  // jasny łuk z przodu
    ctx.lineWidth = 4.5; ctx.beginPath(); ctx.arc(0, 0, R, player.aim - 0.95, player.aim + 0.95); ctx.stroke();
    const sa = t * 2.5;                                            // iskra obiegająca
    ctx.fillStyle = 'rgba(225,245,255,' + pulse + ')';
    ctx.beginPath(); ctx.arc(Math.cos(sa) * R, Math.sin(sa) * R, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (shieldBrokenT > 0) {
    // przeładowanie po battle axe — czerwony, narastający, przerywany łuk
    const f = 1 - shieldBrokenT / 3, t = performance.now() / 1000;
    ctx.save();
    ctx.translate(px, py);
    ctx.strokeStyle = 'rgba(255,120,120,0.55)';
    ctx.lineWidth = 2; ctx.setLineDash([4, 6]); ctx.lineDashOffset = -t * 10;
    ctx.beginPath(); ctx.arc(0, 0, 25, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // pasek zdrowia nad postacią
  const bw = 46, bh = 6;
  const bx = px - bw / 2, by = py - 37;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rr(bx - 1.5, by - 1.5, bw + 3, bh + 3, 3.5);
  ctx.fill();
  const f = clamp(player.hp / player.maxHp, 0, 1);
  if (f > 0) {
    ctx.fillStyle = f > 0.5 ? '#4ad95c' : f > 0.25 ? '#e9c63b' : '#e34a4a';
    rr(bx, by, bw * f, bh, 2.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    rr(bx, by, bw * f, bh / 2, 2.5);
    ctx.fill();
  }

  // cienki pasek pod HP — pokazuje się tylko przy przeładowaniu broni
  // (kusza/miecz/topór) albo naciąganiu (łuk/włócznia)
  const wpn = WEAPONS[weaponIdx];
  let prog = -1;
  let progCol = '#e8edf7';
  if (wpn.charge && bowCharge > 0) {
    prog = bowCharge / BOW_MAX_CHARGE;        // naciąg (złoty)
    progCol = '#ffd34d';
  } else if (cooldowns[weaponIdx] > 0) {
    prog = 1 - cooldowns[weaponIdx] / reloadCd(weaponIdx); // przeładowanie (białe)
  }
  if (prog >= 0) {
    const rw = 46, rh = 3;
    const rx = px - rw / 2, ry = by + bh + 3;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rr(rx - 1, ry - 1, rw + 2, rh + 2, 2);
    ctx.fill();
    if (prog > 0.01) {
      ctx.fillStyle = progCol;
      rr(rx, ry, rw * prog, rh, 1.5);
      ctx.fill();
    }
  }

  if (ghost) ctx.globalAlpha = 1;
}

function drawArrowSprite(bx, by, ang, shaft, fletch, glow) {
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(ang);
  ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = glow;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(6, 0); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = shaft;
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(9, 0); ctx.stroke();
  ctx.fillStyle = '#cfd6e4';
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(8, -3);
  ctx.lineTo(8, 3);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = fletch;
  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(-7, -3.4);
  ctx.lineTo(-5, 0);
  ctx.lineTo(-7, 3.4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#8a6a2a';
  ctx.fillRect(-13, -1.1, 2.5, 2.2);
  ctx.restore();
}

function drawBullets() {
  for (const b of bullets) {
    const bx = b.x - camera.x, by = b.y - camera.y;
    if (bx < -40 || by < -40 || bx > W + 40 || by > H + 40) continue;
    drawArrowSprite(bx, by, b.ang, '#f0c14d', '#ffd34d', 'rgba(255,210,90,0.22)');
  }
}

function drawEnemyArrows() {
  for (const a of enemyArrows) {
    const bx = a.x - camera.x, by = a.y - camera.y;
    if (bx < -40 || by < -40 || bx > W + 40 || by > H + 40) continue;
    drawArrowSprite(bx, by, a.ang, '#c89a4a', '#f04b3e', 'rgba(255,100,80,0.22)');
  }
}

function drawFog() {
  fogCtx.clearRect(0, 0, W, H);
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.fillStyle = 'rgba(' + theme.fog + ',0.985)';
  fogCtx.fillRect(0, 0, W, H);

  const px = player.x - camera.x;
  const py = player.y - camera.y;
  // pod wodą widać mniej; REAR SIGHT zwiększa widoczność (też w wodzie)
  const inW = isWaterAt(player.x, player.y);
  const vr = inW ? (150 + visionLvl * 35) : VISION_R;
  const vs = inW ? Math.min(visionShift(), 45) : visionShift();
  const cx = px + Math.cos(player.aim) * vs;
  const cy = py + Math.sin(player.aim) * vs;

  fogCtx.globalCompositeOperation = 'destination-out';
  const g = fogCtx.createRadialGradient(cx, cy, vr * 0.25, cx, cy, vr);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.7, 'rgba(255,255,255,0.9)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  fogCtx.fillStyle = g;
  fogCtx.beginPath();
  for (let i = 0; i <= RAYS; i++) {
    const a = (i / RAYS) * Math.PI * 2;
    // zasięg promienia = odległość od gracza do krawędzi przesuniętego koła
    const rel = a - player.aim;
    const s = Math.sin(rel);
    const reach = vs * Math.cos(rel) +
      Math.sqrt(Math.max(0, vr * vr - vs * vs * s * s));
    const d = castRay(player.x, player.y, a, reach) + 22;
    const x = px + Math.cos(a) * d;
    const y = py + Math.sin(a) * d;
    if (i === 0) fogCtx.moveTo(x, y);
    else fogCtx.lineTo(x, y);
  }
  fogCtx.closePath();
  fogCtx.fill();

  // poświata pochodni przebija mrok — ale tylko tych, które gracz
  // faktycznie widzi (ściany zasłaniają pochodnie)
  for (const t of torches) {
    const sx = t.x - camera.x, sy = t.y - camera.y;
    if (sx < -100 || sy < -100 || sx > W + 100 || sy > H + 100) continue;
    if (!hasLOS(player.x, player.y, t.x, t.y + 8)) continue;
    const fl = 0.8 + Math.random() * 0.2;
    const tg = fogCtx.createRadialGradient(sx, sy - 12, 2, sx, sy - 12, 85);
    tg.addColorStop(0, 'rgba(255,255,255,' + (0.8 * fl) + ')');
    tg.addColorStop(0.5, 'rgba(255,255,255,' + (0.32 * fl) + ')');
    tg.addColorStop(1, 'rgba(255,255,255,0)');
    fogCtx.fillStyle = tg;
    fogCtx.beginPath();
    fogCtx.arc(sx, sy - 12, 85, 0, Math.PI * 2);
    fogCtx.fill();
  }

  // łuna lawy przebija mrok (w linii wzroku)
  if (theme.lava) {
    for (const lv of lavaPools) {
      if (!hasLOS(player.x, player.y, lv.x, lv.y)) continue;
      const sx = lv.x - camera.x, sy = lv.y - camera.y;
      const lg = fogCtx.createRadialGradient(sx, sy, 2, sx, sy, lv.r + 55);
      lg.addColorStop(0, 'rgba(255,255,255,0.85)');
      lg.addColorStop(0.5, 'rgba(255,255,255,0.3)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      fogCtx.fillStyle = lg;
      fogCtx.beginPath(); fogCtx.arc(sx, sy, lv.r + 55, 0, Math.PI * 2); fogCtx.fill();
    }
  }

  // świecące kwiaty w dżungli przebijają mrok (te w pobliżu gracza)
  if (theme.decor === 'jungle') {
    for (const d of jungleDecor) {
      if (d.t !== 'flower') continue;
      if (Math.hypot(d.x - player.x, d.y - player.y) > 360) continue;
      if (!hasLOS(player.x, player.y, d.x, d.y)) continue;   // nie świeci przez ściany
      const sx = d.x - camera.x, sy = d.y - camera.y;
      const fg = fogCtx.createRadialGradient(sx, sy, 1, sx, sy, 34);
      fg.addColorStop(0, 'rgba(255,255,255,0.55)');
      fg.addColorStop(1, 'rgba(255,255,255,0)');
      fogCtx.fillStyle = fg;
      fogCtx.beginPath(); fogCtx.arc(sx, sy, 34, 0, Math.PI * 2); fogCtx.fill();
    }
  }

  ctx.drawImage(fogCanvas, 0, 0, W, H);
}

function drawOverlays() {
  const vg = ctx.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.45,
    W / 2, H / 2, Math.max(W, H) * 0.72
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.34)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (hurtT > 0) {
    ctx.fillStyle = 'rgba(200,30,30,' + (0.25 * (hurtT / 0.3)) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // niebieski błysk czaru FREEZE
  if (freezeFxT > 0) {
    ctx.fillStyle = 'rgba(120,190,255,' + (0.28 * (freezeFxT / 0.5)) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- ikony broni ----------
function drawWeaponIcon(i, cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 4);
  ctx.lineCap = 'round';
  if (i === 0) {
    // miecz
    ctx.strokeStyle = '#4a3526';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-8, 0); ctx.stroke();
    ctx.strokeStyle = '#8a6a2a';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-8, 6); ctx.stroke();
    ctx.strokeStyle = '#dbe1ec';
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(15, 0); ctx.stroke();
  } else if (i === 1) {
    // podwójny topór
    ctx.strokeStyle = '#6b4a26';
    ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(8, 0); ctx.stroke();
    for (const side of [-1, 1]) {
      ctx.fillStyle = '#dbe1ec';
      ctx.beginPath();
      ctx.moveTo(5, 1.5 * side);
      ctx.lineTo(1, 8 * side);
      ctx.quadraticCurveTo(8, 12.5 * side, 13, 7 * side);
      ctx.lineTo(10, 1.5 * side);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(40,45,60,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.fillStyle = '#cfd6e4';
    ctx.beginPath();
    ctx.moveTo(8, -1.5);
    ctx.lineTo(14, 0);
    ctx.lineTo(8, 1.5);
    ctx.closePath();
    ctx.fill();
  } else if (i === 2) {
    // kusza
    ctx.fillStyle = '#5a4128';
    ctx.fillRect(-13, -2.5, 23, 5);
    ctx.strokeStyle = '#3a3f4a';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(4, -11);
    ctx.quadraticCurveTo(14, 0, 4, 11);
    ctx.stroke();
    ctx.strokeStyle = '#e3e3e3';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(4, -11);
    ctx.lineTo(-3, 0);
    ctx.lineTo(4, 11);
    ctx.stroke();
    ctx.strokeStyle = '#f0c14d';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(12, 0); ctx.stroke();
  } else if (i === 3) {
    // łuk
    ctx.strokeStyle = '#6b4a26';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-3, -13);
    ctx.quadraticCurveTo(9, 0, -3, 13);
    ctx.stroke();
    ctx.strokeStyle = '#e3e3e3';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-3, -13); ctx.lineTo(-3, 13); ctx.stroke();
    ctx.strokeStyle = '#f0c14d';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(13, 0); ctx.stroke();
    ctx.fillStyle = '#cfd6e4';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(11, -2.5);
    ctx.lineTo(11, 2.5);
    ctx.closePath();
    ctx.fill();
  } else if (i === 4) {
    // włócznia
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(8, 0); ctx.stroke();
    ctx.fillStyle = '#4a3526';
    ctx.fillRect(-17, -1.4, 3.5, 2.8);
    ctx.fillStyle = '#dbe1ec';
    ctx.beginPath();
    ctx.moveTo(17, 0);
    ctx.quadraticCurveTo(11, -4, 7, 0);
    ctx.quadraticCurveTo(11, 4, 17, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,45,60,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
  } else {
    // sztylety — dwa skrzyżowane ostrza (X)
    for (const s of [-1, 1]) {
      ctx.strokeStyle = '#3a2a18';                 // rękojeści
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(-13, 6 * s); ctx.lineTo(-5, 2 * s); ctx.stroke();
      ctx.strokeStyle = '#e8edf7';                 // ostrza
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-5, 2 * s); ctx.lineTo(14, -4 * s); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawWeaponBar() {
  const n = WEAPONS.length;
  const size = 52, gap = 14;
  const totalW = n * size + (n - 1) * gap;
  const x0 = W / 2 - totalW / 2;
  const y = H - 86;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (size + gap);
    const sel = i === weaponIdx;
    const yy = y - (sel ? 6 : 0);
    // szary kwadrat
    ctx.fillStyle = sel ? 'rgba(72,78,94,0.95)' : 'rgba(42,46,58,0.85)';
    rr(x, yy, size, size, 10);
    ctx.fill();
    if (sel) {
      ctx.shadowColor = 'rgba(255,211,77,0.8)';
      ctx.shadowBlur = 14;
      ctx.strokeStyle = '#ffd34d';
      ctx.lineWidth = 2.5;
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.5;
    }
    rr(x, yy, size, size, 10);
    ctx.stroke();
    ctx.shadowBlur = 0;

    drawWeaponIcon(i, x + size / 2, yy + size / 2);

    if (WEAPONS[i].charge && sel && bowCharge > 0) {
      // złote wypełnienie = naciąg łuku
      const frac = bowCharge / BOW_MAX_CHARGE;
      ctx.save();
      rr(x, yy, size, size, 10);
      ctx.clip();
      ctx.fillStyle = 'rgba(255,211,77,0.35)';
      ctx.fillRect(x, yy + size * (1 - frac), size, size * frac);
      ctx.restore();
    } else if (cooldowns[i] > 0 && WEAPONS[i].cd > 0) {
      // zasłona przeładowania (znika od dołu do góry)
      const frac = cooldowns[i] / reloadCd(i);
      ctx.save();
      rr(x, yy, size, size, 10);
      ctx.clip();
      ctx.fillStyle = 'rgba(8,10,16,0.62)';
      ctx.fillRect(x, yy + size * (1 - frac), size, size * frac);
      ctx.restore();
    }

    // podpis
    ctx.font = '700 10px ' + FONT;
    ctx.fillStyle = sel ? '#ffd34d' : 'rgba(255,255,255,0.55)';
    ctx.fillText(WEAPONS[i].name, x + size / 2, yy + size + 13);
  }

  // strzałki — podpowiedź zmiany broni
  ctx.font = '700 18px ' + FONT;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('◀', x0 - 26, y + size / 2);
  ctx.fillText('▶', x0 + totalW + 26, y + size / 2);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ---------- efekty czarów (w świecie gry) ----------
function drawSpellFx() {
  // FIRE RING — pierścień z migoczących płomieni, jęzorów i iskier
  for (const ring of rings) {
    const sx = ring.x - camera.x, sy = ring.y - camera.y;
    const alpha = ring.life < 0.5 ? ring.life / 0.5 : 1;   // wygasa pod koniec
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // rozgrzane powietrze wokół pierścienia
    ctx.strokeStyle = 'rgba(255,100,25,' + (0.28 * alpha) + ')';
    ctx.lineWidth = 26;
    ctx.beginPath(); ctx.arc(sx, sy, ring.r, 0, Math.PI * 2); ctx.stroke();
    // płomyki po obwodzie (migoczą losowo)
    const N = 40;
    for (let k = 0; k < N; k++) {
      const a = (k / N) * Math.PI * 2 + ring.r * 0.004;
      const fl = 0.6 + Math.random() * 0.7;
      const bx = sx + Math.cos(a) * ring.r;
      const by = sy + Math.sin(a) * ring.r;
      const fr = 12 * fl;
      const g = ctx.createRadialGradient(bx, by, 1, bx, by, fr);
      g.addColorStop(0, 'rgba(255,240,170,' + (0.85 * alpha) + ')');
      g.addColorStop(0.45, 'rgba(255,150,40,' + (0.55 * alpha) + ')');
      g.addColorStop(1, 'rgba(220,60,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, fr, 0, Math.PI * 2); ctx.fill();
      // jęzor ognia strzelający na zewnątrz
      const tip = 12 + Math.random() * 18;
      ctx.fillStyle = 'rgba(255,175,60,' + (0.55 * alpha * fl) + ')';
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a - 0.05) * (ring.r - 4), sy + Math.sin(a - 0.05) * (ring.r - 4));
      ctx.lineTo(sx + Math.cos(a + (Math.random() - 0.5) * 0.05) * (ring.r + tip),
                 sy + Math.sin(a + (Math.random() - 0.5) * 0.05) * (ring.r + tip));
      ctx.lineTo(sx + Math.cos(a + 0.05) * (ring.r - 4), sy + Math.sin(a + 0.05) * (ring.r - 4));
      ctx.closePath();
      ctx.fill();
    }
    // iskry unoszące się przy ogniu
    ctx.fillStyle = 'rgba(255,215,100,' + (0.6 * alpha) + ')';
    for (let k = 0; k < 14; k++) {
      const a = Math.random() * Math.PI * 2;
      const rr2 = ring.r + (Math.random() - 0.25) * 22;
      ctx.fillRect(sx + Math.cos(a) * rr2 - 1, sy + Math.sin(a) * rr2 - 1, 2, 2);
    }
    ctx.restore();
  }
  // płomienie FIRE TRAIL
  for (const p of firePatches) {
    const sx = p.x - camera.x, sy = p.y - camera.y;
    if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
    const a = Math.min(1, p.life / 1.2) * (0.5 + Math.random() * 0.25);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(sx, sy, 2, sx, sy, 20);
    g.addColorStop(0, 'rgba(255,230,150,' + a + ')');
    g.addColorStop(0.5, 'rgba(255,140,50,' + (a * 0.8) + ')');
    g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, 20, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // FIREBALL
  for (const f of fireballs) {
    const sx = f.x - camera.x, sy = f.y - camera.y;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,150,60,0.5)';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx - f.vx * 0.05, sy - f.vy * 0.05);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    const g = ctx.createRadialGradient(sx, sy, 1, sx, sy, 17);
    g.addColorStop(0, 'rgba(255,240,180,0.95)');
    g.addColorStop(0.4, 'rgba(255,150,50,0.8)');
    g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, 17, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // LIGHTNING (niebieskie) i piorunki teleportów (fioletowe, mniejsze)
  for (const b of bolts) {
    const sx = b.x - camera.x, sy = b.y - camera.y;
    const a = b.t / 0.4;
    const len = b.purple ? 200 : 340;
    const rgb = b.purple ? '215,150,255' : '210,235,255';
    const glowRgb = b.purple ? '170,90,255' : '150,200,255';
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.9 * a) + ')';
    ctx.lineWidth = b.purple ? 2.4 : 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(sx + (Math.random() * 2 - 1) * 8, sy - len);
    const STEPS = 8;
    for (let k = 1; k <= STEPS; k++) {
      const yy = sy - len + (len / STEPS) * k;
      const xx = k === STEPS ? sx : sx + (Math.random() * 2 - 1) * (b.purple ? 13 : 20);
      ctx.lineTo(xx, yy);
    }
    ctx.stroke();
    const g = ctx.createRadialGradient(sx, sy, 1, sx, sy, 30);
    g.addColorStop(0, 'rgba(' + rgb + ',' + (0.8 * a) + ')');
    g.addColorStop(1, 'rgba(' + glowRgb + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // fioletowe światło w miejscu odradzania wroga
  for (const p of pendingSpawns) {
    const sx = p.x - camera.x, sy = p.y - camera.y;
    if (sx < -60 || sy < -60 || sx > W + 60 || sy > H + 60) continue;
    const f = 1 - p.t;   // narasta do pojawienia
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(sx, sy, 2, sx, sy, 34);
    g.addColorStop(0, 'rgba(200,130,255,' + (0.45 + 0.4 * f) + ')');
    g.addColorStop(1, 'rgba(140,60,220,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(205,145,255,' + (0.3 + 0.5 * f) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 24 - f * 14, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // wybuchy fireballi
  for (const ex of explosions) {
    const sx = ex.x - camera.x, sy = ex.y - camera.y;
    const f = 1 - ex.t / 0.3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,180,80,' + (1 - f) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(sx, sy, 10 + f * 32, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // fala PUSH
  if (pushFxT > 0) {
    const sx = player.x - camera.x, sy = player.y - camera.y;
    const f = 1 - pushFxT / 0.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(180,220,255,' + (0.7 * (1 - f)) + ')';
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(sx, sy, 30 + f * 390, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// ---------- ikony czarów ----------
function drawSpellIcon(id, cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.lineCap = 'round';
  if (id === 'ring') {
    ctx.strokeStyle = '#ff8c3c';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffd34d';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.stroke();
  } else if (id === 'freeze') {
    ctx.strokeStyle = '#9fd8ff';
    ctx.lineWidth = 2.4;
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12);
      ctx.stroke();
    }
  } else if (id === 'slow') {
    ctx.strokeStyle = '#cfd6e4';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(5, 3); ctx.stroke();
  } else if (id === 'ghost') {
    ctx.fillStyle = 'rgba(220,228,247,0.85)';
    ctx.beginPath();
    ctx.arc(0, -2, 9, Math.PI, 0);
    ctx.lineTo(9, 9);
    ctx.lineTo(5, 5);
    ctx.lineTo(0, 9);
    ctx.lineTo(-5, 5);
    ctx.lineTo(-9, 9);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1a1c24';
    ctx.beginPath(); ctx.arc(-3, -3, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -3, 1.7, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'push') {
    ctx.strokeStyle = '#b4dcff';
    ctx.lineWidth = 2.4;
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2 + Math.PI / 4;
      const c = Math.cos(a), si = Math.sin(a);
      ctx.beginPath(); ctx.moveTo(c * 4, si * 4); ctx.lineTo(c * 13, si * 13); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(c * 13 + Math.cos(a + 2.6) * 4.5, si * 13 + Math.sin(a + 2.6) * 4.5);
      ctx.lineTo(c * 13, si * 13);
      ctx.lineTo(c * 13 + Math.cos(a - 2.6) * 4.5, si * 13 + Math.sin(a - 2.6) * 4.5);
      ctx.stroke();
    }
  } else if (id === 'fireball') {
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 10);
    g.addColorStop(0, '#fff0b4');
    g.addColorStop(0.5, '#ff963c');
    g.addColorStop(1, '#d2501e');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(2, -1, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,150,60,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-13, 9); ctx.lineTo(-4, 3); ctx.stroke();
  } else if (id === 'bolt') {
    ctx.fillStyle = '#ffe14d';
    ctx.beginPath();
    ctx.moveTo(2, -13);
    ctx.lineTo(-6, 1);
    ctx.lineTo(-1, 1);
    ctx.lineTo(-3, 13);
    ctx.lineTo(6, -2);
    ctx.lineTo(1, -2);
    ctx.closePath();
    ctx.fill();
  } else if (id === 'trail') {
    ctx.fillStyle = '#ff8c3c';
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.quadraticCurveTo(9, -3, 7, 5);
    ctx.quadraticCurveTo(11, 10, 0, 13);
    ctx.quadraticCurveTo(-11, 10, -7, 5);
    ctx.quadraticCurveTo(-9, -3, 0, -12);
    ctx.fill();
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(0, 6, 4.5, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'jump') {
    ctx.strokeStyle = '#9fe8a9';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(-11, 6);
    ctx.quadraticCurveTo(0, -14, 9, -1);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -1); ctx.lineTo(3, -3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -1); ctx.lineTo(10, -8); ctx.stroke();
    ctx.fillStyle = '#e34a4a';
    ctx.beginPath(); ctx.arc(10, 7, 4, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'teleport') {
    // dwa portale + strzałka
    ctx.strokeStyle = '#b98cff'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(-8, 4, 4, 8, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#7ad6ff';
    ctx.beginPath(); ctx.ellipse(8, -4, 4, 8, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#e6dcff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, 2); ctx.lineTo(6, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(1, -3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(3, 2); ctx.stroke();
  } else if (id === 'clone') {
    // dwie sylwetki obok siebie
    ctx.fillStyle = 'rgba(120,210,255,0.9)';
    ctx.beginPath(); ctx.arc(-5, -3, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9, 11); ctx.quadraticCurveTo(-5, 1, -1, 11); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(120,210,255,0.55)';
    ctx.beginPath(); ctx.arc(6, -2, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(2, 12); ctx.quadraticCurveTo(6, 2, 10, 12); ctx.closePath(); ctx.fill();
  } else if (id === 'meteor') {
    const g = ctx.createRadialGradient(3, -3, 1, 3, -3, 9);
    g.addColorStop(0, '#fff0b4'); g.addColorStop(0.5, '#ff7a2c'); g.addColorStop(1, '#8a2c10');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(3, -2, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,80,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-12, 11); ctx.lineTo(-3, 4); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,120,50,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-9, 13); ctx.lineTo(-1, 7); ctx.stroke();
  }
  ctx.restore();
}

// ---------- pasek czarów (lewy dół, klawisze 1/2/3) ----------
function drawSpellBar() {
  const size = 48, gap = 12;
  const x0 = 22, y = H - 86;
  ctx.textBaseline = 'middle';
  for (let s = 0; s < 3; s++) {
    const x = x0 + s * (size + gap);
    const idx = chosenSpells[s];
    ctx.fillStyle = 'rgba(42,46,58,0.85)';
    rr(x, y, size, size, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    rr(x, y, size, size, 10);
    ctx.stroke();
    if (idx !== null) {
      drawSpellIcon(SPELLS[idx].id, x + size / 2, y + size / 2, 1);
      // zasłona odliczania: meteor pokazuje brakujące zabójstwa, reszta sekundy cooldownu
      let veil = 0, label = null, killLbl = false;
      if (SPELLS[idx].id === 'meteor' && meteorCharge < METEOR_KILLS) {
        veil = (METEOR_KILLS - meteorCharge) / METEOR_KILLS;
        label = (METEOR_KILLS - meteorCharge); killLbl = true;
      }
      if (spellCds[s] > 0) {
        const f = spellCds[s] / Math.max(1, spellCdMax[s]);
        if (f >= veil) { veil = f; label = Math.ceil(spellCds[s]); killLbl = false; }
      }
      if (veil > 0) {
        ctx.save();
        rr(x, y, size, size, 10);
        ctx.clip();
        ctx.fillStyle = 'rgba(8,10,16,0.68)';
        ctx.fillRect(x, y + size * (1 - veil), size, size * veil);
        ctx.restore();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        if (killLbl) {   // "×N" zabójstw do naładowania meteoru
          ctx.font = '800 15px ' + FONT;
          ctx.fillText('☠' + label, x + size / 2, y + size / 2);
        } else {
          ctx.font = '800 16px ' + FONT;
          ctx.fillText(label, x + size / 2, y + size / 2);
        }
      }
      ctx.font = '700 9px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(SPELLS[idx].name, x + size / 2, y + size + 11);
    }
    // numer klawisza
    ctx.font = '800 12px ' + FONT;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd34d';
    ctx.fillText(s + 1, x + 5, y + 10);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ---------- ekran wyboru czarów ----------
function drawSpellSelect() {
  ctx.fillStyle = 'rgba(8,10,16,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 34px ' + FONT;
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('CHOOSE 3 SPELLS', W / 2, H * 0.07);
  ctx.shadowBlur = 0;
  ctx.font = '600 14px ' + FONT;
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('click a spell to assign it • click a slot to clear it • use with keys 1 / 2 / 3', W / 2, H * 0.07 + 28);

  // karty czarów (siatka 3 kolumny × tyle rzędów, ile trzeba)
  const cols = 3, rows = Math.ceil(SPELLS.length / cols);
  const cw = Math.min(250, (W - 100) / cols - 14), ch = 76, gapX = 14, gapY = 10;
  const gridW = cw * cols + gapX * (cols - 1);
  const gx0 = W / 2 - gridW / 2;
  const gy0 = H * 0.12;
  ui.spellCards = [];
  for (let i = 0; i < SPELLS.length; i++) {
    const col = i % cols, row = (i / cols) | 0;
    const x = gx0 + col * (cw + gapX), y = gy0 + row * (ch + gapY);
    const card = { x: x, y: y, w: cw, h: ch };
    ui.spellCards.push(card);
    const slot = chosenSpells.indexOf(i);
    const hov = inRect(card);
    ctx.fillStyle = slot >= 0 ? 'rgba(86,74,40,0.92)' : hov ? 'rgba(62,68,84,0.92)' : 'rgba(42,46,58,0.88)';
    rr(x, y, cw, ch, 10);
    ctx.fill();
    ctx.strokeStyle = slot >= 0 ? '#ffd34d' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = slot >= 0 ? 2.5 : 1.5;
    rr(x, y, cw, ch, 10);
    ctx.stroke();
    drawSpellIcon(SPELLS[i].id, x + 26, y + ch / 2, 1);
    ctx.textAlign = 'left';
    ctx.font = '800 14px ' + FONT;
    ctx.fillStyle = slot >= 0 ? '#ffd34d' : '#ffffff';
    ctx.fillText(SPELLS[i].name, x + 50, y + 20);
    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(SPELLS[i].desc, x + 50, y + 42);
    ctx.font = '600 10px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('cooldown: ' + SPELLS[i].cd + ' s', x + 50, y + 62);
    if (slot >= 0) {
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath(); ctx.arc(x + cw - 16, y + 16, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1c24';
      ctx.font = '800 13px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText(slot + 1, x + cw - 16, y + 17);
    }
    ctx.textAlign = 'center';
  }

  // sloty klawiszy 1/2/3
  const sw2 = 150, sh2 = 46, sgap = 16;
  const sx0 = W / 2 - (sw2 * 3 + sgap * 2) / 2;
  const sy0 = gy0 + rows * (ch + gapY) + 8;
  ui.spellSlots = [];
  for (let s = 0; s < 3; s++) {
    const x = sx0 + s * (sw2 + sgap);
    const slotRect = { x: x, y: sy0, w: sw2, h: sh2 };
    ui.spellSlots.push(slotRect);
    const hov = inRect(slotRect);
    const act = activeSlot === s;
    ctx.fillStyle = act ? 'rgba(86,74,40,0.95)' : hov ? 'rgba(62,68,84,0.95)' : 'rgba(30,33,42,0.9)';
    rr(x, sy0, sw2, sh2, 9);
    ctx.fill();
    ctx.strokeStyle = act ? '#ffd34d' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = act ? 2.5 : 1.5;
    rr(x, sy0, sw2, sh2, 9);
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.font = '800 15px ' + FONT;
    ctx.fillStyle = '#ffd34d';
    ctx.fillText(s + 1, x + 10, sy0 + sh2 / 2 + 1);
    const idx = chosenSpells[s];
    if (idx !== null) {
      drawSpellIcon(SPELLS[idx].id, x + 36, sy0 + sh2 / 2, 0.7);
      ctx.font = '700 11px ' + FONT;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(SPELLS[idx].name, x + 52, sy0 + sh2 / 2 + 1);
    } else {
      ctx.font = '600 11px ' + FONT;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('empty', x + 30, sy0 + sh2 / 2 + 1);
    }
    ctx.textAlign = 'center';
  }

  const ready = chosenSpells.every(v => v !== null);
  ui.spellStart = { x: W / 2 - 120, y: sy0 + sh2 + 16, w: 240, h: 54 };
  if (!ready) ctx.globalAlpha = 0.45;
  drawButton(ui.spellStart, 'START', true);
  ctx.globalAlpha = 1;
  if (!ready) {
    ctx.font = '600 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('choose 3 spells to start', W / 2, ui.spellStart.y + 54 + 14);
  }
  ui.spellBack = { x: W / 2 - 70, y: ui.spellStart.y + 54 + 28, w: 140, h: 40 };
  drawButton(ui.spellBack, 'BACK', false);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawBossBar() {
  let boss = null;
  for (const e of enemies) if (e.isBoss) { boss = e; break; }
  if (!boss) return;
  const bw = Math.min(440, W * 0.5), bh = 14;
  const x = W / 2 - bw / 2, y = 84;
  ctx.fillStyle = 'rgba(8,10,18,0.6)';
  rr(x - 5, y - 5, bw + 10, bh + 10, 8);
  ctx.fill();
  const f = clamp(boss.hp / boss.maxHp, 0, 1);
  if (f > 0) {
    const g = ctx.createLinearGradient(0, y, 0, y + bh);
    g.addColorStop(0, '#ff6552');
    g.addColorStop(1, '#a82418');
    ctx.fillStyle = g;
    rr(x, y, bw * f, bh, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    rr(x, y, bw * f, bh / 2, 6);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  rr(x, y, bw, bh, 6);
  ctx.stroke();
  // napis BOSS pod paskiem
  ctx.font = '900 16px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 5;
  ctx.fillStyle = '#ff7b6b';
  ctx.fillText('BOSS', W / 2, y + bh + 16);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// minimapa: labirynt + gracz + tylko wrogowie w pobliżu gracza
function drawMinimap() {
  const mx = 22, my = 78;            // pod paskiem HP (lewy górny róg)
  const ms = WT * MM_SCALE;
  const f = MM_SCALE / TILE;         // świat -> piksele minimapy
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = 'rgba(8,10,18,0.55)';
  rr(mx - 4, my - 4, ms + 8, ms + 8, 8);
  ctx.fill();
  ctx.drawImage(minimapCanvas, mx, my);
  // zwykli wrogowie — tylko blisko gracza; boss zawsze (z koroną)
  let boss = null;
  for (const e of enemies) {
    if (e.isBoss) { boss = e; continue; }
    if (Math.hypot(e.x - player.x, e.y - player.y) > 480) continue;
    ctx.fillStyle = '#e04545';
    ctx.beginPath();
    ctx.arc(mx + e.x * f, my + e.y * f, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  if (boss) {
    const bx = mx + boss.x * f, by = my + boss.y * f;
    ctx.fillStyle = '#ff4040';                 // czerwona kropka bossa
    ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ffd34d';                 // korona nad kropką
    ctx.beginPath();
    ctx.moveTo(bx - 4, by - 4);
    ctx.lineTo(bx - 4, by - 7);
    ctx.lineTo(bx - 2, by - 5.5);
    ctx.lineTo(bx, by - 8);
    ctx.lineTo(bx + 2, by - 5.5);
    ctx.lineTo(bx + 4, by - 7);
    ctx.lineTo(bx + 4, by - 4);
    ctx.closePath();
    ctx.fill();
  }
  // gracz
  ctx.fillStyle = '#5d8ef2';

  ctx.lineWidth = 1.5;

  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  ctx.textBaseline = 'middle';

  // --- HP — lewy górny róg ---
  const x = 22, y = 20, w = 280, h = 30;
  ctx.fillStyle = 'rgba(8,10,18,0.55)';
  rr(x - 8, y - 8, w + 16, h + 16, 12);

  rr(x, y, w, h, 8);
  ctx.fill();
  const f = clamp(player.hp / player.maxHp, 0, 1);
  if (f > 0) {
    const col = f > 0.5 ? ['#5ee36f', '#2da344']
              : f > 0.25 ? ['#f2d54a', '#c79c20']
              : ['#f25b5b', '#b32626'];
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, col[0]);
    g.addColorStop(1, col[1]);
    ctx.fillStyle = g;
    rr(x, y, w * f, h, 8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    rr(x, y, w * f, h / 2, 8);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;
  rr(x, y, w, h, 8);
  ctx.stroke();
  ctx.font = '700 17px ' + FONT;
  ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';

  ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';

  ctx.fillStyle = '#ffd34d';

  // --- pasek tlenu (gdy pod wodą lub niepełny) ---

    rr(x, oy, ow * of, oh, 5); ctx.fill();

  ctx.font = '800 30px ' + FONT;

  ctx.font = '600 14px ' + FONT;
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 4;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(betweenWaves ? ('get ready…' + (lastRegen > 0 ? '  +' + lastRegen + ' HP' : ''))
                            : (wave % 5 === 0
                                ? 'enemies: ' + (enemies.length + pendingSpawns.length)
                                : 'left: ' + Math.max(0, waveKillTarget - waveKills)), W / 2, 62);
  ctx.shadowBlur = 0;

  // --- przycisk PAUSE — prawy górny róg ---
  ui.pause = { x: W - 122, y: 18, w: 100, h: 36 };
  const pHov = state === 'playing' && inRect(ui.pause);
  ctx.fillStyle = pHov ? 'rgba(255,255,255,0.18)' : 'rgba(8,10,18,0.55)';
  rr(ui.pause.x, ui.pause.y, ui.pause.w, ui.pause.h, 9);
  ctx.fill();
  ctx.strokeStyle = pHov ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  rr(ui.pause.x, ui.pause.y, ui.pause.w, ui.pause.h, 9);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ui.pause.x + 13, ui.pause.y + 11, 4, 14);   // ikonka ❚❚
  ctx.fillRect(ui.pause.x + 20, ui.pause.y + 11, 4, 14);
  ctx.font = '800 14px ' + FONT;
  ctx.textAlign = 'left';
  ctx.fillText('PAUSE', ui.pause.x + 33, ui.pause.y + 19);

  // --- przycisk MUTE (na lewo od PAUSE) ---
  ui.mute = { x: ui.pause.x - 46, y: 18, w: 36, h: 36 };
  const mHov = inRect(ui.mute);
  ctx.fillStyle = mHov ? 'rgba(255,255,255,0.18)' : 'rgba(8,10,18,0.55)';
  rr(ui.mute.x, ui.mute.y, ui.mute.w, ui.mute.h, 9);
  ctx.fill();
  ctx.strokeStyle = mHov ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  rr(ui.mute.x, ui.mute.y, ui.mute.w, ui.mute.h, 9);
  ctx.stroke();
  const mcx = ui.mute.x + 13, mcy = ui.mute.y + 18;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();                                    // głośniczek
  ctx.moveTo(mcx - 5, mcy - 3);
  ctx.lineTo(mcx - 1, mcy - 3);
  ctx.lineTo(mcx + 3, mcy - 7);
  ctx.lineTo(mcx + 3, mcy + 7);
  ctx.lineTo(mcx - 1, mcy + 3);
  ctx.lineTo(mcx - 5, mcy + 3);
  ctx.closePath();
  ctx.fill();
  if (sfx.isMuted()) {
    ctx.strokeStyle = '#ff6b6b';                      // czerwony przekreślony = wyciszone
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(mcx + 6, mcy - 7);
    ctx.lineTo(mcx + 15, mcy + 7);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#ffffff';                      // fale dźwięku
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(mcx + 4, mcy, 5, -0.7, 0.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(mcx + 4, mcy, 9, -0.6, 0.6); ctx.stroke();
  }

  // --- podpowiedź sterowania ---
  const hintA = clamp(1 - (hintT - 8) / 1.5, 0, 1);
  if (hintA > 0) {
    ctx.globalAlpha = hintA;
    ctx.textAlign = 'left';
    ctx.font = '600 14px ' + FONT;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  drawMinimap();
}

function drawAnnounce() {
  if (announceT <= 0) return;
  const t = 1 - announceT / ANNOUNCE_DUR;
  const aIn = clamp(t / 0.12, 0, 1);
  const aOut = clamp(announceT / 0.5, 0, 1);
  const alpha = Math.min(aIn, aOut);
  const scale = 1 + t * 0.12;
  ctx.save();
  ctx.translate(W / 2, H * 0.36);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 68px ' + FONT;
  ctx.lineWidth = 9;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(10,12,20,0.85)';
  ctx.strokeText(announceText, 0, 0);
  ctx.fillStyle = announceColor;
  ctx.fillText(announceText, 0, 0);
  ctx.restore();
}

function drawCrosshair() {
  const x = mouse.x, y = mouse.y;
  const r = 10 + (mouse.down ? 3 : 0) + recoil * 0.8;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 1.8;
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 3;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * (r + 3), y + Math.sin(a) * (r + 3));
    ctx.lineTo(x + Math.cos(a) * (r + 9), y + Math.sin(a) * (r + 9));
    ctx.stroke();
  }
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath();
  ctx.arc(x, y, 2, 0, Math.PI * 2);
  ctx.fill();
  // wskaźnik naciągu łuku wokół celownika + aktualne obrażenia
  if (WEAPONS[weaponIdx].charge && bowCharge > 0) {
    const frac = bowCharge / BOW_MAX_CHARGE;
    ctx.strokeStyle = '#ffd34d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r + 6, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
    ctx.font = '700 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd34d';
    const steps = Math.floor(bowCharge / 0.5 + 1e-6);
    ctx.fillText(steps >= 1 ? Math.min(steps, WEAPONS[weaponIdx].dmg) : '½', x, y + r + 20);
  }
  ctx.restore();
}
