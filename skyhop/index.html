<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyhop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d1b2a;color:#fff;font-family:"Fredoka",system-ui,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size}
  canvas{display:block;width:100%;height:100%}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:1.8cqw;text-align:center;background:rgba(13,27,42,.55);backdrop-filter:blur(3px);padding:3cqw}
  .screen[hidden]{display:none}
  h1{margin:0;font-size:7.5cqw;font-weight:700;letter-spacing:.02em;line-height:1;
     text-shadow:0 .6cqw 0 #2b6cb0,0 1.2cqw 2cqw rgba(0,0,0,.3)}
  h2{margin:0;font-size:6cqw;font-weight:700;text-shadow:0 .4cqw 0 #2b6cb0}
  p{margin:0;font-size:1.8cqw;opacity:.9}
  button{font:inherit;font-weight:600;font-size:2.2cqw;padding:1cqw 3.5cqw;border:0;border-radius:99px;
         background:#ffd23f;color:#3a2a00;cursor:pointer;box-shadow:0 .4cqw 0 #c99a00;transition:transform .1s}
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(2px);box-shadow:0 .1cqw 0 #c99a00}
  button.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
  button:disabled{opacity:.35;cursor:default;transform:none}
  .lvl{font-size:1.6cqw;padding:.6cqw 1.8cqw}
  .row{display:flex;gap:1.5cqw;flex-wrap:wrap;justify-content:center}
  .worlds{display:flex;flex-direction:column;gap:.9cqw}
  .wrow{display:flex;gap:1cqw;align-items:center;justify-content:center}
  .wname{font-size:1.5cqw;font-weight:600;width:14cqw;text-align:right;opacity:.85}
  .keys{display:grid;grid-template-columns:repeat(3,auto);gap:.5cqw 2.5cqw;font-size:1.5cqw;text-align:left}
  kbd{font:inherit;font-weight:600;background:rgba(255,255,255,.18);border-radius:.5cqw;padding:.1cqw .8cqw;margin-right:.4cqw}
  .stats{display:grid;grid-template-columns:auto auto;gap:.5cqw 3cqw;font-size:2.2cqw;text-align:left}
  .stats b{color:#ffd23f}
  .vol{display:flex;align-items:center;gap:1cqw;font-size:1.6cqw}
  .vol input{width:16cqw;accent-color:#ffd23f}

  /* touch controls */
  #touch{position:absolute;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #touch[hidden],.tbtn[hidden]{display:none}
  .tbtn{position:absolute;pointer-events:auto;touch-action:none;display:flex;flex-direction:column;
        align-items:center;justify-content:center;border:.3cqw solid #000;transition:transform .06s}
  .tbtn.on{transform:scale(.92)}
  .tbtn svg{display:block}
  .tsq{bottom:2.5cqw;width:11.5cqw;height:11.5cqw;border-radius:1.2cqw;background:rgba(255,255,255,.2)}
  .tsq.on{background:rgba(255,255,255,.45)}
  .tsq svg{width:70%;height:70%}
  #tLeft{left:2.5cqw} #tRight{left:15.5cqw}
  .tround{border-radius:50%;font-weight:700;letter-spacing:.05em}
  #tJump{right:2.5cqw;bottom:2.5cqw;width:12.5cqw;height:12.5cqw;background:rgba(255,255,255,.88);color:#000;font-size:2.4cqw}
  #tJump.on{background:#d9d9d9}
  #tFire{right:16.5cqw;bottom:8.5cqw;width:10cqw;height:10cqw;background:radial-gradient(circle at 35% 30%,#ffb04a,#ff4d1a 70%);
         color:#fff;font-size:1.8cqw;-webkit-text-stroke:.22cqw #000;paint-order:stroke fill;opacity:.92}
  #tFire svg{width:45%;height:45%;margin-bottom:.2cqw}
  #tFire.on{filter:brightness(1.2)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="touch" hidden>
    <div class="tbtn tsq" id="tLeft" data-k="left" aria-label="Left">
      <svg viewBox="0 0 100 100"><polygon points="58,14 16,50 58,86 58,64 86,64 86,36 58,36" fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/></svg>
    </div>
    <div class="tbtn tsq" id="tRight" data-k="right" aria-label="Right">
      <svg viewBox="0 0 100 100"><polygon points="42,14 84,50 42,86 42,64 14,64 14,36 42,36" fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/></svg>
    </div>
    <div class="tbtn tround" id="tJump" data-k="jump">JUMP</div>
    <div class="tbtn tround" id="tFire" data-k="fire" hidden>
      <svg viewBox="0 0 100 100"><path d="M22,22 L78,78 M78,22 L22,78" stroke="#000" stroke-width="26" stroke-linecap="round"/><path d="M22,22 L78,78 M78,22 L22,78" stroke="#fff" stroke-width="13" stroke-linecap="round"/></svg>
      FIRE
    </div>
  </div>

  <div class="screen" id="title">
    <h1>SKYHOP</h1>
    <div class="keys">
      <div><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> run</div>
      <div><kbd>Space</kbd> / <kbd>W</kbd> jump</div>
      <div><kbd>X</kbd> / <kbd>K</kbd> throw fire</div>
      <div><kbd>P</kbd> / <kbd>Esc</kbd> pause</div>
      <div><kbd>R</kbd> restart level</div>
      <div><kbd>M</kbd> mute</div>
    </div>
    <div class="worlds" id="levelBtns"></div>
    <div class="vol">Volume <input type="range" class="volIn" min="0" max="100" value="60" aria-label="Volume"></div>
  </div>

  <div class="screen" id="pause" hidden>
    <h2>Paused</h2>
    <div class="row">
      <button id="resumeBtn">Resume</button>
      <button class="ghost" id="restartBtn">Restart level</button>
      <button class="ghost" id="menuBtn">Menu</button>
    </div>
    <div class="vol">Volume <input type="range" class="volIn" min="0" max="100" value="60" aria-label="Volume"></div>
    <p>P or Esc to resume · M to mute</p>
  </div>

  <div class="screen" id="done" hidden>
    <h2 id="dTitle">Level clear!</h2>
    <p id="dNote" hidden></p>
    <div class="stats">
      <span>Time</span><b id="dTime"></b>
      <span>Best</span><b id="dBest"></b>
      <span>Coins</span><b id="dCoins"></b>
      <span>Big coins</span><b id="dBig"></b>
      <span>Deaths</span><b id="dDeaths"></b>
    </div>
    <div class="row">
      <button id="nextBtn">Next level</button>
      <button class="ghost" id="againBtn">Play again</button>
      <button class="ghost" id="doneMenuBtn">Menu</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 960, VH = 540, T = 32, LH = 20, G = 16;   // G = top row of the ground

// ---------- movement tuning (per 1/60 s frame) ----------
const RUN = 4.4, JUMP = -10.6, WALLJUMP_X = 5.4, WALLJUMP_Y = -9.8;
const G_UP = 0.5, G_CUT = 1.15, G_DOWN = 0.72, MAXFALL = 11, SLIDE = 2.3;
const COYOTE = 6, BUFFER = 8, SPRING = -15.5, STOMP = -7.5, STOMP_HELD = -11;
const MAX_HP = 3, STAR_TIME = 480, BLINK_PERIOD = 110;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = (x, y) => { const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return v - Math.floor(v); };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ---------- tiles ----------
const EMPTY = 0, SOLID = 1, ONEWAY = 2, QBLOCK = 3, USED = 4, FAKE = 5,
      CRUMBLE = 6, SPIKE = 7, LAVA = 8, BLINK_A = 9, BLINK_B = 10, ICE = 11, CANNON = 12;

// ---------- worlds ----------
const WORLDS = {
  1: { name: 'Meadow', bg: 'meadow',
       ground: { body: '#8a5530', dot: '#6e4224', edge: '#5a3418', top: ['#4cbb47', '#3a9a39', '#8be36a'] },
       plank: ['#c8894a', '#e3a865', '#7a4a22'] },
  2: { name: 'Crystal Caves', bg: 'cave',
       ground: { body: '#3d3654', dot: '#2d2740', edge: '#1c1828', top: ['#6a5fa0', '#4d4480', '#a99cf0'] },
       plank: ['#5d5480', '#8a80b8', '#2d2740'] },
  3: { name: 'Storm Castle', bg: 'castle',
       ground: { body: '#59606f', dot: '#474d5b', edge: '#262a35', top: ['#7c8494', '#5d6574', '#a7aebd'] },
       plank: ['#4a4f5e', '#80889a', '#262a35'] },
  4: { name: 'Frozen Peaks', bg: 'ice',
       ground: { body: '#6d7f99', dot: '#5a6b84', edge: '#34445a', top: ['#e6f3fb', '#c9e1f0', '#ffffff'] },
       plank: ['#a9d8f0', '#e6f7ff', '#5a86a8'] },
  5: { name: 'Sky Kingdom', bg: 'sky',
       ground: { body: '#e9dcb8', dot: '#d8c79a', edge: '#b0904e', top: ['#ffffff', '#e8ecf6', '#ffffff'] },
       plank: ['#ffffff', '#ffffff', '#c9d0e4'] }
};

// ---------- levels ----------
const SKY_DAY = { g: ['#5ab8f5', '#a8defa', '#e3f6ff'], hills: ['#9fdc8f', '#6cc46a'], sun: '#fff6c4' };
const SKY_LATE = { g: ['#4aa3e8', '#9fd2f2', '#f6f0d2'], hills: ['#8fcf86', '#58b05c'], sun: '#fff0b0' };
const SKY_DUSK = { g: ['#3b3a78', '#c46a8a', '#ffc58a'], hills: ['#6f5f9a', '#4a8a5a'], sun: '#ffdf9a' };
const CAVE = { g: ['#120f24', '#211a3d', '#2f2550'], rock: ['#2a2346', '#1d1834'], glow: '120,220,255' };
const CAVE_DEEP = { g: ['#08070f', '#120f22', '#1a1530'], rock: ['#1e1a33', '#141125'], glow: '190,120,255' };
const STORM = { g: ['#1a1f2e', '#2e3548', '#4a5368'], towers: ['#2a3040', '#1c212d'], moon: '#dfe6f0' };
const STORM_RED = { g: ['#1c1424', '#3a2236', '#6a3a3a'], towers: ['#2c2030', '#1d1520'], moon: '#ffd2b0' };
const SNOW = { g: ['#7fb2e0', '#bfe0f5', '#f2fbff'], peaks: ['#cfe1f0', '#a5c2da'], sun: '#fffbe8' };
const SNOW_DUSK = { g: ['#4a5a9a', '#b08ab8', '#ffd0b8'], peaks: ['#b6aed0', '#8c86b0'], sun: '#ffe6c8' };
const SKYK = { g: ['#ff9f5a', '#ffd29a', '#fff3d6'], sea: ['#fff6ea', '#ffe6c4'], sun: '#fff8d0' };
const SKYK_NIGHT = { g: ['#2a1f5a', '#7a4a8a', '#ffb88a'], sea: ['#e8d8f0', '#c8b0d8'], sun: '#ffe0b0' };

const LEVELS = [
  { id: '1-1', name: 'GREEN START', world: 1, w: 160, sky: SKY_DAY, build(b) {
    b.ground(0, 23);
    b.sign(2, 'A D or ← → to run');
    b.coinRow(6, 9, 13);
    b.q(4, 13, 'heart');
    b.fill(12, 13, 14, 15);
    b.sign(17, 'SPACE to jump · hold it to go higher');
    b.q(20, 13, 'coin'); b.q(21, 13, 'coin');
    b.enemy('blob', 16);
    b.coin(24, 14); b.coin(25, 13); b.coin(26, 14);
    b.ground(27, 46);
    b.fill(31, 31, 15, 15); b.fill(32, 32, 14, 15); b.fill(33, 33, 13, 15);
    b.plat(35, 39, 11); b.coinRow(35, 39, 10);
    b.enemy('blob', 40); b.enemy('hopper', 44);
    b.plat(48, 50, 13); b.coin(49, 12);
    b.ground(52, 81);
    b.sign(55, 'Jump at a wall, then jump again');

    b.coin(62, 12); b.coin(62, 9); b.coin(62, 6); b.big(62, 4);
    b.sign(68, 'Springs launch you up');
    b.spring(70);
    b.fill(73, 79, 9, 9); b.coinRow(74, 78, 8); b.big(79, 7);
    b.check(80);
    b.fill(85, 86, 14, LH - 1); b.fill(90, 91, 12, LH - 1); b.fill(95, 96, 13, LH - 1);
    b.coin(88, 11); b.coin(93, 10); b.coin(98, 11);
    b.enemy('buzzer', 92, 10, { range: 70 });
    b.ground(100, 124);
    b.q(102, 13, 'fire'); b.sign(101, 'Red spikes hurt — burn them');
    b.enemy('spiky', 108);
    b.plat(104, 107, 13); b.plat(108, 111, 10); b.coinRow(108, 111, 9);
    b.fill(113, 113, 8, 15);
    b.fake(119, 122, 13, 15); b.big(120, 14);          // secret: the mound is hollow
    b.plat(126, 127, 14);
    b.ground(129, 159);
    b.q(132, 13, 'star');
    b.enemy('blob', 135); b.enemy('blob', 137);
    b.fill(140, 140, 15, 15); b.fill(141, 141, 14, 15); b.fill(142, 142, 13, 15); b.fill(143, 145, 12, 15);

    b.goal(152);

  { id: '1-2', name: 'TREETOPS', world: 1, w: 170, sky: SKY_LATE, build(b) {
    b.ground(0, 14);
    b.sign(3, 'Stomp enemies from above!');
    b.q(7, 13, 'coin'); b.q(8, 13, 'coin');
    b.enemy('blob', 11);
    b.mplat(17, 14, 3, 64, 0, 0.02); b.coinRow(16, 21, 11);
    b.ground(23, 40);
    b.enemy('hopper', 30);
    b.plat(27, 30, 13); b.plat(33, 36, 10); b.coinRow(33, 36, 9); b.big(35, 6);
    b.plat(43, 45, 14); b.plat(48, 50, 12); b.plat(53, 55, 13);
    b.coin(44, 13); b.coin(49, 11); b.coin(54, 12);
    b.enemy('buzzer', 49, 9, { range: 90 });
    b.ground(56, 75);
    b.enemy('blob', 60); b.enemy('blob', 63);
    b.q(66, 13, 'heart');
    b.check(72);
    b.mplat(80, 13, 3, 64, 0, 0.022);
    b.plat(86, 88, 11); b.coinRow(86, 88, 10);
    b.mplat(90, 12, 3, 0, 64, 0.025);
    b.ground(96, 118);
    b.q(100, 13, 'fire');
    b.enemy('spiky', 103);
    b.fill(106, 106, 5, 12); b.fill(110, 110, 5, 15);
    b.coin(108, 12); b.coin(108, 9); b.coin(108, 6); b.big(108, 3);
    b.enemy('blob', 114);
    b.mplat(120, 14, 3, 48, 0, 0.03);
    b.mplat(127, 12, 3, 0, 48, 0.03);
    b.mplat(133, 13, 3, 48, 0, 0.03);
    b.plat(138, 139, 12);
    b.coinRow(126, 130, 8);
    b.enemy('buzzer', 130, 7, { range: 80 });
    b.ground(141, 169);
    b.q(144, 13, 'star');
    b.spring(147); b.plat(149, 153, 9); b.big(153, 8);
    b.enemy('hopper', 150); b.enemy('hopper', 154); b.enemy('blob', 157);
    b.goal(162);
  } },
  { id: '1-3', name: 'WINDY HILLS', world: 1, w: 160, sky: SKY_DAY, build(b) {
    b.ground(0, 18);
    b.q(6, 13, 'heart'); b.coinRow(8, 11, 13);
    b.enemy('blob', 12);
    b.fill(19, 26, 13, LH - 1);
    b.enemy('hopper', 23, 13);
    b.plat(29, 30, 12); b.coin(29, 11); b.coin(30, 11);
    b.ground(32, 52);
    b.spring(36); b.plat(38, 42, 9); b.coinRow(38, 41, 8); b.big(42, 7);
    b.enemy('spiky', 45);
    b.q(48, 13, 'fire');
    b.mplat(55, 13, 3, 64, 0, 0.025); b.coinRow(54, 59, 11);
    b.mplat(63, 12, 3, 0, 48, 0.03);
    b.enemy('buzzer', 60, 9, { range: 70 });
    b.ground(67, 95);
    b.check(70);
    b.enemy('blob', 76); b.enemy('blob', 79);
    b.fill(84, 87, 13, 15); b.q(85, 10, 'coin'); b.q(86, 10, 'coin');
    b.fake(90, 93, 13, 15); b.big(91, 14);           // secret: hollow mound
    b.plat(97, 99, 13); b.coin(98, 12);
    b.ground(101, 128);
    b.enemy('hopper', 106); b.enemy('buzzer', 112, 11, { range: 80 });
    b.q(116, 13, 'star');
    b.fill(124, 124, 15, 15); b.fill(125, 125, 14, 15); b.fill(126, 128, 13, 15);

    b.ground(138, 159);

  } },
  { id: '1-4', name: 'SUNSET RIDGE', world: 1, w: 160, sky: SKY_LATE, build(b) {
    b.ground(0, 30);
    b.sign(3, 'Climb the walls!');
    b.q(7, 13, 'heart');
    b.enemy('blob', 14);
    b.fill(22, 22, 6, 12); b.fill(26, 26, 6, 15);
    b.coin(24, 12); b.coin(24, 9); b.coin(24, 6); b.big(24, 4);
    b.mplat(32, 14, 2, 32, 0, 0.03);
    b.ground(35, 62);
    b.enemy('hopper', 40);
    b.q(44, 13, 'fire');
    b.enemy('spiky', 47);
    b.fill(52, 52, 4, 12); b.fill(56, 56, 4, 15);
    b.coin(54, 12); b.coin(54, 9); b.coin(54, 6); b.big(54, 2);
    b.check(60);
    b.plat(65, 67, 14); b.plat(70, 72, 12); b.plat(75, 77, 13);
    b.coin(66, 13); b.coin(71, 11); b.coin(76, 12);
    b.enemy('buzzer', 71, 9, { range: 70 });
    b.ground(80, 110);
    b.enemy('blob', 85); b.enemy('blob', 88);
    b.spring(92); b.plat(94, 99, 9); b.coinRow(94, 99, 8); b.q(97, 6, 'star');
    b.enemy('hopper', 104);
    b.mplat(113, 13, 2, 0, 48, 0.03); b.mplat(117, 11, 2, 0, 48, 0.03); b.mplat(121, 13, 2, 0, 48, 0.03);
    b.coin(114, 10); b.coin(118, 8); b.coin(122, 10); b.big(117, 7);
    b.ground(125, 159);
    b.enemy('spiky', 132); b.enemy('blob', 138);

    b.goal(152);
  } },
  { id: '1-5', name: 'BIG BLOB', world: 1, w: 100, sky: SKY_DUSK, build(b) {
    b.ground(0, 30);
    b.q(8, 13, 'heart'); b.q(16, 13, 'fire');
    b.enemy('blob', 12); b.enemy('hopper', 20); b.enemy('blob', 26);
    b.plat(32, 33, 13); b.big(32, 10);
    b.ground(35, 69);
    b.enemy('spiky', 45); b.enemy('blob', 52);
    b.q(58, 13, 'heart'); b.big(58, 9);
    b.check(64);
    b.sign(66, 'Stomp the Big Blob!');
    b.ground(70, 99); b.fill(99, 99, 0, 15);
    b.plat(74, 77, 13); b.plat(92, 95, 13);
    b.big(75, 10);
    b.arena(70, 99);
    b.boss('blob', 88);
  } },

  { id: '2-1', name: 'CRYSTAL PATH', world: 2, w: 150, sky: CAVE, build(b) {
    b.ceil(0, 149, 3);
    b.ground(0, 20);
    b.sign(3, 'Cracked stone falls — keep moving');
    b.q(8, 13, 'heart');
    b.enemy('blob', 14);
    b.crumble(22, 24, 14); b.crumble(27, 29, 13); b.crumble(32, 34, 14);
    b.coinRow(22, 24, 12); b.coinRow(27, 29, 11); b.coinRow(32, 34, 12);
    b.ground(36, 60);
    b.q(42, 13, 'fire');
    b.enemy('spitter', 48);
    b.plat(52, 55, 13); b.coinRow(52, 55, 12); b.big(54, 10);
    b.check(58);
    b.crumble(62, 64, 14); b.fill(66, 67, 13, LH - 1); b.crumble(70, 72, 13);
    b.enemy('spitter', 67, 13);
    b.ground(76, 112);
    b.enemy('hopper', 82); b.enemy('blob', 88);
    b.fill(94, 94, 7, 12); b.fill(98, 98, 7, 15);
    b.coin(96, 12); b.coin(96, 9); b.big(96, 5);
    b.enemy('spitter', 108);
    b.crumble(114, 119, 14); b.big(117, 11);
    b.ground(121, 149);
    b.q(125, 13, 'coin'); b.q(126, 13, 'star');
    b.enemy('blob', 130); b.enemy('hopper', 134); b.enemy('spitter', 140);
    b.goal(144);
  } },
  { id: '2-2', name: 'DARK DEPTHS', world: 2, w: 140, sky: CAVE_DEEP, dark: true, build(b) {
    b.ceil(0, 139, 3);
    b.ground(0, 18);
    b.sign(3, 'Follow the coins');
    b.q(9, 13, 'heart');
    for (let x = 5; x <= 17; x += 3) b.coin(x, 14);
    b.enemy('blob', 13);

// ---------- level runtime ----------
let L, LW = 160, W = WORLDS[1];

function loadLevel(i) {
  const def = LEVELS[i];
  LW = def.w; W = WORLDS[def.world];
  const lv = {
    i, def, grid: Array.from({ length: LH }, () => new Uint8Array(LW)),
    coins: [], big: [], springs: [], checkpoints: [], signs: [], enemies: [], items: [],
    q: {}, bumps: {}, plats: [], goal: null, start: { x: 3 * T, y: G * T },
    arena: null, boss: null, bossX: 0, bossKind: null,
    waves: [], fires: [], shots: [], drops: [], bolts: [], texts: [], fly: [],
    crumb: {}, blink: { phase: 0, t: 0, hold: new Set() }, reveal: 0, winds: [], cannons: []
  };
  const fill = (x0, x1, y0, y1, v = SOLID) => {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) lv.grid[y][x] = v;
  };
  const b = {
    fill,
    ground: (x0, x1) => fill(x0, x1, G, LH - 1),
    ceil: (x0, x1, h) => fill(x0, x1, 0, h - 1),
    plat: (x0, x1, y) => fill(x0, x1, y, y, ONEWAY),
    fake: (x0, x1, y0, y1) => fill(x0, x1, y0, y1, FAKE),
    crumble: (x0, x1, y) => fill(x0, x1, y, y, CRUMBLE),
    spikes: (x0, x1, y = G - 1) => fill(x0, x1, y, y, SPIKE),
    lava: (x0, x1) => fill(x0, x1, G + 1, LH - 1, LAVA),
    blink: (x0, x1, y, k) => fill(x0, x1, y, y, k === 'a' ? BLINK_A : BLINK_B),
    ice: (x0, x1, y) => fill(x0, x1, y, y, ICE),
    icicle: (x, y) => lv.drops.push({ x: x * T + T / 2, y: y * T, vy: 0, warn: -1, ice: true }),
    wind: (x0, x1, y0, y1, dx, dy) => lv.winds.push({ x: x0 * T, y: y0 * T, w: (x1 - x0 + 1) * T, h: (y1 - y0 + 1) * T, dx, dy }),
    cannon: (x, y) => { lv.grid[y][x] = CANNON; lv.cannons.push({ tx: x, ty: y, t: 60 }); },
    coin: (x, y) => lv.coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false, ph: hash(x, y) * 6 }),
    coinRow(x0, x1, y) { for (let x = x0; x <= x1; x++) this.coin(x, y); },
    big: (x, y) => lv.big.push({ x: x * T + T / 2, y: y * T + T / 2, got: false }),
    spring: x => lv.springs.push({ x: x * T + 4, y: G * T - 14, w: T - 8, h: 14, squash: 0 }),
    sign: (x, text) => lv.signs.push({ x: x * T + T / 2, y: G * T, text }),
    check: (x, y = G) => lv.checkpoints.push({ x: x * T + T / 2, y: y * T, on: false }),
    q: (x, y, kind) => { lv.grid[y][x] = QBLOCK; lv.q[x + ',' + y] = kind; },
    enemy: (type, x, y = G, opt = {}) => lv.enemies.push(makeEnemy(type, x, y, opt)),
    mplat: (x, y, w, ax, ay, sp) => lv.plats.push({ x: x * T, y: y * T, w: w * T, h: 12, x0: x * T, y0: y * T, ax, ay, sp, dx: 0, dy: 0 }),
    goal: x => { lv.goal = { x: x * T + T / 2, y: G * T, top: 7 * T }; },
    arena: (x0, x1) => { lv.arena = { x0, x1, on: false }; },
    boss: (kind, x) => { lv.bossKind = kind; lv.bossX = x; lv.boss = makeBoss(kind, x); }
  };
  def.build(b);
  return lv;
}

function tileAt(tx, ty) {
  if (tx < 0 || tx >= LW) return SOLID;      // level sides are walls
  if (ty < 0 || ty >= LH) return EMPTY;
  return L.grid[ty][tx];
}
function solidAt(tx, ty) {
  const t = tileAt(tx, ty);
  if (t === SOLID || t === QBLOCK || t === USED || t === CRUMBLE || t === ICE || t === CANNON) return true;
  if (t === BLINK_A || t === BLINK_B) return (t === BLINK_A) === (L.blink.phase === 0) && !L.blink.hold.has(tx + ',' + ty);
  return false;
}
function solidBox(x, y, w, h) {
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.01) / T);
  const y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) return true;
  return false;
}
function tilesIn(o, fn) {
  for (let ty = Math.floor(o.y / T); ty <= Math.floor((o.y + o.h - 0.01) / T); ty++)
    for (let tx = Math.floor(o.x / T); tx <= Math.floor((o.x + o.w - 0.01) / T); tx++) fn(tx, ty, tileAt(tx, ty));
}
function groundBelow(x) {
  const tx = Math.floor(x / T);
  for (let ty = 4; ty < LH; ty++) if (solidAt(tx, ty) || tileAt(tx, ty) === ONEWAY) return ty * T;
  return LH * T;
}

// ---------- enemies ----------
const ESIZE = { blob: [24, 20], hopper: [22, 22], buzzer: [26, 18], spiky: [26, 20], mini: [18, 14], spitter: [24, 26], chaser: [26, 26], slider: [26, 22], bullet: [26, 18] };
function makeEnemy(type, tx, ty, opt) {
  const [w, h] = ESIZE[type];
  const x = tx * T + T / 2 - w / 2, y = ty * T - h;
  return {
    type, x, y, w, h, vx: 0, vy: 0, dir: opt.dir || -1, t: Math.floor(hash(tx, ty) * 200),
    wait: Math.floor(hash(ty, tx) * 60), dying: 0, flip: false, grounded: false, mouth: 0, shy: false,
    x0: x, y0: y, range: opt.range || 80, stompable: type !== 'spiky'
  };
}

// gravity + tile collision for anything that is not the player
function moveBody(o, grav = 0.5) {
  o.vy = Math.min(o.vy + grav, 10);
  o.hitWall = false;
  o.x += o.vx;
  if (solidBox(o.x, o.y, o.w, o.h)) {
    if (o.vx > 0) o.x = Math.floor((o.x + o.w - 0.01) / T) * T - o.w;
    else if (o.vx < 0) o.x = (Math.floor(o.x / T) + 1) * T;
    o.hitWall = true; o.vx = 0;
  }
  const prevB = o.y + o.h;
  o.y += o.vy; o.grounded = false;
  if (o.vy >= 0) {
    const ty = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = Math.floor(o.x / T); tx <= Math.floor((o.x + o.w - 0.01) / T); tx++) {
      if (solidAt(tx, ty) || (tileAt(tx, ty) === ONEWAY && prevB <= ty * T + 0.5)) { o.y = ty * T - o.h; o.vy = 0; o.grounded = true; break; }
    }
  } else if (solidBox(o.x, o.y, o.w, o.h)) { o.y = (Math.floor(o.y / T) + 1) * T; o.vy = 0; }
}
function groundAhead(e) {
  const tx = Math.floor((e.dir > 0 ? e.x + e.w + 1 : e.x - 1) / T), ty = Math.floor((e.y + e.h + 2) / T);
  const t = tileAt(tx, ty), front = tileAt(tx, Math.floor((e.y + e.h - 4) / T));
  return (solidAt(tx, ty) || t === ONEWAY) && front !== SPIKE;
}

function updateEnemy(e) {
  if (e.dying) {
    e.dying++;
    if (e.flip) { e.vy += 0.5; e.y += e.vy; e.x += e.vx; }
    if (e.dying > (e.flip ? 90 : 30)) e.dead = true;
    return;
  }
  if (e.type === 'bullet') {
    // flies straight until it hits something; never sleeps
    e.t++; e.age = (e.age || 0) + 1; e.x += e.dir * 3.2;
    if (e.age > 420 || solidBox(e.x, e.y, e.w, e.h)) { e.dead = true; sparkle(e.x + e.w / 2, e.y + e.h / 2, '90,90,110'); }
    return;
  }
  if (Math.abs(e.x - (cam.x + VW / 2)) > VW) return;   // sleep until close to the screen
  e.t++;
  if (e.type === 'buzzer') {
    e.x = e.x0 + Math.sin(e.t * 0.02) * e.range;
    e.y = e.y0 + Math.sin(e.t * 0.07) * 14;
    e.dir = Math.cos(e.t * 0.02) > 0 ? 1 : -1;
  } else if (e.type === 'hopper') {
    if (e.grounded) {
      e.vx = 0;
      if (++e.wait > 70) {
        e.wait = 0; e.dir = Math.sign(p.x - e.x) || -1;
        e.vy = -9; e.vx = e.dir * 2;
      }
    }
    moveBody(e);
  } else if (e.type === 'spitter') {
    moveBody(e);
    e.dir = Math.sign(p.x - e.x) || -1;
    if (e.mouth > 0) e.mouth--;
    if (++e.wait > 110 && !p.dead && Math.abs(p.x - e.x) < 440 && Math.abs(p.y - e.y) < 140) {
      e.wait = 0; e.mouth = 14; sfx('spit');
      L.shots.push({ x: e.x + e.w / 2 + e.dir * 12, y: e.y + 11, vx: e.dir * 3.4, vy: 0, grav: 0, r: 6, life: 220, kind: 'goo' });
    }
  } else if (e.type === 'slider') {
    // waddles slowly, then belly-slides fast when you are close and level with it
    if (e.wait > 0) e.wait--;
    if (e.dash > 0) e.dash--;
    else if (e.wait === 0 && e.grounded && Math.abs(p.x - e.x) < 260 && Math.abs(p.y - e.y) < 40) { e.dash = 70; e.wait = 120; e.dir = Math.sign(p.x - e.x) || -1; }
    e.vx = e.dir * (e.dash > 0 ? 4 : 0.6);
    moveBody(e);
    if (e.hitWall || (e.grounded && !groundAhead(e) && !e.dash)) e.dir *= -1;
  } else if (e.type === 'chaser') {
    // creeps toward you only while you face away from it
    const dx = p.x + p.w / 2 - (e.x + e.w / 2), dy = p.y + p.h / 2 - (e.y + e.h / 2);
    e.shy = !p.dead && dx !== 0 && Math.sign(dx) !== p.face;
    if (!e.shy && !p.dead) {
      const d = Math.hypot(dx, dy) || 1;
      e.vx += (dx / d * 1.25 - e.vx) * 0.05; e.vy += (dy / d * 1.25 - e.vy) * 0.05;
    } else { e.vx *= 0.88; e.vy *= 0.88; }
    e.x += e.vx; e.y += e.vy;
    e.dir = Math.sign(dx) || 1;
  } else {
    e.vx = e.dir * (e.type === 'spiky' ? 0.8 : e.type === 'mini' ? 1.7 : 1.0);
    moveBody(e);
    if (e.hitWall || (e.grounded && !groundAhead(e))) e.dir *= -1;
  }
  let inLava = false;
  tilesIn(e, (tx, ty, t) => { if (t === LAVA) inLava = true; });
  if (e.y > LH * T + 60 || inLava) e.dead = true;
}

function killEnemy(e, flip) {
  e.dying = 1; e.flip = flip;
  if (flip) { e.vy = -6; e.vx = (Math.random() - .5) * 3; }
  sparkle(e.x + e.w / 2, e.y + e.h / 2, '255,255,255');
}

// ---------- bosses ----------
const BOSSES = {
  blob: { name: 'BIG BLOB', w: 76, h: 60 },
  golem: { name: 'CRYSTAL GOLEM', w: 72, h: 84 },
  king: { name: 'STORM KING', w: 60, h: 72 },
  yeti: { name: 'FROST YETI', w: 70, h: 80 },
  dragon: { name: 'SKY DRAGON', w: 92, h: 60 }
};
const isFlyer = b => b.kind === 'king' || b.kind === 'dragon';
function makeBoss(kind, tx) {
  const d = BOSSES[kind];
  return {
    kind, name: d.name, x: tx * T, y: kind === 'king' || kind === 'dragon' ? 5 * T : G * T - d.h, w: d.w, h: d.h,
    vx: 0, vy: 0, hp: 6, t: 0, at: 0, inv: 0, jumps: 0, attacks: 0, tired: 0,
    grounded: false, active: false, dead: 0, squash: 0, face: -1, mode: kind === 'king' || kind === 'dragon' ? 'fly' : 'walk', landed: false, tx: 0, ty: 0
  };
}
function bossPhase(b) { return b.hp > 4 ? 1 : b.hp > 2 ? 2 : 3; }
const arenaLeft = () => (L.arena.x0 + 1) * T, arenaRight = () => L.arena.x1 * T;

function updateBoss(b) {
  if (b.dead) {
    b.dead++;
    if (b.dead % 8 === 0 && b.dead < 90) sparkle(b.x + Math.random() * b.w, b.y + Math.random() * b.h, '120,220,120');
    if (b.dead === 120) finishLevel();
    return;
  }
  if (!b.active) return;
  if (b.inv > 0) b.inv--;
  if (b.squash > 0) b.squash -= 0.06;
  const ph = bossPhase(b);
  if (b.kind === 'blob') updateBlobBoss(b, ph);
  else if (b.kind === 'golem') updateGolem(b, ph);
  else if (b.kind === 'yeti') updateYeti(b, ph);
  else if (b.kind === 'dragon') updateDragon(b, ph);
  else updateKing(b, ph);
}

function updateBlobBoss(b, ph) {
  const wasAir = !b.grounded;
  moveBody(b, 0.55);
  if (b.grounded) {
    if (wasAir) {
      // landing sends shockwaves along the floor: jump over them
      const sp = 2.6 + ph * 0.7;
      L.waves.push({ x: b.x - 10, y: b.y + b.h, dir: -1, sp, life: 260 });
      L.waves.push({ x: b.x + b.w + 10, y: b.y + b.h, dir: 1, sp, life: 260 });
      shake = Math.max(shake, 8); b.squash = 1; sfx('boom');
    }
    b.vx = 0;
    if (++b.t > [0, 75, 52, 36][ph]) {
      b.t = 0;
      const dir = Math.sign(p.x + p.w / 2 - (b.x + b.w / 2)) || 1;
      b.face = dir;
      if (ph === 3 && b.jumps++ % 2 === 1) { b.vy = -14; b.vx = dir * 1.6; }
      else { b.vy = -(7.5 + ph); b.vx = dir * (1.4 + ph * 0.8); }
    }
  }
}

function updateGolem(b, ph) {
  moveBody(b, 0.6);
  const toP = Math.sign(p.x + p.w / 2 - (b.x + b.w / 2)) || b.face;
  if (b.mode === 'walk') {
    b.face = toP; b.vx = b.face * [0, 0.7, 1.0, 1.4][ph];
    if (++b.t > [0, 100, 80, 60][ph]) {
      b.t = 0; b.at = 0; b.attacks++;
      b.mode = ph >= 2 && b.attacks % 2 === 0 ? 'stomp' : 'throw';
    }
  } else if (b.mode === 'throw') {
    b.vx = 0; b.face = toP;
    if (++b.at === 22) {
      // crystal shards arc onto where you stand
      const n = ph === 3 ? 3 : ph === 2 ? 2 : 1, sx = b.x + b.w / 2, sy = b.y + 10;
      for (let i = 0; i < n; i++) {
        const tx = p.x + p.w / 2 + (i - (n - 1) / 2) * 70;
        L.shots.push({ x: sx, y: sy, vx: clamp((tx - sx) / 56, -6, 6), vy: -8.5, grav: 0.3, r: 7, life: 200, kind: 'shard' });
      }
      sfx('spit');
    }
    if (b.at > 44) b.mode = 'walk';
  } else if (b.mode === 'stomp') {
    b.vx = 0; b.at++;
    if (b.at === 12 && b.grounded) { b.vy = -7; b.landed = false; }
    if (b.at > 14 && b.grounded && !b.landed) {
      // the slam shakes stalactites loose from the ceiling
      b.landed = true; b.squash = 1; shake = Math.max(shake, 9); sfx('boom');
      const n = 2 + ph;
      L.drops.push({ x: p.x + p.w / 2, y: 3 * T, vy: 0, warn: 50 });
      for (let i = 1; i < n; i++) L.drops.push({ x: arenaLeft() + 40 + Math.random() * (arenaRight() - arenaLeft() - 80), y: 3 * T, vy: 0, warn: 40 + i * 12 });
    }
    if (b.at > 70) b.mode = 'walk';
  }
}

function updateKing(b, ph) {
  const cx = (arenaLeft() + arenaRight()) / 2;
  if (b.mode === 'fly') {
    b.t++;
    const tx = cx + Math.sin(b.t * 0.012) * ((arenaRight() - arenaLeft()) / 2 - 90) - b.w / 2;
    const ty = 5 * T + Math.sin(b.t * 0.05) * 12;
    b.x += (tx - b.x) * 0.05; b.y += (ty - b.y) * 0.08;
    b.face = Math.sign(p.x - b.x) || 1;
    if (++b.at > [0, 105, 85, 70][ph]) {
      b.at = 0; b.attacks++;
      L.bolts.push({ x: p.x + p.w / 2, warn: 55, strike: 16 });
      if (ph === 3) L.bolts.push({ x: arenaLeft() + 40 + Math.random() * (arenaRight() - arenaLeft() - 80), warn: 70, strike: 16 });
      if (ph >= 2 && b.attacks % 3 === 1 && L.enemies.filter(e => !e.dying).length < 3) {
        const m = makeEnemy('blob', 0, 0, { dir: b.face });
        m.x = b.x + b.w / 2 - 12; m.y = b.y + b.h; m.summoned = true;
        L.enemies.push(m);
      }
      // after a few attacks he runs out of breath and lands
      if (b.attacks % 3 === 0) { b.mode = 'down'; b.vy = 0; }
    }
  } else if (b.mode === 'down') {
    b.vx = 0; moveBody(b, 0.5);
    if (b.grounded) { b.mode = 'tired'; b.tired = 160; shake = Math.max(shake, 6); sfx('boom'); b.squash = 1; }
  } else if (b.mode === 'tired') {
    if (--b.tired <= 0) b.mode = 'rise';
  } else if (b.mode === 'rise') {
    b.y -= 3;
    if (b.y < 5 * T) { b.mode = 'fly'; b.at = 0; }
  }
}

function throwAt(b, n, kind) {
  const sx = b.x + b.w / 2, sy = b.y + 10;
  for (let i = 0; i < n; i++) {
    const tx = p.x + p.w / 2 + (i - (n - 1) / 2) * 70;
    L.shots.push({ x: sx, y: sy, vx: clamp((tx - sx) / 56, -6, 6), vy: -8.5, grav: 0.3, r: 7, life: 200, kind });
  }
  sfx('spit');
}
function dropIcicles(n) {
  L.drops.push({ x: p.x + p.w / 2, y: 3 * T, vy: 0, warn: 50, ice: true });
  for (let i = 1; i < n; i++) L.drops.push({ x: arenaLeft() + 40 + Math.random() * (arenaRight() - arenaLeft() - 80), y: 3 * T, vy: 0, warn: 40 + i * 12, ice: true });
}

function updateYeti(b, ph) {
  moveBody(b, 0.6);
  const toP = Math.sign(p.x + p.w / 2 - (b.x + b.w / 2)) || b.face;
  if (b.mode === 'walk') {
    b.face = toP; b.vx = b.face * [0, 0.8, 1.1, 1.4][ph];
    if (++b.t > [0, 90, 75, 60][ph]) {
      b.t = 0; b.at = 0; b.attacks++; b.face = toP;
      b.mode = ph === 1 ? 'throw' : b.attacks % 2 === 0 ? 'charge' : ph === 3 && b.attacks % 3 === 0 ? 'stomp' : 'throw';
    }
  } else if (b.mode === 'throw') {
    b.vx = 0; b.face = toP;
    if (++b.at === 22) throwAt(b, ph, 'snow');
    if (b.at > 44) b.mode = 'walk';
  } else if (b.mode === 'charge') {
    // short wind-up, then a fast run until he slams into a wall
    if (++b.at < 32) b.vx = 0;
    else {
      b.vx = b.face * 6.5;
      if (b.hitWall) { b.mode = 'dizzy'; b.at = 0; shake = Math.max(shake, 10); sfx('boom'); dropIcicles(1 + ph); }
    }
  } else if (b.mode === 'dizzy') {
    b.vx = 0;
    if (++b.at > 70) b.mode = 'walk';
  } else if (b.mode === 'stomp') {
    b.vx = 0; b.at++;
    if (b.at === 12 && b.grounded) { b.vy = -8; b.landed = false; }
    if (b.at > 14 && b.grounded && !b.landed) { b.landed = true; b.squash = 1; shake = Math.max(shake, 9); sfx('boom'); dropIcicles(4); }
    if (b.at > 70) b.mode = 'walk';
  }
}

function updateDragon(b, ph) {
  const cx = (arenaLeft() + arenaRight()) / 2;
  if (b.mode === 'fly') {
    b.t++;
    const tx = cx + Math.sin(b.t * 0.014) * ((arenaRight() - arenaLeft()) / 2 - 100) - b.w / 2;
    const ty = 4.5 * T + Math.sin(b.t * 0.06) * 16;
    b.x += (tx - b.x) * 0.05; b.y += (ty - b.y) * 0.08;
    b.face = Math.sign(p.x - b.x) || 1;
    if (++b.at > [0, 100, 85, 70][ph]) {
      b.at = 0; b.attacks++;
      // a fan of fireballs aimed at you
      const n = [0, 3, 5, 5][ph], sx = b.x + b.w / 2 + b.face * 30, sy = b.y + 30;
      const a0 = Math.atan2(p.y + p.h / 2 - sy, p.x + p.w / 2 - sx);
      for (let i = 0; i < n; i++) {
        const a = a0 + (i - (n - 1) / 2) * 0.22;
        L.shots.push({ x: sx, y: sy, vx: Math.cos(a) * 3.6, vy: Math.sin(a) * 3.6, grav: 0, r: 7, life: 260, kind: 'flame' });
      }
      sfx('fire');
      if (ph === 3 && b.attacks % 2 === 1) {
        for (const side of [-1, 1]) {
          const m = makeEnemy('bullet', 0, 0, { dir: -side });
          m.x = side < 0 ? arenaLeft() + 4 : arenaRight() - 30; m.y = G * T - 40; m.summoned = true;
          L.enemies.push(m);
        }
      }
      if (b.attacks % 3 === 0) { b.mode = 'swoop'; b.tx = p.x + p.w / 2 - b.w / 2; }
    }
  } else if (b.mode === 'swoop') {
    // dives at where you were standing and crash-lands
    const dx = b.tx - b.x;
    b.x += clamp(dx * 0.08, -6, 6); b.y += 6;
    if (b.y + b.h >= G * T) { b.y = G * T - b.h; b.mode = 'tired'; b.tired = 150; shake = Math.max(shake, 8); sfx('boom'); b.squash = 1; }
  } else if (b.mode === 'tired') {
    if (--b.tired <= 0) b.mode = 'rise';
  } else if (b.mode === 'rise') {
    b.y -= 3;
    if (b.y < 4.5 * T) { b.mode = 'fly'; b.at = 0; }
  }
}

function hitBoss(b) {
  b.hp--; b.inv = 50; b.squash = 1;
  shake = Math.max(shake, 6); sfx('stomp');
  sparkle(b.x + b.w / 2, b.y, '255,255,255');
  if (b.hp <= 0) {
    b.dead = 1; L.waves = []; L.shots = []; L.drops = []; L.bolts = [];
    for (const e of L.enemies) if (!e.dying) killEnemy(e, true);
    sfx('win');
    return;
  }
  if (isFlyer(b)) b.mode = 'rise';
  if (b.kind === 'blob' && (b.hp === 4 || b.hp === 3)) {     // phase 2: splits off small blobs
    for (const d of [-1, 1]) {
      const m = makeEnemy('mini', 0, 0, { dir: d });
      m.x = b.x + b.w / 2 - 9; m.y = b.y + 10; m.vy = -6; m.summoned = true;
      L.enemies.push(m);
    }
  }
}

// ---------- state ----------
let state = 'title', tick = 0, time = 0, got = 0, deaths = 0, levelIndex = 0;
let p, respawn, parts = [], shake = 0, look = 0, finishT = 0, flash = 0;
let carry = { hp: 1, fire: false };     // power-ups carry over to the next level
const cam = { x: 0, y: LH * T - VH };

function resetPlayer(pos) {
  p = {
    x: pos.x - 10, y: pos.y - 26, w: 20, h: 26, vx: 0, vy: 0,
    grounded: false, coyote: 0, buffer: 0, wallDir: 0, wallT: 0, lockT: 0, lockDir: 0,
    noCut: 0, face: 1, sx: 1, sy: 1, sliding: false, dead: 0, run: 0, onPlat: null,
    hp: carry.hp, fire: carry.fire, star: 0, inv: 0, shootCd: 0,
    scarf: Array.from({ length: 6 }, () => ({ x: pos.x, y: pos.y - 16 }))
  };
}

// ---------- audio ----------
let AC = null, VOL = 0.6, muted = false;
const SFX = {
  jump: ['square', 320, 640, .12, .08], wall: ['square', 260, 600, .12, .08],
  land: ['triangle', 160, 60, .08, .12], coin: ['square', 990, 1480, .1, .06],
  spring: ['triangle', 180, 900, .28, .16], check: ['triangle', 520, 1040, .3, .12],
  fall: ['sawtooth', 420, 70, .5, .08], win: ['square', 523, 1568, .6, .08],
  stomp: ['square', 600, 150, .12, .1], hurt: ['sawtooth', 300, 90, .3, .1],
  bump: ['triangle', 140, 90, .08, .14], power: ['square', 400, 1600, .4, .07],
  fire: ['square', 900, 300, .1, .05], boom: ['sawtooth', 120, 40, .4, .14],
  spit: ['square', 500, 200, .1, .05], thunder: ['sawtooth', 90, 30, .6, .18],
  crumble: ['triangle', 130, 50, .2, .1]
};
function sfx(name) {
  if (muted || VOL <= 0) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const [type, f0, f1, dur, vol] = SFX[name], t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.connect(g); g.connect(AC.destination);
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol * VOL, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}

// ---------- particles and floating text ----------
function dust(x, y, n, dir = 0) {
  for (let i = 0; i < n; i++) parts.push({
    x: x + (Math.random() - .5) * 14, y, vx: (Math.random() - .5) * 2.4 + dir, vy: -Math.random() * 1.6,
    life: 20 + Math.random() * 14, max: 34, r: 2 + Math.random() * 3, col: '255,255,255', g: 0.02
  });
}
function sparkle(x, y, col = '255,214,63') {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * 6.283, s = 1 + Math.random() * 3;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22, max: 22, r: 2.2, col, g: 0.05 });
  }
}
function rubble(x, y, col) {
  for (let i = 0; i < 8; i++) parts.push({ x: x + Math.random() * T, y: y + Math.random() * 10, vx: (Math.random() - .5) * 3,
    vy: -Math.random() * 3, life: 30, max: 30, r: 2 + Math.random() * 2.5, col, g: 0.3 });
}
function say(x, y, txt, col = '#fff') { L.texts.push({ x, y, txt, col, life: 70 }); }

// ---------- player physics ----------
function touchingWall(dir) {
  return dir > 0 ? solidBox(p.x + p.w, p.y + 3, 2, p.h - 8) : solidBox(p.x - 2, p.y + 3, 2, p.h - 8);
}

function moveX() {
  p.x += p.vx;
  if (solidBox(p.x, p.y, p.w, p.h)) {
    if (p.vx > 0) p.x = Math.floor((p.x + p.w - 0.01) / T) * T - p.w;
    else if (p.vx < 0) p.x = (Math.floor(p.x / T) + 1) * T;
    p.vx = 0;
  }
}

function landed(wasAir) {
  if (wasAir && p.vy > 3) {
    const k = Math.min(p.vy, 12) * 0.03;
    p.sx = 1 + k; p.sy = 1 - k;
    dust(p.x + p.w / 2, p.y + p.h, 3 + (p.vy / 2 | 0));
    if (p.vy > 10) shake = Math.max(shake, 3);
    sfx('land');
  }
  p.vy = 0; p.grounded = true;
}

function moveY() {
  const wasAir = !p.grounded, prevBottom = p.y + p.h;
  p.y += p.vy; p.grounded = false; p.onPlat = null;
  if (p.vy >= 0) {
    for (const m of L.plats) {
      // platforms already moved this frame; a rising one may have passed the feet by up to -dy
      if (p.x + p.w > m.x && p.x < m.x + m.w && prevBottom <= m.y + Math.max(0, -m.dy) + 0.5 && p.y + p.h >= m.y) {
        p.y = m.y - p.h; p.onPlat = m; landed(wasAir); return;
      }
    }
    const ty = Math.floor((p.y + p.h - 0.01) / T);
    const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w - 0.01) / T);
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty) || (tileAt(tx, ty) === ONEWAY && prevBottom <= ty * T + 0.5)) {
        p.y = ty * T - p.h; landed(wasAir); return;
      }
    }
  } else if (solidBox(p.x, p.y, p.w, p.h)) {
    const ty = Math.floor(p.y / T), cx = Math.floor((p.x + p.w / 2) / T);
    // a ? block right above the head gets hit instead of sliding around it
    const qx = tileAt(cx, ty) === QBLOCK ? cx : [Math.floor(p.x / T), Math.floor((p.x + p.w - 0.01) / T)].find(x => tileAt(x, ty) === QBLOCK);
    if (qx === undefined) {
      // clipped a corner with the head: slide around it instead of stopping dead
      for (let d = 1; d <= 8; d++) {
        if (!solidBox(p.x + d, p.y, p.w, p.h)) { p.x += d; return; }
        if (!solidBox(p.x - d, p.y, p.w, p.h)) { p.x -= d; return; }
      }
    }
    for (let tx = Math.floor(p.x / T); tx <= Math.floor((p.x + p.w - 0.01) / T); tx++) {
      if (solidAt(tx, ty)) { L.bumps[tx + ',' + ty] = 8; sfx('bump'); break; }
    }
    if (qx !== undefined) hitBlock(qx, ty);
    p.y = (ty + 1) * T; p.vy = 0;
  }
}

function hitBlock(tx, ty) {
  const key = tx + ',' + ty, kind = L.q[key];
  L.grid[ty][tx] = USED; L.bumps[key] = 10;
  // enemies standing on a bumped block get knocked off
  for (const e of L.enemies) {
    if (!e.dying && e.y + e.h <= ty * T + 2 && e.y + e.h >= ty * T - 4 && e.x + e.w > tx * T && e.x < tx * T + T) killEnemy(e, true);
  }
  if (kind === 'coin') {
    got++; sfx('coin');
    L.fly.push({ x: tx * T + T / 2, y: ty * T - 8, vy: -7, life: 26 });
  } else {
    L.items.push({ kind, x: tx * T + 6, y: ty * T, w: 20, h: 20, rise: 20, vx: 0, vy: 0 });
    sfx('power');
  }
}

function hurt() {
  if (p.inv > 0 || p.star > 0 || p.dead) return false;
  if (p.fire) p.fire = false;
  else if (--p.hp <= 0) { die(); return true; }
  p.inv = 100; p.vy = -6; p.vx = -p.face * 4;
  shake = Math.max(shake, 5); sfx('hurt');
  return true;
}

function die() {
  if (p.dead) return;
  p.dead = 1; deaths++; shake = 6; sfx('fall');
  carry = { hp: 1, fire: false };
}

function respawnPlayer() {
  resetPlayer(respawn);
  p.inv = 90;
  // ghosts go back home, otherwise one waiting at the checkpoint kills you over and over
  for (const e of L.enemies) if (e.type === 'chaser' && !e.dying) { e.x = e.x0; e.y = e.y0; e.vx = 0; e.vy = 0; }
  L.enemies = L.enemies.filter(e => e.type !== 'bullet');
  // dying in the boss room resets the fight
  if (L.arena && L.arena.on && L.boss && !L.boss.dead) {
    L.arena.on = false;
    for (let y = G - 8; y < G; y++) L.grid[y][L.arena.x0] = EMPTY;
    L.boss = makeBoss(L.bossKind, L.bossX);
    L.waves = []; L.shots = []; L.drops = []; L.bolts = [];
    L.enemies = L.enemies.filter(e => !e.summoned);
  }
}

function updatePlayer() {
  if (p.dead) {
    if (++p.dead > 45) respawnPlayer();
    return;
  }
  // ride moving platforms
  if (p.onPlat) { p.x += p.onPlat.dx; p.y += p.onPlat.dy; if (solidBox(p.x, p.y, p.w, p.h)) p.x -= p.onPlat.dx; }

  let ix = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  // right after a wall-jump, ignore steering back into that wall
  if (p.lockT > 0) { p.lockT--; if (ix === p.lockDir) ix = 0; }

  // ice under the feet: slow to start, slow to stop
  let onIce = false;
  if (p.grounded) for (let tx = Math.floor(p.x / T); tx <= Math.floor((p.x + p.w - 0.01) / T); tx++) if (tileAt(tx, Math.floor((p.y + p.h + 1) / T)) === ICE) onIce = true;
  const accel = onIce ? 0.16 : p.grounded ? 0.5 : 0.34, turn = onIce ? 0.35 : p.grounded ? 1.0 : 0.45, decel = onIce ? 0.07 : p.grounded ? 0.6 : 0.08;
  if (ix !== 0) {
    if (p.vx * ix < 0) p.vx += ix * turn;
    else if (Math.abs(p.vx) < RUN) p.vx = Math.min(RUN, Math.abs(p.vx) + accel) * ix;
    else p.vx -= Math.sign(p.vx) * 0.05;   // keep extra speed from a wall-jump, ease it off slowly
    p.face = ix;
  } else {
    p.vx -= Math.sign(p.vx) * Math.min(Math.abs(p.vx), decel);
  }

  if (input.jumpPressed) { p.buffer = BUFFER; input.jumpPressed = false; }
  if (p.grounded) p.coyote = COYOTE; else if (p.coyote > 0) p.coyote--;
  const wl = !p.grounded && touchingWall(-1), wr = !p.grounded && touchingWall(1);
  if (wl || wr) { p.wallDir = wr ? 1 : -1; p.wallT = COYOTE; } else if (p.wallT > 0) p.wallT--;

  if (p.buffer > 0) {
    if (p.coyote > 0) {
      p.vy = JUMP; p.coyote = 0; p.buffer = 0; p.grounded = false; p.onPlat = null;
      p.sx = 0.75; p.sy = 1.3;
      dust(p.x + p.w / 2, p.y + p.h, 5); sfx('jump');
    } else if (p.wallT > 0) {
      p.vy = WALLJUMP_Y; p.vx = -p.wallDir * WALLJUMP_X;
      p.lockT = 8; p.lockDir = p.wallDir; p.wallT = 0; p.buffer = 0; p.face = -p.wallDir;
      p.sx = 0.8; p.sy = 1.25;
      dust(p.wallDir > 0 ? p.x + p.w : p.x, p.y + p.h / 2, 5, -p.wallDir); sfx('wall');
    } else p.buffer--;
  }

  // lighter gravity while rising with jump held, heavier when released: variable jump height
  let g = p.vy < 0 ? (input.jump || p.noCut > 0 ? G_UP : G_CUT) : G_DOWN;
  if (Math.abs(p.vy) < 1.6 && input.jump) g *= 0.55;   // short float at the top of the jump
  if (p.noCut > 0) p.noCut--;
  p.vy += g;

  p.sliding = false;
  if (!p.grounded && p.vy > 0 && ix !== 0 && touchingWall(ix)) {
    p.vy = Math.min(p.vy, SLIDE); p.sliding = true; p.face = ix;
    if (tick % 5 === 0) dust(ix > 0 ? p.x + p.w : p.x, p.y + p.h - 4, 1);
  }
  for (const wz of L.winds) {
    if (!overlap(p, wz)) continue;
    p.vx = clamp(p.vx + wz.dx * 0.32, -7, 7);
    // rising air cancels gravity and lifts steadily, jump held or not
    if (wz.dy) { p.vy = Math.max(p.vy - g + wz.dy * 0.55, -6.5); p.grounded = false; }
  }
  p.vy = Math.min(p.vy, MAXFALL);

  const preVy = p.vy, preBottom = p.y + p.h;
  moveX();
  moveY();

  // standing on cracked stone starts it crumbling
  if (p.grounded && !p.onPlat) {
    const ty = Math.floor((p.y + p.h + 1) / T);
    for (let tx = Math.floor(p.x / T); tx <= Math.floor((p.x + p.w - 0.01) / T); tx++) {
      const k = tx + ',' + ty;
      if (tileAt(tx, ty) === CRUMBLE && !L.crumb[k]) { L.crumb[k] = { tx, ty, t: 1, gone: 0 }; sfx('crumble'); }
    }
  }

  // fire
  if (p.shootCd > 0) p.shootCd--;
  if (input.firePressed) {
    input.firePressed = false;
    if (p.fire && p.shootCd === 0 && L.fires.length < 2) {
      L.fires.push({ x: p.x + p.w / 2 + p.face * 10, y: p.y + 12, vx: p.face * 6.5, vy: 1, r: 6, life: 150 });
      p.shootCd = 12; sfx('fire');
    }
  }
  if (p.inv > 0) p.inv--;
  if (p.star > 0) p.star--;

  for (const s of L.springs) {
    if (p.vy >= 0 && p.x + p.w > s.x && p.x < s.x + s.w && p.y + p.h >= s.y && p.y + p.h <= s.y + s.h + p.vy + 1) {
      p.y = s.y - p.h; p.vy = SPRING; p.noCut = 24; p.grounded = false; p.coyote = 0;
      p.sx = 0.7; p.sy = 1.35; s.squash = 1; shake = Math.max(shake, 3); sfx('spring');
    }
  }

  // enemies: land on top to stomp, anything else hurts
  for (const e of L.enemies) {
    if (e.dying || !overlap(p, e)) continue;
    if (p.star > 0) { killEnemy(e, true); sfx('stomp'); continue; }
    const fromAbove = preVy > 0 && preBottom <= e.y + 10;
    if (fromAbove && e.stompable) {
      killEnemy(e, false); sfx('stomp');
      p.vy = input.jump ? STOMP_HELD : STOMP; p.y = e.y - p.h; p.coyote = 0;
      p.sx = 0.8; p.sy = 1.2;
    } else hurt();
  }
  const b = L.boss;
  if (b && b.active && !b.dead && b.inv === 0 && overlap(p, b)) {
    const canHit = !isFlyer(b) || b.mode === 'tired';
    if (canHit && preVy > 0 && preBottom <= b.y + 18) {
      hitBoss(b); p.vy = input.jump ? -12 : -9.5; p.y = b.y - p.h;
    } else if (canHit && p.star > 0) { hitBoss(b); p.vx = -p.face * 5; }
    else if (!(isFlyer(b) && b.mode === 'tired')) hurt();   // a resting flyer is harmless
  }
  for (const w of L.waves) {
    if (Math.abs(p.x + p.w / 2 - w.x) < 14 && p.y + p.h > w.y - 22) hurt();
  }

  // spikes and lava
  let spike = false, lava = false;
  tilesIn(p, (tx, ty, t) => {
    if (t === LAVA && p.y + p.h > ty * T + 6) lava = true;
    if (t === SPIKE && p.y + p.h > ty * T + 14) spike = true;
  });
  if (lava) { die(); sparkle(p.x + p.w / 2, p.y + p.h, '255,140,40'); }
  else if (spike && p.star === 0 && hurt()) p.vy = -8.5;

  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  for (const c of L.coins) {
    if (!c.got && Math.abs(c.x - cx) < 18 && Math.abs(c.y - cy) < 20) {
      c.got = true; got++; sparkle(c.x, c.y); sfx('coin');
    }
  }
  for (const c of L.big) {
    if (!c.got && Math.abs(c.x - cx) < 24 && Math.abs(c.y - cy) < 26) {
      c.got = true; sparkle(c.x, c.y); sparkle(c.x, c.y, '255,255,255'); sfx('power');
      say(c.x, c.y - 20, 'BIG COIN ' + L.big.filter(q => q.got).length + '/3', '#ffd23f');
    }
  }
  for (const it of L.items) {
    if (it.rise > 0 || it.taken || !overlap(p, it)) continue;
    it.taken = true; sfx('power'); sparkle(it.x + 10, it.y + 10, '255,255,255');
    if (it.kind === 'heart') { p.hp = Math.min(MAX_HP, p.hp + 1); say(it.x + 10, it.y - 10, 'HEART!', '#ff6b8a'); }
    else if (it.kind === 'fire') { p.fire = true; say(it.x + 10, it.y - 10, 'FIRE! Press X', '#ff9a3d'); }
    else if (it.kind === 'star') { p.star = STAR_TIME; say(it.x + 10, it.y - 10, 'STAR!', '#ffe14d'); }
  }
  for (const c of L.checkpoints) {
    if (!c.on && Math.abs(c.x - cx) < 22 && cy > c.y - 90 && cy < c.y) {
      c.on = true; respawn = { x: c.x, y: c.y }; sparkle(c.x, c.y - 60, '120,230,120'); sfx('check');
    }
  }
  if (L.goal && !finishT && cx > L.goal.x - 8) {
    finishT = 1; sfx('win');
    sparkle(L.goal.x, L.goal.top, '255,93,93'); sparkle(L.goal.x, L.goal.top + 30);
  }

  // entering the boss room shuts the door behind you
  if (L.arena && !L.arena.on && !L.boss.dead && p.x > (L.arena.x0 + 2) * T) {
    L.arena.on = true; L.boss.active = true;
    for (let y = G - 8; y < G; y++) L.grid[y][L.arena.x0] = SOLID;
    shake = 6; sfx('boom');
  }

  // being inside the hollow secret mound makes it see-through
  let inFake = false;
  tilesIn(p, (tx, ty, t) => { if (t === FAKE) inFake = true; });
  L.reveal += ((inFake ? 1 : 0) - L.reveal) * 0.15;

  if (p.y > LH * T + 60) die();

  p.sx += (1 - p.sx) * 0.2; p.sy += (1 - p.sy) * 0.2;
  p.run += Math.abs(p.vx) * 0.12;

  // scarf: a short rope pulled behind the neck
  let prev = { x: cx - p.face * 6, y: p.y + 9 };
  p.scarf.forEach((s, i) => {
    s.y += 0.45 + Math.sin(tick * 0.25 + i) * 0.25;
    s.x -= p.vx * 0.06;
    const dx = s.x - prev.x, dy = s.y - prev.y, d = Math.hypot(dx, dy) || 1;
    if (d > 4.5) { s.x = prev.x + dx / d * 4.5; s.y = prev.y + dy / d * 4.5; }
    prev = s;
  });
}

function nearPlayer(x, y, rx, ry) { return !p.dead && Math.abs(x - (p.x + p.w / 2)) < rx && Math.abs(y - (p.y + p.h / 2)) < ry; }

function updateWorld() {
  for (const m of L.plats) {
    const nx = m.x0 + Math.sin(tick * m.sp) * m.ax, ny = m.y0 + Math.sin(tick * m.sp) * m.ay;
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }

  // blinking blocks swap; any block that turns on inside the player stays off until they leave it
  const B = L.blink;
  if (++B.t >= BLINK_PERIOD) {
    B.t = 0; B.phase ^= 1;
    tilesIn(p, (tx, ty, t) => { if (t === BLINK_A || t === BLINK_B) B.hold.add(tx + ',' + ty); });
  }
  for (const k of [...B.hold]) {
    const [tx, ty] = k.split(',').map(Number);
    if (!(p.x < tx * T + T && p.x + p.w > tx * T && p.y < ty * T + T && p.y + p.h > ty * T)) B.hold.delete(k);
  }

  for (const k in L.crumb) {
    const c = L.crumb[k];
    if (c.gone > 0) {
      if (--c.gone === 0) {
        const inside = p.x < c.tx * T + T && p.x + p.w > c.tx * T && p.y < c.ty * T + T && p.y + p.h > c.ty * T;
        if (inside) c.gone = 1; else { L.grid[c.ty][c.tx] = CRUMBLE; delete L.crumb[k]; }
      }
    } else if (++c.t > 34) {
      L.grid[c.ty][c.tx] = EMPTY; c.gone = 220;
      rubble(c.tx * T, c.ty * T, '120,110,160');
    }
  }

  for (const e of L.enemies) updateEnemy(e);
  L.enemies = L.enemies.filter(e => !e.dead);
  if (L.boss) updateBoss(L.boss);

  for (const w of L.waves) {
    w.x += w.dir * w.sp; w.life--;
    if (solidAt(Math.floor(w.x / T), Math.floor((w.y - 8) / T)) || tileAt(Math.floor(w.x / T), Math.floor((w.y + 4) / T)) === EMPTY) w.life = 0;
  }
  L.waves = L.waves.filter(w => w.life > 0);

  for (const s of L.shots) {
    s.life--; s.vy += s.grav; s.x += s.vx; s.y += s.vy;
    if (solidAt(Math.floor(s.x / T), Math.floor(s.y / T))) { s.life = 0; sparkle(s.x, s.y, s.kind === 'shard' ? '140,230,255' : '200,150,255'); continue; }
    if (nearPlayer(s.x, s.y, s.r + 9, s.r + 12)) { hurt(); s.life = 0; }
  }
  L.shots = L.shots.filter(s => s.life > 0 && s.y < LH * T);

  for (const c of L.cannons) {
    const cx = c.tx * T + T / 2;
    if (Math.abs(cx - (cam.x + VW / 2)) > VW * 0.6 || p.dead) continue;
    if (++c.t > 150 && Math.abs(p.x + p.w / 2 - cx) > 50) {
      c.t = 0; c.flash = 10;
      const dir = Math.sign(p.x + p.w / 2 - cx) || -1, m = makeEnemy('bullet', 0, 0, { dir });
      m.x = dir > 0 ? c.tx * T + T + 1 : c.tx * T - m.w - 1; m.y = c.ty * T + 7;
      L.enemies.push(m); sfx('boom');
    }
    if (c.flash > 0) c.flash--;
  }

  for (const d of L.drops) {
    // icicles hang until you walk underneath
    if (d.warn < 0) { if (!p.dead && Math.abs(p.x + p.w / 2 - d.x) < 56 && p.y > d.y && p.y - d.y < 420) d.warn = 26; continue; }
    if (d.warn > 0) { d.warn--; if (tick % 4 === 0) parts.push({ x: d.x + (Math.random() - .5) * 10, y: d.y, vx: 0, vy: 1, life: 14, max: 14, r: 1.6, col: '150,140,190', g: 0.1 }); continue; }
    d.vy = Math.min(d.vy + 0.6, 12); d.y += d.vy;
    if (nearPlayer(d.x, d.y + 14, 16, 26)) { hurt(); d.dead = true; }
    if (solidAt(Math.floor(d.x / T), Math.floor((d.y + 28) / T))) { d.dead = true; rubble(d.x - 16, d.y + 20, '140,230,255'); sfx('crumble'); }
  }
  L.drops = L.drops.filter(d => !d.dead);

  for (const bo of L.bolts) {
    if (bo.warn > 0) {
      if (--bo.warn === 0) { flash = 8; shake = Math.max(shake, 7); sfx('thunder'); }
    } else {
      bo.strike--;
      if (!p.dead && Math.abs(p.x + p.w / 2 - bo.x) < 20) hurt();
    }
  }
  L.bolts = L.bolts.filter(bo => bo.warn > 0 || bo.strike > 0);

  for (const f of L.fires) {
    f.life--;
    f.x += f.vx;
    if (solidAt(Math.floor(f.x / T), Math.floor(f.y / T))) { f.life = 0; sparkle(f.x, f.y, '255,140,40'); continue; }
    f.vy = Math.min(f.vy + 0.45, 9); f.y += f.vy;
    const fy = Math.floor((f.y + f.r) / T), fx = Math.floor(f.x / T);
    if (f.vy > 0 && (solidAt(fx, fy) || tileAt(fx, fy) === ONEWAY)) { f.y = fy * T - f.r; f.vy = -5.5; }
    for (const e of L.enemies) {
      if (!e.dying && e.type !== 'chaser' && f.x > e.x - 4 && f.x < e.x + e.w + 4 && f.y > e.y - 4 && f.y < e.y + e.h + 4) {
        killEnemy(e, true); sfx('stomp'); f.life = 0; break;
      }
    }
    const b = L.boss;
    if (b && b.active && !b.dead && f.life > 0 && f.x > b.x && f.x < b.x + b.w && f.y > b.y && f.y < b.y + b.h) {
      f.life = 0; sparkle(f.x, f.y, '255,140,40');    // fire does not hurt bosses: stomp them
    }
    if (f.y > LH * T) f.life = 0;
  }
  L.fires = L.fires.filter(f => f.life > 0);

  for (const it of L.items) {
    if (it.rise > 0) {
      it.rise--; it.y -= 1;
      // hop off the block, away from the player, and drop to the ground where it is easy to grab
      if (!it.rise) { it.vx = (p.x + p.w / 2 < it.x + 10 ? 1 : -1) * 1.6; it.vy = -3; }
    } else {
      moveBody(it, 0.4);
      if (it.grounded) it.vx *= 0.85;
      let lost = it.y > LH * T;
      tilesIn(it, (tx, ty, t) => { if (t === LAVA) lost = true; });
      if (lost) it.taken = true;
    }
  }
  L.items = L.items.filter(it => !it.taken);
  for (const k in L.bumps) if (--L.bumps[k] <= 0) delete L.bumps[k];
  for (const c of L.fly) { c.y += c.vy; c.vy += 0.5; c.life--; }
  L.fly = L.fly.filter(c => c.life > 0);
  for (const t of L.texts) { t.y -= 0.6; t.life--; }
  L.texts = L.texts.filter(t => t.life > 0);
  for (const s of L.springs) if (s.squash > 0) s.squash -= 0.08;
  if (flash > 0) flash--;
  if (W.bg === 'castle' && Math.random() < 0.003) flash = Math.max(flash, 5);
}

function update() {
  if (finishT) {
    // short celebration before the results screen
    if (++finishT === 50) finishLevel();
    updateParticles();
    return;
  }
  time++;
  updateWorld();
  updatePlayer();
  updateParticles();
  updateCamera(0.12, 0.08);
}
function updateParticles() {
  for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
  parts = parts.filter(q => q.life > 0);
}

function updateCamera(kx, ky) {
  look += (p.vx * 24 - look) * 0.04;
  let lo = 0, hi = LW * T - VW;
  if (L.arena && L.arena.on) { lo = L.arena.x0 * T; hi = (L.arena.x1 + 1) * T - VW; }
  const tx = clamp(p.x + p.w / 2 + look - VW / 2, lo, hi);
  const ty = clamp(p.y + p.h / 2 - VH * 0.55, 0, LH * T - VH);
  cam.x += (tx - cam.x) * kx; cam.y += (ty - cam.y) * ky;

}

// ---------- drawing: backgrounds ----------
function drawBackground() {

function bgMeadow(S) {

    const x = (((i * 290 + tick * 0.12 - cam.x * 0.1) % span) + span) % span - 200;
    const y = 50 + hash(i, 3) * 140 - cam.y * 0.1, s = 0.7 + hash(i, 7) * 0.6;
    ctx.beginPath();

}

function bgCave(S) {
  // glowing crystals far back
  for (let i = 0; i < 14; i++) {
    const span = VW + 200;
    const x = (((hash(i, 1) * 3000 - cam.x * 0.15) % span) + span) % span - 100;
    const y = 120 + hash(i, 2) * 300 - cam.y * 0.15, s = 6 + hash(i, 3) * 10;
    const pulse = 0.5 + 0.5 * Math.sin(tick * 0.03 + i);
    ctx.fillStyle = `rgba(${S.glow},${0.08 + pulse * 0.08})`; ctx.beginPath(); ctx.arc(x, y, s * 4, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(${S.glow},.55)`;
    ctx.beginPath(); ctx.moveTo(x, y - s * 1.6); ctx.lineTo(x + s * 0.6, y); ctx.lineTo(x, y + s * 0.7); ctx.lineTo(x - s * 0.6, y); ctx.fill();
  }

  caveLayer(0.4, S.rock[1], 110, 430, 2);

function caveLayer(par, col, topAmp, base, seed) {
  const ox = cam.x * par, oy = cam.y * par * 0.5;

  ctx.beginPath(); ctx.moveTo(0, 0);
  for (let x = -40; x <= VW + 40; x += 40) {
    const i = Math.floor((x + ox) / 40), fx = i * 40 - ox;
    ctx.lineTo(fx, 20 - oy); ctx.lineTo(fx + 20, 20 + hash(i, seed) * topAmp - oy); ctx.lineTo(fx + 40, 20 - oy);
  }

  for (let x = 0; x <= VW; x += 10) {

    ctx.lineTo(x, base - oy - Math.abs(Math.sin(w * 0.007 + seed)) * 60 - Math.sin(w * 0.031) * 8);

function bgCastle(S) {

  ctx.fillStyle = 'rgba(220,230,255,.12)'; ctx.beginPath(); ctx.arc(mx, 100, 70, 0, 6.283); ctx.fill();
  ctx.fillStyle = S.moon; ctx.beginPath(); ctx.arc(mx, 100, 34, 0, 6.283); ctx.fill();
  if (flash > 0) { ctx.fillStyle = `rgba(230,235,255,${flash / 14})`; ctx.fillRect(0, 0, VW, VH); }
  // heavy clouds

  for (let i = 0; i < 7; i++) {
    const span = VW + 400;
    const x = (((i * 260 + tick * 0.3 - cam.x * 0.08) % span) + span) % span - 200, y = 40 + hash(i, 5) * 90;
    ctx.beginPath(); ctx.ellipse(x, y, 140, 34, 0, 0, 6.283); ctx.fill();
  }

  towers(0.38, S.towers[1], 360, 2);

  for (let i = 0; i < 70; i++) {
    const x = ((hash(i, 9) * VW + tick * 3) % VW), y = ((hash(i, 4) * VH + tick * 14) % VH);
    ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14);

function towers(par, col, base, seed) {
  const ox = cam.x * par, by = base - cam.y * par * 0.5, step = 150;
  ctx.fillStyle = col;
  ctx.fillRect(0, by + 60, VW, VH);
  for (let i = Math.floor(ox / step) - 1; i < Math.floor((ox + VW) / step) + 2; i++) {
    const x = i * step - ox + hash(i, seed) * 40, w = 50 + hash(i, seed + 1) * 40, h = 90 + hash(i, seed + 2) * 140;
    ctx.fillStyle = col;
    ctx.fillRect(x, by + 60 - h, w, h);
    for (let c = 0; c < w; c += 14) ctx.fillRect(x + c, by + 60 - h - 10, 8, 10);
    if (hash(i, seed + 3) > 0.4) {
      ctx.fillStyle = 'rgba(255,200,90,.55)';
      ctx.fillRect(x + w / 2 - 4, by + 60 - h + 26, 8, 12);
    }
  }
}

function bgIce(S) {
  const sx = VW * 0.75 - cam.x * 0.02;
  ctx.fillStyle = 'rgba(255,255,240,.3)'; ctx.beginPath(); ctx.arc(sx, 100, 64, 0, 6.283); ctx.fill();
  ctx.fillStyle = S.sun; ctx.beginPath(); ctx.arc(sx, 100, 38, 0, 6.283); ctx.fill();
  peaks(0.15, S.peaks[0], 380, 1, 210);
  peaks(0.35, S.peaks[1], 440, 2, 150);
  // snowfall
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 90; i++) {
    const x = ((hash(i, 2) * VW + Math.sin(tick * 0.01 + i) * 30 - cam.x * 0.2) % VW + VW) % VW;
    const y = (hash(i, 6) * VH + tick * (0.6 + hash(i, 8))) % VH;
    ctx.beginPath(); ctx.arc(x, y, 1 + hash(i, 1) * 2, 0, 6.283); ctx.fill();
  }
}
function peaks(par, col, base, seed, hMax) {
  const ox = cam.x * par, by = base - cam.y * par * 0.5, step = 220;
  for (let i = Math.floor(ox / step) - 1; i < Math.floor((ox + VW) / step) + 2; i++) {
    const x = i * step - ox, h = 90 + hash(i, seed) * hMax, w = 260 + hash(i, seed + 1) * 120, px = x + w * 0.5;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x - 40, by + 200); ctx.lineTo(px, by - h); ctx.lineTo(x + w + 40, by + 200); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.moveTo(px, by - h); ctx.lineTo(px + 34, by - h + 46); ctx.lineTo(px + 12, by - h + 38);
    ctx.lineTo(px - 6, by - h + 50); ctx.lineTo(px - 32, by - h + 44); ctx.closePath(); ctx.fill();

function bgSky(S) {
  const sx = VW * 0.5 - cam.x * 0.02, sy = 130;
  // slow-turning sun rays
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(tick * 0.001);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, -700); ctx.lineTo(40, -700); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,230,.4)'; ctx.beginPath(); ctx.arc(sx, sy, 80, 0, 6.283); ctx.fill();
  ctx.fillStyle = S.sun; ctx.beginPath(); ctx.arc(sx, sy, 48, 0, 6.283); ctx.fill();
  // floating islands far away
  for (let i = 0; i < 5; i++) {
    const span = VW + 300, x = (((hash(i, 4) * 2000 - cam.x * 0.12) % span) + span) % span - 150, y = 160 + hash(i, 5) * 140, w = 60 + hash(i, 6) * 70;
    ctx.fillStyle = 'rgba(150,110,90,.35)';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w * 0.5, y + w * 0.6); ctx.fill();
    ctx.fillStyle = 'rgba(120,180,110,.45)'; ctx.fillRect(x, y - 5, w, 6);
  }

function cloudSea(par, col, base, seed) {
