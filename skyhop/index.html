}

// ---------- drawing: tiles ----------
const looksSolid = t => t === SOLID || t === FAKE;
function drawGround(tx, ty, x, y) {
  const S = W.ground;
  ctx.fillStyle = S.body; ctx.fillRect(x, y, T, T);
  if (W.bg === 'castle') {
    // bricks
    ctx.fillStyle = S.dot;
    ctx.fillRect(x, y + 15, T, 2);
    ctx.fillRect(x + (ty % 2 ? 8 : 22), y, 2, 15); ctx.fillRect(x + (ty % 2 ? 24 : 6), y + 17, 2, 15);
  } else if (hash(tx, ty) > 0.45) {
    ctx.fillStyle = S.dot;
    ctx.fillRect(x + 3 + hash(tx, ty + 1) * 22, y + 12 + hash(tx + 1, ty) * 14, 6, 4);
  }
  ctx.fillStyle = S.edge;
  if (!looksSolid(tileAt(tx - 1, ty))) ctx.fillRect(x, y, 3, T);
  if (!looksSolid(tileAt(tx + 1, ty))) ctx.fillRect(x + T - 3, y, 3, T);
  if (ty + 1 < LH && !looksSolid(tileAt(tx, ty + 1))) ctx.fillRect(x, y + T - 3, T, 3);
  if (!looksSolid(tileAt(tx, ty - 1))) {
    ctx.fillStyle = S.top[0]; ctx.fillRect(x, y, T, 10);
    ctx.fillStyle = S.top[1];
    if (W.bg === 'meadow' || W.bg === 'sky' || W.bg === 'ice') for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + 4 + i * 8, y + 10, 4, 0, Math.PI); ctx.fill(); }
    else ctx.fillRect(x, y + 8, T, 3);
    ctx.fillStyle = S.top[2]; ctx.fillRect(x, y, T, 3);
    if (W.bg === 'meadow' && hash(tx, ty + 5) > 0.6) {
      ctx.fillStyle = S.top[0];
      const bx = x + 6 + hash(tx, 9) * 18;
      ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + 2, y - 6); ctx.lineTo(bx + 4, y); ctx.fill();
    } else if (W.bg === 'cave' && hash(tx, ty + 5) > 0.7) {
      // little crystal growing out of the floor
      const bx = x + 8 + hash(tx, 9) * 14, h = 8 + hash(tx, 3) * 8;
      ctx.fillStyle = hash(tx, 4) > 0.5 ? '#7fe6ff' : '#c39bff';
      ctx.beginPath(); ctx.moveTo(bx - 3, y); ctx.lineTo(bx, y - h); ctx.lineTo(bx + 3, y); ctx.fill();
    } else if (W.bg === 'castle') {
      ctx.fillStyle = S.edge; ctx.fillRect(x + (tx % 2) * 16, y, 2, 10);
    }
  } else if (W.bg === 'cave' && ty > 0 && !looksSolid(tileAt(tx, ty + 1)) && hash(tx, ty) > 0.6) {
    // stalactite under a ceiling tile
    ctx.fillStyle = S.body;
    const bx = x + 6 + hash(tx, 2) * 18;
    ctx.beginPath(); ctx.moveTo(bx - 5, y + T); ctx.lineTo(bx, y + T + 10 + hash(tx, 7) * 10); ctx.lineTo(bx + 5, y + T); ctx.fill();
  }
}

function drawTiles() {
  const x0 = Math.max(0, Math.floor(cam.x / T)), x1 = Math.min(LW - 1, Math.floor((cam.x + VW) / T));
  const y0 = Math.max(0, Math.floor(cam.y / T)), y1 = Math.min(LH - 1, Math.floor((cam.y + VH) / T));
  const warn = L.blink.t > BLINK_PERIOD - 30 && Math.floor(tick / 4) % 2 === 0;
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = L.grid[ty][tx]; if (!t) continue;
    const x = tx * T, bump = L.bumps[tx + ',' + ty] || 0, y = ty * T - Math.sin(bump / 10 * Math.PI) * 6;
    if (t === SOLID) drawGround(tx, ty, x, y);
    else if (t === FAKE) {
      ctx.globalAlpha = 1 - L.reveal * 0.6; drawGround(tx, ty, x, y); ctx.globalAlpha = 1;
    } else if (t === ONEWAY) {
      const P = W.plank;
      ctx.fillStyle = P[0]; ctx.fillRect(x, y, T, 10);
      ctx.fillStyle = P[1]; ctx.fillRect(x, y, T, 3);
      ctx.fillStyle = P[2]; ctx.fillRect(x, y + 10, T, 2);
      if (tx % 2 === 0) ctx.fillRect(x, y, 2, 10);
    } else if (t === QBLOCK) {
      ctx.fillStyle = '#c98a00'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#ffc93c'; ctx.fillRect(x + 2, y + 2, T - 4, T - 5);
      ctx.fillStyle = '#ffe48a'; ctx.fillRect(x + 2, y + 2, T - 4, 3);
      ctx.fillStyle = '#9a6400';
      for (const [a, c] of [[5, 5], [T - 7, 5], [5, T - 8], [T - 7, T - 8]]) ctx.fillRect(x + a, y + c, 2, 2);
      ctx.font = '700 20px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#9a6400'; ctx.fillText('?', x + T / 2 + 1, y + 24 + Math.sin(tick * 0.08) * 1);
      ctx.fillStyle = '#fff'; ctx.fillText('?', x + T / 2, y + 23 + Math.sin(tick * 0.08) * 1);
    } else if (t === USED) {
      ctx.fillStyle = '#6e4a2a'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#93684a'; ctx.fillRect(x + 2, y + 2, T - 4, T - 5);
      ctx.fillStyle = '#5a3418';
      for (const [a, c] of [[5, 5], [T - 7, 5], [5, T - 8], [T - 7, T - 8]]) ctx.fillRect(x + a, y + c, 2, 2);
    } else if (t === CRUMBLE) {
      const c = L.crumb[tx + ',' + ty], jx = c ? (Math.random() - .5) * 3 : 0;
      ctx.fillStyle = '#6b6290'; ctx.fillRect(x + jx, y, T, T);
      ctx.fillStyle = '#8a80b8'; ctx.fillRect(x + jx, y, T, 4);
      ctx.strokeStyle = '#2d2740'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x + jx + 6, y + 4); ctx.lineTo(x + jx + 14, y + 16); ctx.lineTo(x + jx + 10, y + 28);
      ctx.moveTo(x + jx + 22, y + 6); ctx.lineTo(x + jx + 18, y + 18); ctx.lineTo(x + jx + 26, y + 26);
      ctx.stroke();
      ctx.strokeStyle = '#1c1828'; ctx.strokeRect(x + jx + 1, y + 1, T - 2, T - 2);
    } else if (t === SPIKE) {
      ctx.fillStyle = '#3a3f4c'; ctx.fillRect(x, y + T - 6, T, 6);
      ctx.fillStyle = '#d9dde6'; ctx.strokeStyle = '#262a35'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(x + i * 8, y + T - 6); ctx.lineTo(x + i * 8 + 4, y + 10); ctx.lineTo(x + i * 8 + 8, y + T - 6);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    } else if (t === ICE) {
      ctx.fillStyle = '#9fd6f2'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#d8f2ff'; ctx.fillRect(x, y, T, 5);
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x + 6, y + 24); ctx.lineTo(x + 16, y + 10); ctx.moveTo(x + 16, y + 28); ctx.lineTo(x + 26, y + 14); ctx.stroke();
      ctx.strokeStyle = '#4f86a8'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.75, y + 0.75, T - 1.5, T - 1.5);
    } else if (t === CANNON) {
      const c = L.cannons.find(q => q.tx === tx && q.ty === ty), f = c && c.flash > 0 ? c.flash / 10 : 0;
      ctx.fillStyle = '#2a2d3a'; ctx.beginPath(); ctx.roundRect(x + 1, y + 2, T - 2, T - 2, 6); ctx.fill();
      ctx.fillStyle = '#4a4f62'; ctx.fillRect(x + 4, y + 6, T - 8, 5);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(x + 3, y + T - 9, T - 6, 4);
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 6, y + 16, 5, 0, 6.283); ctx.arc(x + T - 6, y + 16, 5, 0, 6.283); ctx.fill();
      if (f) { ctx.fillStyle = `rgba(255,200,90,${f})`; ctx.beginPath(); ctx.arc(x + T / 2, y + 16, 14, 0, 6.283); ctx.fill(); }
    } else if (t === LAVA && W.bg === 'ice') {
      // in the frozen world the deadly liquid is freezing water
      const surface = tileAt(tx, ty - 1) !== LAVA;
      ctx.fillStyle = surface ? '#3f8fd0' : '#1f5a8f'; ctx.fillRect(x, y + (surface ? 6 : 0), T, T - (surface ? 6 : 0));
      if (surface) {
        ctx.fillStyle = '#bfe6ff'; ctx.fillRect(x, y + 6 + Math.sin(tick * 0.05 + tx) * 1.5, T, 3);
        if (hash(tx, 3) > 0.6) { ctx.fillStyle = '#eaf7ff'; ctx.fillRect(x + 6 + hash(tx, 5) * 14, y + 5, 10, 4); }
      }
    } else if (t === LAVA) {
      const surface = tileAt(tx, ty - 1) !== LAVA;
      ctx.fillStyle = surface ? '#ff6a1a' : '#c9300f'; ctx.fillRect(x, y + (surface ? 6 : 0), T, T - (surface ? 6 : 0));
      if (surface) {
        ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(x, y + T);
        for (let i = 0; i <= 4; i++) ctx.lineTo(x + i * 8, y + 6 + Math.sin(tick * 0.08 + tx * 1.3 + i) * 3);
        ctx.lineTo(x + T, y + T); ctx.fill();
        ctx.fillStyle = '#ff6a1a'; ctx.fillRect(x, y + 14, T, T - 14);
        if (hash(tx, Math.floor(tick / 40)) > 0.85) parts.push({ x: x + Math.random() * T, y: y + 6, vx: 0, vy: -1.5, life: 24, max: 24, r: 2, col: '255,170,60', g: 0.05 });
      }
    } else if (t === BLINK_A || t === BLINK_B) {
      const on = solidAt(tx, ty), col = t === BLINK_A ? '63,208,255' : '255,79,216';
      if (on) {
        ctx.fillStyle = `rgba(${col},${warn ? 0.45 : 1})`; ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
        ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(x + 3, y + 3, T - 6, 4);
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, T - 2, T - 2);
      } else {
        ctx.strokeStyle = `rgba(${col},.55)`; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
        ctx.strokeRect(x + 3, y + 3, T - 6, T - 6); ctx.setLineDash([]);
      }
    }
  }
}

function drawCoin(x, y, ph, r = 9) {
  const w = Math.max(1.5, Math.abs(Math.cos(tick * 0.06 + ph)) * r);
  ctx.fillStyle = '#c99a00'; ctx.beginPath(); ctx.ellipse(x, y + 1.5, w, r, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(x, y, w, r, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#fff2b0'; ctx.fillRect(x - w * 0.3, y - r * 0.55, Math.max(1, w * 0.25), r * 0.9);
}
function starPath(x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.3, y, x - s * 0.7, y - s * 0.9, x, y - s * 0.3);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 0.9, x + s * 1.3, y, x, y + s * 0.9);
  ctx.closePath();
}
function drawBigCoin(x, y) {
  const w = Math.max(3, Math.abs(Math.cos(tick * 0.04)) * 15);
  ctx.fillStyle = 'rgba(255,230,120,.35)'; ctx.beginPath(); ctx.arc(x, y, 22, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#c99a00'; ctx.beginPath(); ctx.ellipse(x, y + 2, w, 15, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(x, y, w, 15, 0, 0, 6.283); ctx.fill();
  if (w > 8) { ctx.fillStyle = '#fff6c9'; starPath(x, y, w * 0.55, w * 0.25); ctx.fill(); }
}

function drawItem(it) {
  const x = it.x + 10, y = it.y + 10 + (it.rise ? 0 : Math.sin(tick * 0.08) * 2);
  if (it.kind === 'heart') {
    ctx.fillStyle = '#c2185b'; heartPath(x, y + 1, 11); ctx.fill();
    ctx.fillStyle = '#ff6b8a'; heartPath(x, y, 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x - 4, y - 3, 2.5, 0, 6.283); ctx.fill();
  } else if (it.kind === 'fire') {
    ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.ellipse(x, y + 2, 9, 9, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 9, y + 1); ctx.quadraticCurveTo(x - 4, y - 16, x, y - 14);
    ctx.quadraticCurveTo(x + 4, y - 16, x + 9, y + 1); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(x, y + 3, 5, 6, 0, 0, 6.283); ctx.fill();
  } else {
    ctx.fillStyle = `hsl(${tick * 6 % 360},90%,60%)`; starPath(x, y, 12, 5.5, 5, -Math.PI / 2 + Math.sin(tick * 0.1) * 0.2); ctx.fill();
    ctx.fillStyle = '#fff'; starPath(x, y, 6, 2.6); ctx.fill();
  }
}

function drawProps() {
  for (const s of L.signs) {
    ctx.font = '600 14px Fredoka, system-ui, sans-serif';
    const w = ctx.measureText(s.text).width + 18, bx = s.x - w / 2, by = s.y - 64;
    ctx.fillStyle = '#7a4a22'; ctx.fillRect(s.x - 2, by + 20, 4, 44);
    ctx.fillStyle = '#f4e1c1'; ctx.strokeStyle = '#8a5530'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, by, w, 26, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a3418'; ctx.textAlign = 'center'; ctx.fillText(s.text, s.x, by + 18);
  }
  for (const m of L.plats) {
    ctx.fillStyle = '#7a8094'; ctx.fillRect(m.x + 6, m.y + 10, m.w - 12, 4);
    ctx.fillStyle = '#c8894a'; ctx.beginPath(); ctx.roundRect(m.x, m.y, m.w, 12, 4); ctx.fill();
    ctx.fillStyle = '#e3a865'; ctx.fillRect(m.x + 3, m.y + 1, m.w - 6, 3);
    ctx.fillStyle = '#7a4a22';
    for (let x = m.x + T; x < m.x + m.w; x += T) ctx.fillRect(x, m.y, 2, 12);
  }
  for (const s of L.springs) {
    const q = Math.max(0, s.squash), h = s.h * (1 - q * 0.5);
    ctx.fillStyle = '#555c6e'; ctx.fillRect(s.x + 2, s.y + s.h - 4, s.w - 4, 4);
    ctx.strokeStyle = '#9aa3b5'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 4; i++) ctx.lineTo(s.x + (i % 2 ? s.w - 6 : 6), s.y + s.h - 4 - (h - 6) * i / 4);
    ctx.stroke();
    ctx.fillStyle = '#ff5d5d'; ctx.fillRect(s.x, s.y + s.h - h - 2, s.w, 5);
  }
  for (const c of L.checkpoints) {
    ctx.fillStyle = '#7a8094'; ctx.fillRect(c.x - 2, c.y - 70, 4, 70);
    const fy = c.on ? c.y - 68 : c.y - 24;
    ctx.fillStyle = c.on ? '#5cd65c' : '#b9bfcc';
    ctx.beginPath(); ctx.moveTo(c.x + 2, fy); ctx.lineTo(c.x + 26 + Math.sin(tick * 0.15) * 2, fy + 9); ctx.lineTo(c.x + 2, fy + 18); ctx.fill();
  }
  const gl = L.goal;
  if (gl) {
    ctx.fillStyle = '#e8e8f0'; ctx.fillRect(gl.x - 3, gl.top, 6, gl.y - gl.top);
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(gl.x, gl.top - 6, 9, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ff5d5d'; ctx.beginPath(); ctx.moveTo(gl.x + 3, gl.top + 6);
    for (let i = 0; i <= 6; i++) ctx.lineTo(gl.x + 3 + i * 9, gl.top + 6 + Math.sin(tick * 0.12 - i * 0.7) * 3 + i * 1.2);
    for (let i = 6; i >= 0; i--) ctx.lineTo(gl.x + 3 + i * 9, gl.top + 40 + Math.sin(tick * 0.12 - i * 0.7) * 3 - i * 1.2);
    ctx.fill();
    ctx.fillStyle = '#6b6f80'; ctx.fillRect(gl.x - 14, gl.y - 10, 28, 10);
  }
  for (const c of L.coins) if (!c.got) drawCoin(c.x, c.y + Math.sin(tick * 0.05 + c.ph) * 2, c.ph);
  for (const c of L.big) if (!c.got) drawBigCoin(c.x, c.y + Math.sin(tick * 0.05) * 3);
  for (const c of L.fly) drawCoin(c.x, c.y, 0);
  for (const it of L.items) drawItem(it);
}

// ---------- drawing: characters ----------
function eyesAt(x, y, look, col = '#1b1b2f') {
  for (const ex of [-4, 4]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x + ex, y, 3, 3.6, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + ex + look * 1.2, y + 0.5, 1.6, 0, 6.283); ctx.fill();
  }
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w / 2, e.y + e.h);
  if (e.flip) { ctx.translate(0, -e.h / 2); ctx.rotate(Math.PI); ctx.translate(0, e.h / 2); }
  const squash = e.dying && !e.flip ? Math.max(0.25, 1 - e.dying / 6) : 1;
  ctx.scale(1, squash);
  if (e.type === 'blob' || e.type === 'mini') {
    const s = e.type === 'mini' ? 0.72 : 1, wob = Math.sin(e.t * 0.2) * 1.5;
    // dark outline keeps green slimes readable against green hills
    ctx.fillStyle = e.type === 'mini' ? '#8fdc5a' : '#45b83a'; ctx.strokeStyle = '#1d4d22'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-12 * s - wob, 0);
    ctx.quadraticCurveTo(-13 * s, -22 * s, 0, -21 * s + wob); ctx.quadraticCurveTo(13 * s, -22 * s, 12 * s + wob, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-5 * s, -14 * s, 3, 2, -0.5, 0, 6.283); ctx.fill();
    eyesAt(e.dir * 2, -11 * s, e.dir);
  } else if (e.type === 'hopper') {
    const air = !e.grounded;
    ctx.fillStyle = '#6a3fb5';
    ctx.fillRect(-11, air ? -4 : -3, 6, air ? 6 : 3); ctx.fillRect(5, air ? -4 : -3, 6, air ? 6 : 3);
    ctx.fillStyle = '#9b6bff'; ctx.beginPath(); ctx.ellipse(0, -12, 12, 10, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#d7c2ff'; ctx.beginPath(); ctx.ellipse(0, -8, 7, 5, 0, 0, 6.283); ctx.fill();
    eyesAt(0, -20, e.dir);
  } else if (e.type === 'buzzer') {
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    const flap = Math.sin(e.t * 0.9) * 4;
    ctx.beginPath(); ctx.ellipse(-4, -17 - flap, 7, 4, -0.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, -17 + flap, 7, 4, 0.4, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.ellipse(0, -9, 13, 9, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-4, -18, 3, 18); ctx.fillRect(3, -18, 3, 18);
    ctx.beginPath(); ctx.moveTo(-e.dir * 13, -9); ctx.lineTo(-e.dir * 18, -8); ctx.lineTo(-e.dir * 13, -6); ctx.fill();
    eyesAt(e.dir * 7, -11, e.dir);
  } else if (e.type === 'spiky') {
    ctx.fillStyle = '#f2f2f2';
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 5 - 4, -14); ctx.lineTo(i * 5, -25 + Math.abs(i) * 2); ctx.lineTo(i * 5 + 4, -14); ctx.fill(); }
    ctx.fillStyle = '#e8463c'; ctx.beginPath(); ctx.ellipse(0, -10, 13, 10, 0, Math.PI, 0); ctx.lineTo(13, -2); ctx.lineTo(-13, -2); ctx.fill();
    ctx.fillStyle = '#ffd0a0'; ctx.fillRect(-11, -4, 22, 4);
    ctx.fillStyle = '#5a2a1a';
    ctx.fillRect(-9 + Math.sin(e.t * 0.3) * 2, -1, 5, 2); ctx.fillRect(4 - Math.sin(e.t * 0.3) * 2, -1, 5, 2);
    eyesAt(e.dir * 6, -8, e.dir);
  } else if (e.type === 'spitter') {
    ctx.fillStyle = '#3e8a4a';
    ctx.beginPath(); ctx.ellipse(-8, -3, 8, 3, -0.3, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -3, 8, 3, 0.3, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#b25cff'; ctx.strokeStyle = '#3a1660'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -13, 12, 12, 0, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e4c4ff'; for (const [a, c] of [[-5, -19], [4, -21], [-2, -9]]) { ctx.beginPath(); ctx.arc(a, c, 1.8, 0, 6.283); ctx.fill(); }
    const open = e.mouth > 0 ? 6 : 3;
    ctx.fillStyle = '#3a1660'; ctx.beginPath(); ctx.ellipse(e.dir * 9, -12, 4, open, 0, 0, 6.283); ctx.fill();
    eyesAt(e.dir * 1, -17, e.dir);
  } else if (e.type === 'slider') {
    const slide = e.dash > 0;
    ctx.save(); if (slide) { ctx.translate(0, -6); ctx.rotate(e.dir * 1.35); ctx.translate(0, 6); }
    ctx.fillStyle = '#ffb13b'; ctx.fillRect(-8, -3, 6, 3); ctx.fillRect(2, -3, 6, 3);
    ctx.fillStyle = '#26314a'; ctx.strokeStyle = '#0f1424'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -11, 11, 11, 0, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2f6ff'; ctx.beginPath(); ctx.ellipse(e.dir * 2, -9, 7, 8, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffb13b'; ctx.beginPath(); ctx.moveTo(e.dir * 9, -14); ctx.lineTo(e.dir * 15, -12); ctx.lineTo(e.dir * 9, -10); ctx.fill();
    eyesAt(e.dir * 3, -15, e.dir);
    ctx.fillStyle = '#e8463c'; ctx.fillRect(-10, -6, 20, 3);
    ctx.restore();
  } else if (e.type === 'bullet') {
    ctx.fillStyle = '#1c1e28'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(e.dir * 2, -9, 12, 8, 0, 0, 6.283); ctx.fill();
    ctx.fillRect(-e.dir * 13 - 2, -16, 4, 14);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(e.dir * 5, -11, 3, 3.6, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(e.dir * 6, -11, 1.6, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(e.dir * 2, -6); ctx.lineTo(e.dir * 8, -5); ctx.stroke();
    if (e.t % 4 < 2) parts.push({ x: e.x + e.w / 2 - e.dir * 16, y: e.y + 9, vx: -e.dir * 0.5, vy: 0, life: 14, max: 14, r: 3, col: '200,200,210', g: -0.02 });
  } else if (e.type === 'chaser') {
    const bob = Math.sin(e.t * 0.08) * 2;
    ctx.globalAlpha *= e.shy ? 0.55 : 0.9;
    ctx.fillStyle = '#f2f4ff'; ctx.strokeStyle = '#6a6f88'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-13, -4 + bob);
    ctx.quadraticCurveTo(-14, -28 + bob, 0, -27 + bob); ctx.quadraticCurveTo(14, -28 + bob, 13, -4 + bob);
    for (let i = 0; i < 4; i++) ctx.quadraticCurveTo(13 - i * 6.5 - 3, (i % 2 ? -4 : 2) + bob, 13 - (i + 1) * 6.5, -4 + bob);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (e.shy) {
      // covers its eyes while you look at it
      ctx.fillStyle = '#d8dcf0'; ctx.beginPath(); ctx.ellipse(-5, -16 + bob, 5, 4, 0.3, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5, -16 + bob, 5, 4, -0.3, 0, 6.283); ctx.fill();
    } else {
      ctx.fillStyle = '#1b1b2f';
      ctx.beginPath(); ctx.ellipse(-4 + e.dir * 2, -17 + bob, 2.5, 3.5, 0, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse(4 + e.dir * 2, -17 + bob, 2.5, 3.5, 0, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse(e.dir * 2, -9 + bob, 4, 3, 0, 0, 6.283); ctx.fill();
    }
  }
  ctx.restore();
}

function drawBoss(b) {
  if (b.dead > 60) return;
  const ph = bossPhase(b);
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + b.h);
  if (b.dead) { ctx.globalAlpha = 1 - b.dead / 60; ctx.scale(1 + b.dead / 40, 1 - b.dead / 70); }
  const sq = Math.max(0, b.squash), air = !b.grounded && b.kind !== 'king';
  ctx.scale(1 + sq * 0.2 - (air ? 0.06 : 0), 1 - sq * 0.2 + (air ? 0.08 : 0));
  if (b.inv > 0 && Math.floor(b.inv / 4) % 2) ctx.globalAlpha *= 0.4;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 0, b.w / 2, 6, 0, 0, 6.283); ctx.fill();
  if (b.kind === 'blob') drawBlobBoss(b, ph, air);
  else if (b.kind === 'golem') drawGolem(b, ph);
  else if (b.kind === 'yeti') drawYeti(b, ph);
  else if (b.kind === 'dragon') drawDragon(b, ph);
  else drawKing(b, ph);
  ctx.restore();
}

function drawBlobBoss(b, ph, air) {
  ctx.fillStyle = ph === 1 ? '#5cc94a' : ph === 2 ? '#d6c23a' : '#e8563c';
  ctx.beginPath(); ctx.moveTo(-40, 0);
  ctx.quadraticCurveTo(-44, -66, 0, -62); ctx.quadraticCurveTo(44, -66, 40, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(20,30,20,.7)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(-16, -44, 8, 5, -0.5, 0, 6.283); ctx.fill();
  crown(0, -58, 1);
  for (const ex of [-12, 12]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex + b.face * 4, -36, 7, 8, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.arc(ex + b.face * 7, -34, 3.5, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(ex + b.face * 4 - 8, -48 + (ex < 0 ? 0 : 4)); ctx.lineTo(ex + b.face * 4 + 8, -48 + (ex < 0 ? 4 : 0)); ctx.stroke();
  }
  ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.ellipse(b.face * 4, -18, 10, air ? 6 : 3, 0, 0, 6.283); ctx.fill();
}
function crown(x, y, s) {
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#a07800'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - 16 * s, y); ctx.lineTo(x - 18 * s, y - 18 * s); ctx.lineTo(x - 8 * s, y - 8 * s); ctx.lineTo(x, y - 22 * s);
  ctx.lineTo(x + 8 * s, y - 8 * s); ctx.lineTo(x + 18 * s, y - 18 * s); ctx.lineTo(x + 16 * s, y); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawGolem(b, ph) {
  const step = b.mode === 'walk' ? Math.sin(tick * 0.15) * 3 : 0;
  ctx.fillStyle = '#4a4466';
  ctx.fillRect(-26, -18 + Math.max(0, step), 18, 18); ctx.fillRect(8, -18 + Math.max(0, -step), 18, 18);
  ctx.fillStyle = '#6b6290'; ctx.strokeStyle = '#231e36'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(-34, -70, 68, 54, 8); ctx.fill(); ctx.stroke();
  const arm = b.mode === 'throw' && b.at < 24 ? -20 : b.mode === 'stomp' ? -10 : 0;
  ctx.fillStyle = '#5a5280';
  ctx.beginPath(); ctx.roundRect(-46, -64 + arm, 14, 38, 6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(32, -64 + arm, 14, 38, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4a4466'; ctx.fillRect(-20, -46, 40, 4);
  // glowing eyes
  ctx.fillStyle = '#7fe6ff';
  ctx.fillRect(-16 + b.face * 4, -58, 9, 5); ctx.fillRect(7 + b.face * 4, -58, 9, 5);
  // the crystal on top is the weak spot
  const col = ph === 1 ? '#7fe6ff' : ph === 2 ? '#ffe066' : '#ff6b6b';
  ctx.fillStyle = col; ctx.strokeStyle = '#231e36'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-14, -70); ctx.lineTo(-6, -86); ctx.lineTo(0, -74); ctx.lineTo(6, -90); ctx.lineTo(14, -70); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(tick * 0.1) * 0.2})`; ctx.beginPath(); ctx.arc(0, -78, 3, 0, 6.283); ctx.fill();
}

function drawKing(b, ph) {
  const tired = b.mode === 'tired', fl = tired ? 0 : Math.sin(tick * 0.08) * 3;
  // cloak
  ctx.fillStyle = ph === 3 ? '#7a2a4a' : '#4a2f7a'; ctx.strokeStyle = '#140c24'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-30, 0 + fl);
  for (let i = 0; i <= 6; i++) ctx.lineTo(-30 + i * 10, (i % 2 ? -6 : 0) + fl);
  ctx.lineTo(22, -46 + fl); ctx.quadraticCurveTo(0, -60 + fl, -22, -46 + fl); ctx.closePath(); ctx.fill(); ctx.stroke();
  // face
  ctx.fillStyle = '#c9d2e8'; ctx.beginPath(); ctx.arc(0, -50 + fl, 16, 0, 6.283); ctx.fill(); ctx.stroke();
  if (tired) {
    ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 2;
    for (const ex of [-6, 6]) { ctx.beginPath(); ctx.moveTo(ex - 4, -52); ctx.lineTo(ex + 4, -48); ctx.moveTo(ex + 4, -52); ctx.lineTo(ex - 4, -48); ctx.stroke(); }
    for (let i = 0; i < 3; i++) {
      const a = tick * 0.08 + i * 2.1;
      ctx.fillStyle = '#ffe14d'; starPath(Math.cos(a) * 20, -78 + Math.sin(a) * 5, 5, 2.2); ctx.fill();
    }
  } else {
    ctx.fillStyle = '#ffe14d';
    ctx.fillRect(-9 + b.face * 3, -54 + fl, 6, 4); ctx.fillRect(3 + b.face * 3, -54 + fl, 6, 4);
  }
  crown(0, -64 + fl, 0.9);
  // lightning staff
  if (!tired) {
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 4; ctx.beginPath();
    ctx.moveTo(b.face * 26, -10 + fl); ctx.lineTo(b.face * 30, -66 + fl); ctx.stroke();
    ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(b.face * 30, -70 + fl, 6 + Math.sin(tick * 0.3) * 1.5, 0, 6.283); ctx.fill();
  }
}

function drawYeti(b, ph) {
  const step = b.mode === 'walk' || b.mode === 'charge' ? Math.sin(tick * (b.mode === 'charge' ? 0.4 : 0.15)) * 3 : 0;
  ctx.fillStyle = '#dfe9f5'; ctx.strokeStyle = '#4a5a74'; ctx.lineWidth = 3;
  ctx.fillRect(-24, -16 + Math.max(0, step), 16, 16); ctx.fillRect(8, -16 + Math.max(0, -step), 16, 16);
  ctx.beginPath(); ctx.ellipse(0, -44, 34, 32, 0, 0, 6.283); ctx.fill(); ctx.stroke();
  const arm = b.mode === 'throw' && b.at < 24 ? -22 : 0;
  ctx.beginPath(); ctx.ellipse(-36, -42 + arm, 9, 20, 0.3, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(36, -42 + arm, 9, 20, -0.3, 0, 6.283); ctx.fill(); ctx.stroke();
  // horns
  ctx.fillStyle = ph === 3 ? '#ff8a8a' : '#c9b38a';
  ctx.beginPath(); ctx.moveTo(-20, -68); ctx.lineTo(-30, -86); ctx.lineTo(-10, -72); ctx.fill();
  ctx.beginPath(); ctx.moveTo(20, -68); ctx.lineTo(30, -86); ctx.lineTo(10, -72); ctx.fill();
  // face
  ctx.fillStyle = '#7aa6d6'; ctx.beginPath(); ctx.ellipse(b.face * 6, -50, 18, 14, 0, 0, 6.283); ctx.fill();
  if (b.mode === 'dizzy') {
    ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 2;
    for (const ex of [-6, 8]) { ctx.beginPath(); ctx.arc(b.face * 6 + ex, -54, 4, 0, 5); ctx.stroke(); }
    for (let i = 0; i < 3; i++) { const a = tick * 0.1 + i * 2.1; ctx.fillStyle = '#ffe14d'; starPath(Math.cos(a) * 26, -88 + Math.sin(a) * 5, 5, 2.2); ctx.fill(); }
  } else {
    ctx.fillStyle = '#fff'; ctx.fillRect(b.face * 6 - 10, -57, 7, 6); ctx.fillRect(b.face * 6 + 3, -57, 7, 6);
    ctx.fillStyle = '#1b1b2f'; ctx.fillRect(b.face * 6 - 8 + b.face * 2, -55, 3, 3); ctx.fillRect(b.face * 6 + 5 + b.face * 2, -55, 3, 3);
  }
  ctx.fillStyle = '#1b1b2f'; ctx.fillRect(b.face * 6 - 7, -44, 14, 4);
  ctx.fillStyle = '#fff'; ctx.fillRect(b.face * 6 - 6, -44, 3, 3); ctx.fillRect(b.face * 6 + 3, -44, 3, 3);
}

function drawDragon(b, ph) {
  const tired = b.mode === 'tired', flap = tired ? 0.2 : Math.sin(tick * 0.2);
  const body = ph === 1 ? '#8a5cd6' : ph === 2 ? '#d6587a' : '#e8563c';
  ctx.save(); ctx.scale(b.face, 1);
  // wings
  ctx.fillStyle = '#ffd27a'; ctx.strokeStyle = '#5a2a1a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-6, -40); ctx.lineTo(-30, -40 - 34 * flap - 10); ctx.lineTo(-56, -44 - 20 * flap); ctx.lineTo(-30, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
  // tail
  ctx.strokeStyle = body; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-30, -22); ctx.quadraticCurveTo(-56, -14 + Math.sin(tick * 0.1) * 6, -62, -30); ctx.stroke();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-62, -38); ctx.lineTo(-70, -28); ctx.lineTo(-58, -24); ctx.fill();
  // body
  ctx.fillStyle = body; ctx.strokeStyle = '#2a0f20'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(-6, -24, 30, 20, 0, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffe2a8'; ctx.beginPath(); ctx.ellipse(-2, -18, 18, 10, 0, 0, 6.283); ctx.fill();
  // neck and head
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(22, -40, 10, 18, 0.5, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(34, -54, 16, 12, 0, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.moveTo(26, -64); ctx.lineTo(22, -78); ctx.lineTo(32, -66); ctx.fill();
  ctx.beginPath(); ctx.moveTo(34, -66); ctx.lineTo(34, -80); ctx.lineTo(40, -66); ctx.fill();
  if (tired) {
    ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(34, -58); ctx.lineTo(42, -54); ctx.moveTo(42, -58); ctx.lineTo(34, -54); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(38, -57, 4, 4, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.arc(39, -57, 2, 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = '#2a0f20'; ctx.fillRect(44, -50, 6, 2);
  ctx.restore();
  if (tired) for (let i = 0; i < 3; i++) { const a = tick * 0.08 + i * 2.1; ctx.fillStyle = '#ffe14d'; starPath(b.face * 34 + Math.cos(a) * 18, -88 + Math.sin(a) * 5, 5, 2.2); ctx.fill(); }
}

function drawPlayer() {
  if (p.dead) return;
  if (p.inv > 0 && Math.floor(p.inv / 4) % 2) return;
  const cx = p.x + p.w / 2, by = p.y + p.h;
  const starCol = p.star > 0 ? `hsl(${tick * 12 % 360},90%,62%)` : null;
  ctx.strokeStyle = starCol || (p.fire ? '#ff9a3d' : '#2ec4b6'); ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - p.face * 4, p.y + 9);
  for (const s of p.scarf) ctx.lineTo(s.x, s.y);
  ctx.stroke();

  ctx.save();
  ctx.translate(cx, by); ctx.scale(p.sx, p.sy);
  const step = p.grounded ? Math.sin(p.run) * 4 : 0, lift = p.grounded ? 0 : -2;
  ctx.fillStyle = '#5a2a1a';
  ctx.beginPath(); ctx.ellipse(-5 + step, -2 + lift, 5, 3, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5 - step, -2 + lift, 5, 3, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = starCol || (p.fire ? '#ff5a3c' : '#ff7a45'); ctx.beginPath(); ctx.ellipse(0, -14, 12, 13, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = p.fire ? '#fff1c9' : '#ffd8b5'; ctx.beginPath(); ctx.ellipse(p.face * 2, -10, 7, 7, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-4, -21, 4, 3, -0.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = starCol || (p.fire ? '#ff9a3d' : '#2ec4b6'); ctx.fillRect(-10, -20, 20, 4);
  const blink = (tick % 220) < 6;
  for (const ex of [-3, 4]) {
    const x = ex + p.face * 3;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x, -25, 3.2, blink ? 0.6 : 4, 0, 0, 6.283); ctx.fill();
    if (!blink) { ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.arc(x + p.face * 1.2, -24.5 + (p.vy > 2 ? 1 : p.vy < -2 ? -1 : 0), 1.8, 0, 6.283); ctx.fill(); }
  }
  ctx.restore();
  if (p.star > 0 && tick % 3 === 0) parts.push({ x: cx + (Math.random() - .5) * 20, y: p.y + Math.random() * p.h, vx: 0, vy: -0.5, life: 16, max: 16, r: 2, col: '255,240,150', g: 0 });
}

function drawEffects() {
  for (const w of L.waves) {
    ctx.fillStyle = 'rgba(255,240,200,.9)';
    ctx.beginPath(); ctx.moveTo(w.x - 12, w.y); ctx.quadraticCurveTo(w.x, w.y - 30, w.x + 12, w.y); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.moveTo(w.x - 6, w.y); ctx.quadraticCurveTo(w.x, w.y - 18, w.x + 6, w.y); ctx.fill();
  }
  for (const s of L.shots) {
    if (s.kind === 'snow') {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#8fb3d6'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 1, 0, 6.283); ctx.fill(); ctx.stroke();
    } else if (s.kind === 'flame') {
      ctx.fillStyle = 'rgba(255,120,30,.4)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 5, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ff7a1f'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ffe07a'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.45, 0, 6.283); ctx.fill();
    } else if (s.kind === 'shard') {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(tick * 0.3);
      ctx.fillStyle = '#7fe6ff'; ctx.strokeStyle = '#1c4a60'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(5, 0); ctx.lineTo(0, 9); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(178,92,255,.35)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 4, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#b25cff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#efdcff'; ctx.beginPath(); ctx.arc(s.x - 2, s.y - 2, 2, 0, 6.283); ctx.fill();
    }
  }
  for (const d of L.drops) {
    const shakeX = d.warn > 0 ? (Math.random() - .5) * 3 : 0;
    const armed = d.warn < 0, sx2 = armed ? 0 : shakeX;
    ctx.fillStyle = d.ice ? '#cdeeff' : '#8a80b8'; ctx.strokeStyle = d.ice ? '#4f86a8' : '#231e36'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(d.x - 9 + sx2, d.y); ctx.lineTo(d.x + sx2, d.y + 30); ctx.lineTo(d.x + 9 + sx2, d.y); ctx.closePath(); ctx.fill(); ctx.stroke();
    if (d.warn > 0) {
      const gy = groundBelow(d.x);
      ctx.fillStyle = `rgba(0,0,0,${0.15 + (1 - d.warn / 60) * 0.25})`;
      ctx.beginPath(); ctx.ellipse(d.x, gy, 14, 4, 0, 0, 6.283); ctx.fill();
    }
  }
  // wind: streaks drifting the way the air pushes
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const wz of L.winds) {
    if (wz.x > cam.x + VW || wz.x + wz.w < cam.x) continue;
    const n = Math.ceil(wz.w * wz.h / 2600);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      if (wz.dy) {
        const x = wz.x + hash(i, 3) * wz.w, y = wz.y + wz.h - ((hash(i, 7) * wz.h + tick * 5) % wz.h);
        ctx.moveTo(x, y); ctx.lineTo(x, y + 18);
      } else {
        const x = wz.x + ((hash(i, 3) * wz.w + tick * 4 * wz.dx) % wz.w + wz.w) % wz.w, y = wz.y + hash(i, 7) * wz.h;
        ctx.moveTo(x, y); ctx.lineTo(x - wz.dx * 22, y);
      }
    }
    ctx.stroke();
  }
  for (const bo of L.bolts) {
    const gy = groundBelow(bo.x), top = cam.y - 10;
    if (bo.warn > 0) {
      ctx.strokeStyle = `rgba(255,240,120,${Math.floor(tick / 3) % 2 ? 0.55 : 0.25})`; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(bo.x, top); ctx.lineTo(bo.x, gy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,240,120,.35)'; ctx.beginPath(); ctx.ellipse(bo.x, gy, 20, 5, 0, 0, 6.283); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,250,200,.95)'; ctx.lineWidth = 6; ctx.lineJoin = 'miter';
      ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.moveTo(bo.x, top);
      for (let y = top; y < gy; y += 36) ctx.lineTo(bo.x + (hash(y, bo.strike) - .5) * 26, y);
      ctx.lineTo(bo.x, gy); ctx.stroke(); ctx.shadowBlur = 0;
    }
  }
  for (const f of L.fires) {
    ctx.fillStyle = 'rgba(255,120,30,.45)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 4, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ff7a1f'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffe07a'; ctx.beginPath(); ctx.arc(f.x - 1, f.y - 1, f.r * 0.5, 0, 6.283); ctx.fill();
    if (tick % 2 === 0) parts.push({ x: f.x, y: f.y, vx: 0, vy: -0.3, life: 10, max: 10, r: 2.5, col: '255,150,50', g: 0 });
  }
  for (const q of parts) {
    ctx.fillStyle = `rgba(${q.col},${Math.min(1, q.life / q.max * 1.5)})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
  }
  ctx.font = '700 16px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center';
  for (const t of L.texts) {
    ctx.globalAlpha = Math.min(1, t.life / 20);
    ctx.fillStyle = 'rgba(13,27,42,.5)'; ctx.fillText(t.txt, t.x + 1.5, t.y + 1.5);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

const fmt = f => { const s = f / 60; return Math.floor(s / 60) + ':' + (s % 60).toFixed(2).padStart(5, '0'); };

function drawDarkness() {
  // only a circle of light around Pip; coins and big coins glow a little
  const sx = p.x + p.w / 2 - cam.x, sy = p.y + p.h / 2 - cam.y;
  const g = ctx.createRadialGradient(sx, sy, 60, sx, sy, 250);
  g.addColorStop(0, 'rgba(4,3,12,0)'); g.addColorStop(1, 'rgba(4,3,12,.94)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'lighter';
  for (const c of L.coins) if (!c.got) {
    const x = c.x - cam.x, y = c.y - cam.y;
    if (x > -20 && x < VW + 20) { ctx.fillStyle = 'rgba(255,210,63,.18)'; ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.283); ctx.fill(); }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawHud() {
  ctx.font = '600 22px Fredoka, system-ui, sans-serif';
  const txt = (s, x, y, align = 'left') => {
    ctx.textAlign = align;
    ctx.fillStyle = 'rgba(13,27,42,.45)'; ctx.fillText(s, x + 2, y + 2);
    ctx.fillStyle = '#fff'; ctx.fillText(s, x, y);
  };
  for (let i = 0; i < MAX_HP; i++) {
    ctx.fillStyle = 'rgba(13,27,42,.35)'; heartPath(30 + i * 28, 31, 11); ctx.fill();
    ctx.fillStyle = i < p.hp ? '#ff6b8a' : 'rgba(255,255,255,.25)'; heartPath(30 + i * 28, 29, 10); ctx.fill();
  }
  if (p.fire) { ctx.fillStyle = '#ff7a1f'; ctx.beginPath(); ctx.arc(30 + MAX_HP * 28, 29, 8, 0, 6.283); ctx.fill(); }
  drawCoin(30, 64, 0, 10);
  txt(String(got), 48, 72);
  for (let i = 0; i < 3; i++) {
    const c = L.big[i], x = 110 + i * 26;
    ctx.fillStyle = c && c.got ? '#ffd23f' : 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(x, 64, 9, 0, 6.283); ctx.fill();
    if (c && c.got) { ctx.fillStyle = '#fff6c9'; starPath(x, 64, 5, 2.2); ctx.fill(); }
  }
  txt(L.def.id + '  ' + L.def.name, VW / 2, 38, 'center');
  txt(fmt(time), VW - 24, 38, 'right');
  if (p.star > 0) {
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(VW - 124, 50, 100, 6);
    ctx.fillStyle = `hsl(${tick * 8 % 360},90%,60%)`; ctx.fillRect(VW - 124, 50, 100 * p.star / STAR_TIME, 6);
  }
  const b = L.boss;
  if (b && L.arena.on && !b.dead) {
    ctx.font = '600 16px Fredoka, system-ui, sans-serif'; txt(b.name, VW / 2, 66, 'center');
    ctx.fillStyle = 'rgba(13,27,42,.5)'; ctx.fillRect(VW / 2 - 122, 74, 244, 14);
    ctx.fillStyle = '#ff5d5d'; ctx.fillRect(VW / 2 - 120, 76, 240 * b.hp / 6, 10);
  }
  if (p.dead) {
    ctx.fillStyle = `rgba(13,27,42,${Math.min(0.8, p.dead / 25)})`; ctx.fillRect(0, 0, VW, VH);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawBackground();
  const sx = shake ? (Math.random() - .5) * shake * 2 : 0, sy = shake ? (Math.random() - .5) * shake * 2 : 0;
  ctx.save();
  ctx.translate(Math.round(-cam.x + sx), Math.round(-cam.y + sy));
  drawTiles();
  drawProps();
  for (const e of L.enemies) drawEnemy(e);
  if (L.boss) drawBoss(L.boss);
  drawPlayer();
  drawEffects();
  ctx.restore();
  if (L.def.dark && state !== 'title') drawDarkness();
  if (flash > 0 && W.bg !== 'castle') { ctx.fillStyle = `rgba(255,255,230,${flash / 16})`; ctx.fillRect(0, 0, VW, VH); }
  if (state !== 'title') drawHud();
}

// ---------- input ----------
const kb = {}, input = { left: false, right: false, jump: false, jumpPressed: false, firePressed: false };
const JUMP_KEYS = ['Space', 'KeyW', 'ArrowUp', 'KeyZ'], FIRE_KEYS = ['KeyX', 'KeyK', 'KeyJ'];
let padJump = false, padStart = false, padFire = false;

addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  kb[k] = true;
  touchMode = false;
  if (JUMP_KEYS.includes(k) && state === 'play') input.jumpPressed = true;
  if (FIRE_KEYS.includes(k) && state === 'play') input.firePressed = true;
  if (k === 'KeyP' || k === 'Escape') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  if (k === 'KeyM') setVolume(VOL > 0 && !muted ? 0 : 60);
  if (k === 'KeyR' && (state === 'play' || state === 'pause' || state === 'done')) startLevel(levelIndex);
  if (k === 'Enter') { if (state === 'title') startLevel(levelIndex); else if (state === 'done') nextOrMenu(); }
});
addEventListener('keyup', e => { kb[e.code] = false; });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; });

function pollInput() {
  const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
  let gl = false, gr = false, gj = false, gs = false, gf = false;
  if (gp) {
    const ax = gp.axes[0] || 0, b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    gl = ax < -0.35 || b(14); gr = ax > 0.35 || b(15); gj = b(0); gs = b(9); gf = b(2) || b(1);
  }
  input.left = !!(kb.ArrowLeft || kb.KeyA || gl || touch.left);
  input.right = !!(kb.ArrowRight || kb.KeyD || gr || touch.right);
  input.jump = JUMP_KEYS.some(k => kb[k]) || gj || touch.jump;
  if (gj && !padJump) {
    if (state === 'play') input.jumpPressed = true;
    else if (state === 'title') startLevel(levelIndex);
    else if (state === 'done') nextOrMenu();
  }
  if (gf && !padFire && state === 'play') input.firePressed = true;
  if (gs && !padStart) { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  padJump = gj; padStart = gs; padFire = gf;
}

// ---------- touch controls ----------
let touchMode = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const touch = { left: false, right: false, jump: false, fire: false };
const touchPad = document.getElementById('touch');
const tbtn = { left: document.getElementById('tLeft'), right: document.getElementById('tRight'),
               jump: document.getElementById('tJump'), fire: document.getElementById('tFire') };
// recompute from every finger each time, so a thumb can slide from ← to → without lifting
function readTouches(e) {
  e.preventDefault();
  touchMode = true;
  const now = { left: false, right: false, jump: false, fire: false };
  for (const t of e.touches) {
    const el = document.elementFromPoint(t.clientX, t.clientY), b = el && el.closest('.tbtn');
    if (b && !b.hidden) now[b.dataset.k] = true;
  }
  for (const k in now) {
    if (now[k] && !touch[k] && state === 'play') {
      if (k === 'jump') input.jumpPressed = true;
      if (k === 'fire') input.firePressed = true;
    }
    touch[k] = now[k];
    tbtn[k].classList.toggle('on', now[k]);
  }
}
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) touchPad.addEventListener(ev, readTouches, { passive: false });
addEventListener('touchstart', () => { touchMode = true; }, { passive: true });

function syncTouchUi() {
  const on = touchMode && state === 'play';
  if (touchPad.hidden === on) touchPad.hidden = !on;
  const fire = on && p.fire && !p.dead;
  if (tbtn.fire.hidden === fire) tbtn.fire.hidden = !fire;
}

// ---------- progress ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('skyhop.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('skyhop.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked: progress lasts this session only */ } }
};
// v2 added levels 3 and 4 to every world, so boss levels moved from X-3 to X-5
if (store.get('v', 1) < 2) {
  const old = store.get('unlocked', 0);
  store.set('unlocked', Math.floor(old / 3) * 5 + (old % 3 === 2 ? 4 : old % 3));
  for (const w of [1, 2, 3]) for (const k of ['best.', 'big.']) {
    const v = store.get(k + w + '-3', null);
    if (v !== null) store.set(k + w + '-5', v);
    try { localStorage.removeItem('skyhop.' + k + w + '-3'); } catch (e) { /* storage blocked */ }
  }
  store.set('v', 2);
}
let unlocked = store.get('unlocked', 0);

// ---------- screens ----------
const $ = id => document.getElementById(id);
const scr = { title: $('title'), pause: $('pause'), done: $('done') };
function show(name) { for (const k in scr) scr[k].hidden = k !== name; }

function buildLevelButtons() {
  const box = $('levelBtns'); box.innerHTML = '';
  const current = Math.min(unlocked, LEVELS.length - 1);
  for (const w of [1, 2, 3, 4, 5]) {
    const row = document.createElement('div'); row.className = 'wrow';
    const name = document.createElement('span'); name.className = 'wname'; name.textContent = WORLDS[w].name;
    row.appendChild(name);
    LEVELS.forEach((lv, i) => {
      if (lv.world !== w) return;
      const b = document.createElement('button');
      b.className = 'lvl' + (i === current ? '' : ' ghost');
      b.textContent = lv.id + (store.get('best.' + lv.id, null) ? ' ✓' : '');
      b.disabled = i > unlocked;
      b.onclick = () => startLevel(i);
      row.appendChild(b);
    });
    box.appendChild(row);
  }
}

function startLevel(i) {
  levelIndex = i;
  L = loadLevel(i);
  resetPlayer(L.start); respawn = L.start;
  time = 0; got = 0; deaths = 0; parts = []; look = 0; finishT = 0; flash = 0;
  cam.x = 0; cam.y = LH * T - VH;
  input.jumpPressed = false; input.firePressed = false;
  state = 'play'; show(null);
  if (document.activeElement) document.activeElement.blur();
  if (AC && AC.state === 'suspended') AC.resume();
}
function pause() { state = 'pause'; show('pause'); }
function resume() { state = 'play'; show(null); input.jumpPressed = false; }
function toMenu() {
  state = 'title'; levelIndex = Math.min(unlocked, LEVELS.length - 1);
  L = loadLevel(levelIndex); resetPlayer(L.start);
  cam.y = LH * T - VH;
  buildLevelButtons(); show('title');
}
function nextOrMenu() { if (levelIndex + 1 < LEVELS.length) startLevel(levelIndex + 1); else toMenu(); }

function finishLevel() {
  state = 'done';
  carry = { hp: p.hp, fire: p.fire };
  const id = L.def.id, last = levelIndex === LEVELS.length - 1, bossLevel = !!L.bossKind;
  let best = store.get('best.' + id, null);
  if (!best || time < best) { best = time; store.set('best.' + id, time); }
  const bigNow = L.big.filter(c => c.got).length, bigBest = Math.max(bigNow, store.get('big.' + id, 0));
  store.set('big.' + id, bigBest);
  if (!last && unlocked < levelIndex + 1) { unlocked = levelIndex + 1; store.set('unlocked', unlocked); }
  $('dTitle').textContent = last ? 'You beat Skyhop!' : bossLevel ? 'World ' + L.def.world + ' clear!' : 'Level clear!';
  $('dNote').hidden = !last && !bossLevel;
  $('dNote').textContent = last ? 'Thanks for playing! Try to find every big coin.' : bossLevel ? 'Next: ' + WORLDS[L.def.world + 1].name : '';
  $('dTime').textContent = fmt(time);
  $('dBest').textContent = fmt(best);
  $('dCoins').textContent = got;
  $('dBig').textContent = bigNow + ' / 3';
  $('dDeaths').textContent = deaths;
  $('nextBtn').hidden = last;
  $('nextBtn').textContent = bossLevel ? 'Next world' : 'Next level';
  setTimeout(() => { if (state === 'done') show('done'); }, 400);
}

$('resumeBtn').onclick = resume;
$('restartBtn').onclick = () => startLevel(levelIndex);
$('menuBtn').onclick = toMenu;
$('againBtn').onclick = () => startLevel(levelIndex);
$('nextBtn').onclick = () => startLevel(levelIndex + 1);
$('doneMenuBtn').onclick = toMenu;

const volInputs = [...document.querySelectorAll('.volIn')];
function setVolume(v) {
  VOL = clamp(v, 0, 100) / 100; muted = VOL <= 0;
  volInputs.forEach(i => { i.value = Math.round(VOL * 100); });
}
volInputs.forEach(i => { i.oninput = () => setVolume(+i.value); });

// ---------- main loop: fixed 60 Hz physics, render every frame ----------
const STEP = 1000 / 60;
let last = 0, acc = 0;
function step() {
  pollInput();
  tick++;
  if (state === 'play') update();
  else if (state === 'title') cam.x = (Math.sin(tick * 0.003 - 1.57) * 0.5 + 0.5) * (LW * T - VW);
  else if (state === 'done') updateParticles();
}
function frame(ts) {
  requestAnimationFrame(frame);
  acc += Math.min(100, ts - (last || ts)); last = ts;
  let n = 0;
  while (acc >= STEP && n < 5) { step(); acc -= STEP; n++; }
  render();
  syncTouchUi();
}

// debug hook for tuning the feel from the console
window.__sky = {
  get p() { return p; }, get L() { return L; }, get state() { return state; }, get got() { return got; },
  kb, cam, startLevel, render, syncTouchUi,
  step(n = 1) { for (let i = 0; i < n; i++) step(); }
};

toMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
